name: "One-shot NVIDIA + Google bootstrap"

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - .github/nvidia-google.once

permissions:
  contents: read

concurrency:
  group: nvidia-google-once-ai-army-provider-v3
  cancel-in-progress: false

jobs:
  bootstrap:
    if: ${{ github.ref_name == 'ai-army/provider-v3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target branch without write credentials
        uses: actions/checkout@v6
        with:
          ref: ai-army/provider-v3
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile focused runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m py_compile \
            scripts/secure_account_evidence.py \
            scripts/validate_secure_evidence.py \
            scripts/probe_providers.py \
            scripts/probe_nvidia_google_focused.py \
            scripts/focused_nvidia_streaming_adapter.py \
            scripts/run_nvidia_orchestrator_mission.py \
            scripts/run_nvidia_orchestrator_mission_focused.py \
            scripts/run_nvidia_google_compact_mission.py \
            scripts/google_staging_readiness.py

      - name: Collect current redacted NVIDIA and Google evidence
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: >-
          python scripts/secure_account_evidence.py
          --provider nvidia
          --provider google
          --output artifacts/secure_account_evidence.json

      - name: Validate evidence
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python scripts/validate_secure_evidence.py --input artifacts/secure_account_evidence.json

      - name: Probe exact NVIDIA Nemotron and Google candidates through focused gates
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_PROBE_MODEL: gemini-3.8-flash
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_PROBE_MODEL: nvidia/nemotron-3.5-lightning-30b-a3b
        run: >-
          python scripts/probe_nvidia_google_focused.py
          --evidence-file artifacts/secure_account_evidence.json
          --output artifacts/provider_probe.json

      - name: Replan malformed NVIDIA Google Lead Engineer output with compact context
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          RESUME_MISSION_ID: nvidia-autonomous-orchestrator-34433295732
          RESUME_RUN_ID: "34433295732"
          RESUME_RESULT_HASH: 654883ae88b32f138cf6b9ff
          RESUME_REVISION: "3"
        run: python scripts/run_nvidia_google_compact_mission.py

      - name: Deterministically review Google readiness and NVIDIA integration scope
        if: always()
        run: >-
          python scripts/google_staging_readiness.py
          --evidence artifacts/secure_account_evidence.json
          --probe artifacts/provider_probe.json
          --result-inbox artifacts/result_inbox.json
          --output artifacts/google_staging_readiness.json

      - name: Build redacted one-shot summary
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def read(path, default):
              try:
                  value = json.loads(Path(path).read_text(encoding="utf-8"))
                  return value if isinstance(value, dict) else default
              except Exception:
                  return default

          evidence = read("artifacts/secure_account_evidence.json", {})
          probe = read("artifacts/provider_probe.json", {})
          mission = read("artifacts/mission_state.json", {})
          inbox = read("artifacts/result_inbox.json", {})
          readiness = read("artifacts/google_staging_readiness.json", {})
          providers = evidence.get("providers") if isinstance(evidence.get("providers"), dict) else {}
          probe_items = probe.get("providers") if isinstance(probe.get("providers"), list) else []
          integration = readiness.get("lead_integration") if isinstance(readiness.get("lead_integration"), dict) else {}
          summary = {
              "schema_version": "nvidia-google-once-v8",
              "provider_focus": ["nvidia", "google"],
              "run_mode": "LEAD_MISSION_COMPACT_REPLAN",
              "nvidia_selected_model": "nvidia/nemotron-3.5-lightning-30b-a3b",
              "secret_presence": {
                  name: bool(isinstance(lane, dict) and lane.get("secret_present") is True)
                  for name, lane in providers.items()
              },
              "catalog_status": {
                  name: lane.get("status") if isinstance(lane, dict) else "MISSING"
                  for name, lane in providers.items()
              },
              "probe_status": {
                  str(item.get("provider")): str(item.get("status"))
                  for item in probe_items if isinstance(item, dict) and item.get("provider")
              },
              "probe_http_status": {
                  str(item.get("provider")): item.get("http_status")
                  for item in probe_items if isinstance(item, dict) and item.get("provider")
              },
              "probe_model_calls": int(probe.get("model_calls", 0) or 0),
              "lead_mission_id": mission.get("mission_id"),
              "lead_mission_state": mission.get("state"),
              "lead_revision": mission.get("revision"),
              "lead_replan_count": mission.get("replan_count"),
              "lead_replan_reason": mission.get("replan_reason"),
              "lead_result_status": mission.get("result_status"),
              "lead_result_complete": mission.get("result_complete") is True,
              "lead_result_hash": mission.get("result_hash"),
              "lead_result_inbox_status": inbox.get("status"),
              "lead_next_action": inbox.get("next_action"),
              "lead_nvidia_external_calls": int(mission.get("nvidia_external_calls", 0) or 0),
              "lead_integration_decision": integration.get("decision"),
              "lead_integration_reason": integration.get("reason"),
              "google_readiness_state": readiness.get("state"),
              "google_readiness_next_action": readiness.get("next_action"),
              "google_repeat_nvidia_call_allowed": readiness.get("repeat_nvidia_call_allowed") is True,
              "google_external_model_calls_recommended": int(readiness.get("external_model_calls_recommended", 0) or 0),
              "paid_execution_count": int(mission.get("paid_execution_count", 0) or 0),
              "paid_fallback_count": 0,
              "production_active": False,
              "secret_values_persisted": 0,
          }
          Path("artifacts/nvidia_google_once_summary.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, sort_keys=True))
          PY
          python scripts/audit_secret_safety.py --root .

      - name: Upload redacted one-shot artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nvidia-google-once-${{ github.run_id }}
          path: |
            artifacts/secure_account_evidence.json
            artifacts/provider_probe.json
            artifacts/google_staging_readiness.json
            artifacts/nvidia_google_once_summary.json
            artifacts/mission_state.json
            artifacts/result_inbox.json
          if-no-files-found: ignore
          retention-days: 7
