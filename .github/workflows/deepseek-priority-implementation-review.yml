name: DeepSeek V4.1 Flash priority implementation review

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - .github/deepseek-priority-implementation-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseek-priority-implementation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout exact triggering source without write credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile DeepSeek priority review path
        run: |
          python -m py_compile \
            scripts/deepseek_specialist_trial.py \
            scripts/deepseek_specialist_trial_v2.py \
            scripts/deepseek_specialist_trial_v3.py \
            scripts/deepseek_specialist_trial_v4.py \
            scripts/deepseek_priority_implementation_review.py

      - name: Run deterministic DeepSeek transport and integrity tests
        run: |
          python -m unittest \
            tests.test_deepseek_specialist_trial \
            tests.test_deepseek_specialist_trial_v2 \
            tests.test_deepseek_specialist_trial_v3 \
            tests.test_deepseek_specialist_trial_v4 -v

      - name: Verify priority review dry-run stays offline
        run: |
          set -euo pipefail
          python scripts/deepseek_priority_implementation_review.py \
            --output artifacts/deepseek_priority_implementation_dry_run.json
          python -m json.tool artifacts/deepseek_priority_implementation_dry_run.json >/dev/null

      - name: Run explicitly approved paid DeepSeek V4.1 Flash priority review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/deepseek_priority_implementation_review.py \
            --network \
            --confirm DEEPSEEK_PAID_TRIAL \
            --output artifacts/deepseek_priority_implementation_review.json
          python -m json.tool artifacts/deepseek_priority_implementation_review.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/deepseek_priority_implementation_review.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "status": report.get("status"),
              "requested_model": report.get("requested_model"),
              "successful_task_count": report.get("successful_task_count", 0),
              "selected_task_count": report.get("selected_task_count", 0),
              "average_quality_score": report.get("average_quality_score", 0),
              "estimated_current_cost_usd": report.get("estimated_current_cost_usd", 0),
              "conservative_cost_usd": report.get("conservative_cost_usd", 0),
              "priority_sequence": report.get("priority_sequence", []),
              "generic_paid_fallback": report.get("generic_paid_fallback"),
              "production_routing_changed": report.get("production_routing_changed"),
          }, sort_keys=True))
          assert report.get("generic_paid_fallback") is False
          assert report.get("production_routing_changed") is False
          assert report.get("repository_write") is False
          assert report.get("deploy") is False
          assert report.get("publish") is False
          assert report.get("secret_mutation") is False
          assert float(report.get("conservative_cost_usd", 0)) <= float(report.get("max_estimated_cost_usd", 0.25))
          assert report.get("status") in {"TRIAL_READY", "TRIAL_PARTIAL"}
          PY

      - name: Upload DeepSeek priority review evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deepseek-priority-implementation-review-${{ github.run_id }}
          path: |
            artifacts/deepseek_priority_implementation_dry_run.json
            artifacts/deepseek_priority_implementation_review.json
          if-no-files-found: ignore
          retention-days: 7
