name: Legacy commander handoff (disabled pending provider migration)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DELEGATE to create a bounded commander handoff packet
        required: true
        type: string
      brief:
        description: Delegation brief (no secrets; maximum 3000 characters)
        required: true
        type: string
      context:
        description: Optional constraints and product context (maximum 6000 characters)
        required: false
        default: ""
        type: string
      general_model:
        description: Legacy compatibility input; current provider commander routing does not use this value
        required: false
        default: ""
        type: string
      engineering_model:
        description: Legacy compatibility input; current provider commander routing does not use this value
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: bounded-ai-delegation
  cancel-in-progress: false

jobs:
  delegation:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate explicit read-only gate
        env:
          REF_NAME: ${{ github.ref_name }}
          CONFIRM: ${{ inputs.confirm }}
          DELEGATION_BRIEF: ${{ inputs.brief }}
          DELEGATION_CONTEXT: ${{ inputs.context }}
          GENERAL_MODEL: ${{ inputs.general_model }}
          ENGINEERING_MODEL: ${{ inputs.engineering_model }}
        shell: bash
        run: |
          set -euo pipefail
          CONFIRM="$(printf '%s' "$CONFIRM" | tr -d '[:space:]')"
          if [[ "$REF_NAME" != "main" ]]; then
            echo "Delegation is allowed only from main." >&2
            exit 1
          fi
          if [[ "$CONFIRM" != "DELEGATE" ]]; then
            echo "Type DELEGATE to run the bounded delegation lane." >&2
            exit 1
          fi
          if [[ -z "$DELEGATION_BRIEF" || ${#DELEGATION_BRIEF} -gt 3000 ]]; then
            echo "Delegation brief must be 1-3000 characters." >&2
            exit 1
          fi
          if [[ ${#DELEGATION_CONTEXT} -gt 6000 ]]; then
            echo "Delegation context must be at most 6000 characters." >&2
            exit 1
          fi
          for model in "$GENERAL_MODEL" "$ENGINEERING_MODEL"; do
            if [[ -n "$model" && ( ${#model} -gt 160 || ! "$model" =~ ^[A-Za-z0-9._:/-]+$ ) ]]; then
              echo "Model overrides must use provider-safe characters." >&2
              exit 1
            fi
          done
          echo "Read-only role-scoped commander gate validated for main."

      - name: Check out reviewed delegation sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bounded OpenAI-compatible client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --no-cache-dir "openai>=1.0,<2"

      - name: Read-only role model preflight
        id: model_preflight
        env:
          GENERAL_COMMANDER_MODEL: ${{ inputs.general_model }}
          ENGINEERING_COMMANDER_MODEL: ${{ inputs.engineering_model }}
          MODEL_REGISTRY_PATH: config/model_registry.json
          COMMANDER_PACKET_PATH: artifacts/commander_packet.json
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preflight_openrouter_models.py

      - name: Run role-scoped commanders in parallel
        if: ${{ steps.model_preflight.outputs.ready == 'true' }}
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          DELEGATION_BRIEF: ${{ inputs.brief }}
          DELEGATION_CONTEXT: ${{ inputs.context }}
          GENERAL_COMMANDER_MODEL: ${{ steps.model_preflight.outputs.general_model }}
          ENGINEERING_COMMANDER_MODEL: ${{ steps.model_preflight.outputs.engineering_model }}
          MODEL_REGISTRY_PATH: config/model_registry.json
          COMMANDER_PACKET_PATH: artifacts/commander_packet.json
        shell: bash
        run: |
          set -euo pipefail
          python scripts/agent_delegation.py

      - name: Validate commander handoff packet
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/commander_packet.json
          python - <<'PY'
          import json
          from pathlib import Path

          packet = json.loads(Path("artifacts/commander_packet.json").read_text(encoding="utf-8"))
          if packet.get("status") not in {"blocked", "ready", "awaiting_commander_approval", "completed_with_warnings"}:
              raise SystemExit("unexpected commander packet status")
          if packet.get("execution_allowed") not in {False, True}:
              raise SystemExit("execution_allowed must be boolean")
          if packet.get("paid_fallback") is True:
              raise SystemExit("paid fallback must remain disabled")
          calls = packet.get("model_calls", 0)
          if not isinstance(calls, int) or calls < 0 or calls > 2:
              raise SystemExit("model call budget is invalid")
          if "AI_API_KEY" in json.dumps(packet, ensure_ascii=False):
              raise SystemExit("secret-shaped key leaked into commander packet")
          print("Commander packet contract passed.")
          PY

      - name: Upload commander handoff artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: commander-handoff
          path: artifacts/commander_packet.json
          if-no-files-found: error
          retention-days: 7
