name: Verify DeepSeek V4.1 Flash joint runtime improvements

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseek-joint-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile changed runtime
        run: |
          python -m py_compile \
            scripts/specialist_lane_router.py \
            scripts/failure_aware_specialist_retry.py \
            scripts/organization_coordination.py \
            tests/test_deepseek_joint_runtime_improvements.py \
            tests/test_deepseek_priority_circuit_dispatch.py
      - name: Run DeepSeek joint regression tests
        run: |
          python -m unittest \
            tests.test_deepseek_joint_runtime_improvements \
            tests.test_deepseek_priority_circuit_dispatch -v
      - name: Assert no generic paid fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          retry = Path('scripts/failure_aware_specialist_retry.py').read_text(encoding='utf-8')
          router = Path('scripts/specialist_lane_router.py').read_text(encoding='utf-8')
          assert 'paid fallback' in retry.lower()
          assert 'generic_paid_fallback' not in router
          assert 'WorkerCircuitBreaker' in retry
          assert 'PriorityTaskQueue' in retry
          print('DEEPSEEK_JOINT_RUNTIME=PASS')
          PY
