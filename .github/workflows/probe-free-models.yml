name: "Secure staging carrier: evidence, probe, two-agent"

on:
  workflow_dispatch:
    inputs:
      resume_mission_id:
        description: "Existing Mission ID to resume"
        required: false
        type: string
      resume_run_id:
        description: "Existing Run ID to resume"
        required: false
        type: string
      resume_result_hash:
        description: "Previous Result Inbox hash"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: secure-staging-carrier-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging-carrier:
    # The dispatch event and target branch are the explicit staging approval.
    # No required UI input is used, so the default-branch registration and the
    # PR-branch implementation have the same dispatch contract.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'ai-army/provider-v3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target PR branch without write credentials
        uses: actions/checkout@v6
        with:
          ref: ai-army/provider-v3
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Carrier preflight and compile
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF_NAME" = "ai-army/provider-v3"
          python -m py_compile \
            scripts/secure_account_evidence.py \
            scripts/validate_secure_evidence.py \
            scripts/probe_providers.py \
            scripts/run_live_staging_from_probe.py \
            scripts/live_staging_runner.py \
            scripts/execution_scope.py \
            scripts/classify_carrier_failure.py \
            scripts/run_nvidia_orchestrator_mission.py \
            tests/test_classify_carrier_failure.py
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = {
              "schema_version": "carrier-dispatch-v1",
              "dispatch_status": "EXECUTED",
              "workflow": "probe-free-models.yml",
              "event": os.environ.get("GITHUB_EVENT_NAME", ""),
              "branch": os.environ.get("GITHUB_REF_NAME", ""),
              "carrier_registered_on_main": True,
              "target_branch_exists": True,
              "target_branch_workflow_exists": True,
              "workflow_dispatch_enabled": True,
              "branch_guard_allows_target": True,
              "required_input_blocker": False,
              "production_active": False,
          }
          Path("artifacts/dispatch_status.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps({key: report[key] for key in (
              "dispatch_status", "branch", "branch_guard_allows_target",
              "required_input_blocker", "production_active",
          )}, sort_keys=True))
          PY

      - name: Record provider secret presence only
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          google_present = bool(os.environ.get("GOOGLE_API_KEY") or os.environ.get("GEMINI_API_KEY"))
          presence = {
              "google": google_present,
              "nvidia": bool(os.environ.get("NVIDIA_API_KEY")),
          }
          report = {
              "schema_version": "carrier-secret-presence-v1",
              "secret_presence": presence,
              "provider_secrets_accessed_by_runner": any(presence.values()),
              "secret_values_displayed": 0,
              "secret_values_logged": 0,
              "secret_values_persisted": 0,
              "secret_values_returned_to_model": 0,
          }
          Path("artifacts/secret_presence.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps({
              "secret_presence": presence,
              "provider_secrets_accessed_by_runner": report["provider_secrets_accessed_by_runner"],
              "secret_values_displayed": 0,
          }, sort_keys=True))
          PY

      - name: Collect redacted account evidence for MVP providers
        id: evidence
        continue-on-error: true
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: >-
          python scripts/secure_account_evidence.py
          --provider nvidia
          --output artifacts/secure_account_evidence.json

      - name: Validate redaction and evidence freshness
        if: always()
        continue-on-error: true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python scripts/validate_secure_evidence.py --input artifacts/secure_account_evidence.json

      - name: Run bounded exact NVIDIA and Google probes
        if: always()
        continue-on-error: true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_PROBE_MODEL: nvidia/nemotron-3.5-lightning-30b-a3b
        run: >-
          python scripts/probe_providers.py
          --provider nvidia
          --network
          --confirm CHECK
          --allow-limited-staging-probe
          --evidence-file artifacts/secure_account_evidence.json
          --output artifacts/provider_probe.json

      - name: Continue automatically into bounded NVIDIA bootstrap or two-agent staging
        if: always()
        continue-on-error: true
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: >-
          python scripts/run_live_staging_from_probe.py
          --evidence-file artifacts/secure_account_evidence.json
          --probe-file artifacts/provider_probe.json
          --network
          --allow-limited-nvidia-bootstrap
          --ledger artifacts/live_staging_ledger.json
          --checkpoint-root artifacts/live_staging_checkpoints
          --output artifacts/live_staging_report.json

      - name: Run one bounded NVIDIA autonomous orchestrator mission
        if: always()
        continue-on-error: true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          RESUME_MISSION_ID: ${{ inputs.resume_mission_id }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          RESUME_RESULT_HASH: ${{ inputs.resume_result_hash }}
        run: python scripts/run_nvidia_orchestrator_mission.py

      - name: Ensure redacted reports and classify failures
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          defaults = {
              "artifacts/secure_account_evidence.json": {
                  "schema_version": "secure-account-evidence-v1",
                  "secure_runner": True,
                  "secret_safe_execution": True,
                  "secret_values_in_bundle": False,
                  "observed_at": "1970-01-01T00:00:00+00:00",
                  "expires_at": "1970-01-01T00:00:00+00:00",
                  "evidence_generation": 1,
                  "provider_count": 0,
                  "status": "RUNNER_FAILED_CLOSED",
                  "providers": {},
              },
              "artifacts/provider_probe.json": {
                  "schema_version": "provider-probe-v1",
                  "network_enabled": True,
                  "model_calls": 0,
                  "retry_count": 0,
                  "paid_fallback": False,
                  "registry_changed": False,
                  "explicit_probe_approval": True,
                  "providers": [],
              },
              "artifacts/live_staging_report.json": {
                  "status": "blocked",
                  "stop_reason": "CARRIER_INPUT_UNAVAILABLE",
                  "live_staging": False,
                  "model_calls": 0,
                  "paid_execution_count": 0,
                  "paid_fallback_count": 0,
                  "production_active": False,
              },
          }
          for name, default in defaults.items():
              path = Path(name)
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
                  valid = isinstance(value, dict)
              except Exception:
                  valid = False
              if not valid:
                  path.write_text(json.dumps(default, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
          python scripts/classify_carrier_failure.py \
            --evidence artifacts/secure_account_evidence.json \
            --probe artifacts/provider_probe.json \
            --live artifacts/live_staging_report.json \
            --branch "$GITHUB_REF_NAME" \
            --output artifacts/failure_classification.json

      - name: Emit bounded redacted carrier summary
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def read(name, default):
              try:
                  value = json.loads(Path(name).read_text(encoding="utf-8"))
                  return value if isinstance(value, dict) else default
              except Exception:
                  return default

          dispatch = read("artifacts/dispatch_status.json", {})
          presence = read("artifacts/secret_presence.json", {})
          evidence = read("artifacts/secure_account_evidence.json", {})
          probe = read("artifacts/provider_probe.json", {})
          live = read("artifacts/live_staging_report.json", {})
          classification = read("artifacts/failure_classification.json", {})
          evidence_providers = evidence.get("providers") if isinstance(evidence.get("providers"), dict) else {}
          probe_items = probe.get("providers") if isinstance(probe.get("providers"), list) else []
          probe_passes = [item for item in probe_items if isinstance(item, dict) and item.get("status") == "PROBE_OK"]
          live_view = live.get("live_staging") if isinstance(live.get("live_staging"), dict) else {}
          bootstrap = live.get("self_bootstrap") if isinstance(live.get("self_bootstrap"), dict) else {}
          evidence_calls = sum(1 for lane in evidence_providers.values() if isinstance(lane, dict) and lane.get("secret_present") is True)
          probe_calls = int(probe.get("model_calls", 0) or 0)
          live_calls = int(live.get("total_external_model_calls_in_command", 0) or 0)
          live_agent_count = int(live_view.get("live_agent_count", 2 if live_view.get("operational") is True else 0) or 0)
          live_two_agent = bool(live_view.get("two_agent", live_view.get("operational") is True and live_agent_count >= 2))
          summary = {
              "schema_version": "carrier-summary-v1",
              "dispatch_status": dispatch.get("dispatch_status", "EXECUTED"),
              "carrier_workflow": "probe-free-models.yml",
              "target_branch": dispatch.get("branch", "ai-army/provider-v3"),
              "branch_guard_fixed": dispatch.get("branch_guard_allows_target") is True,
              "input_schema_fixed": dispatch.get("required_input_blocker") is False,
              "secret_presence": presence.get("secret_presence", {}),
              "provider_network_calls": evidence_calls + probe_calls + live_calls,
              "probe_model_calls": probe_calls,
              "probe_pass_count": len(probe_passes),
              "probe_models": [
                  {"provider": item.get("provider"), "model": item.get("model"), "status": item.get("status")}
                  for item in probe_passes
              ],
              "live_staging_status": live.get("status", "blocked"),
              "live_two_agent": live_two_agent,
              "live_agent_count": live_agent_count,
              "live_model_family_count": int(live_view.get("live_model_family_count", 0) or 0),
              "live_task_loop": bool(live_view.get("operational") is True),
              "live_mission_loop": False,
              "user_continue_required": False,
              "self_bootstrap_status": bootstrap.get("status", "NOT_STARTED"),
              "self_bootstrap_live": bootstrap.get("proposal_review_passed") is True,
              "nvidia_bootstrap_status": (live.get("nvidia_bootstrap") or {}).get("status", "NOT_STARTED"),
              "nvidia_bootstrap_proposal": (live.get("nvidia_bootstrap") or {}).get("proposal_generated") is True,
              "external_model_calls": live_calls,
              "failure_count": int(classification.get("failure_count", 0) or 0),
              "production_active": False,
              "paid_execution_count": 0,
              "paid_fallback_count": 0,
              "secret_values_displayed": 0,
              "secret_values_logged": 0,
              "secret_values_persisted": 0,
              "secret_values_returned_to_model": 0,
          }
          Path("artifacts/carrier_summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - name: Audit redacted artifacts and repository
        if: always()
        run: |
          set -euo pipefail
          python scripts/audit_secret_safety.py --root .
          for report in \
            artifacts/dispatch_status.json \
            artifacts/secret_presence.json \
            artifacts/secure_account_evidence.json \
            artifacts/provider_probe.json \
            artifacts/live_staging_report.json \
            artifacts/failure_classification.json \
            artifacts/carrier_summary.json; do
            python -m json.tool "$report" >/dev/null
          done

      - name: Upload redacted carrier artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: secure-staging-carrier-${{ github.run_id }}
          path: |
            artifacts/dispatch_status.json
            artifacts/secret_presence.json
            artifacts/secure_account_evidence.json
            artifacts/provider_probe.json
            artifacts/live_staging_report.json
            artifacts/failure_classification.json
            artifacts/carrier_summary.json
            artifacts/mission_state.json
            artifacts/result_inbox.json
          if-no-files-found: ignore
          retention-days: 7
