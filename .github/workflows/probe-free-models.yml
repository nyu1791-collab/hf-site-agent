name: Probe exact OpenRouter free endpoints

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PROBE_FREE_WORKERS to run at most one exact probe per worker role
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.ref_name == 'main' && github.event.inputs.confirm == 'PROBE_FREE_WORKERS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed probe
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate redacted pre-live worker plan (no network)
        run: |
          set -euo pipefail
          python scripts/live_probe_plan.py --provider openrouter --max-total-requests 24 --output artifacts/live_probe_plan.json
          python -m json.tool artifacts/live_probe_plan.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path("artifacts/live_probe_plan.json").read_text(encoding="utf-8"))
          assert plan["final"]["state"] == "LIVE_PROBE_PLAN_READY"
          assert plan["budget"]["estimated_requests"] == 5
          assert plan["plans"][0]["estimated_tokens"] == 1600
          assert plan["plans"][0]["estimated_cost"] == "UNKNOWN"
          assert plan["auto_execution_allowed"] is False
          assert plan["safety"]["paid_calls"] == 0
          assert plan["safety"]["compute_jobs_started"] == 0
          print(json.dumps({"estimated_requests": 5, "estimated_cost": "UNKNOWN", "live_probe_enabled": False}))
          PY
      - name: Discover and send bounded exact worker probes
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.AI_API_KEY }}
          FREE_WORKER_PROBE_OUTPUT: artifacts/free_worker_probe.json
        run: python scripts/probe_free_workers.py --network
      - name: Validate public probe report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/free_worker_probe.json").read_text(encoding="utf-8"))
          assert report["provider_allow_fallbacks"] is False
          assert report["models_parameter_sent"] is False
          assert report["web_search"] is False
          assert report["paid_fallback"] is False
          assert report["retries"] == 0
          assert 0 <= report["model_calls"] <= 4
          for item in report["results"]:
              assert item["request_count"] == 1
              assert item["retry_count"] == 0
              assert item["fallback_used"] is False
              assert item["status"] != "MODEL_MISMATCH" or item["response_model"] != item["requested_model"]
          print(json.dumps({
              "status": report["status"],
              "model_calls": report["model_calls"],
              "selected_probe_models": report["selected_probe_models"],
              "credits_checked": report["credits_checked"],
              "credits_unchanged": report["credits_unchanged"],
              "results": [
                  {
                      "model": item["requested_model"],
                      "status": item["status"],
                      "http_status": item["http_status"],
                      "response_model": item["response_model"],
                      "usage_cost": item["usage_cost"],
                  }
                  for item in report["results"]
              ],
          }, ensure_ascii=False))
          PY
      - name: Upload redacted probe evidence
        uses: actions/upload-artifact@v6
        with:
          name: exact-free-model-probe
          path: artifacts/free_worker_probe.json
          if-no-files-found: error
          retention-days: 14
