name: DeepSeek V4.1 specialist trial

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - .github/deepseek-specialist-trial-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseek-specialist-trial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout exact triggering source without write credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile DeepSeek specialist trial
        run: python -m py_compile scripts/deepseek_specialist_trial.py scripts/deepseek_specialist_trial_v2.py scripts/deepseek_specialist_trial_v3.py

      - name: Run deterministic DeepSeek routing and budget tests
        run: python -m unittest tests.test_deepseek_specialist_trial tests.test_deepseek_specialist_trial_v2 tests.test_deepseek_specialist_trial_v3 -v

      - name: Verify dry-run stays offline
        run: |
          set -euo pipefail
          python scripts/deepseek_specialist_trial_v3.py --output artifacts/deepseek_specialist_dry_run.json
          python -m json.tool artifacts/deepseek_specialist_dry_run.json >/dev/null

      - name: Run explicitly approved paid DeepSeek engineering trial
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/deepseek_specialist_trial_v3.py \
            --network \
            --confirm DEEPSEEK_PAID_TRIAL \
            --output artifacts/deepseek_specialist_trial.json
          python -m json.tool artifacts/deepseek_specialist_trial.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/deepseek_specialist_trial.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "status": report.get("status"),
              "requested_model": report.get("requested_model"),
              "exact_model_listed": report.get("exact_model_listed"),
              "successful_task_count": report.get("successful_task_count", 0),
              "selected_task_count": report.get("selected_task_count", 0),
              "average_quality_score": report.get("average_quality_score", 0),
              "parallel_speedup": report.get("parallel_speedup", 0),
              "prompt_cache_hit_rate": report.get("prompt_cache_hit_rate", 0),
              "estimated_current_cost_usd": report.get("estimated_current_cost_usd", 0),
              "conservative_cost_usd": report.get("conservative_cost_usd", 0),
              "placement_recommendation": report.get("placement_recommendation"),
              "generic_paid_fallback": report.get("generic_paid_fallback"),
              "production_routing_changed": report.get("production_routing_changed"),
              "non_recursive_preflight": report.get("non_recursive_preflight"),
          }, sort_keys=True))
          assert report.get("generic_paid_fallback") is False
          assert report.get("production_routing_changed") is False
          assert report.get("failure_usage_preserved") is True
          assert report.get("robust_json_parser") is True
          assert report.get("non_recursive_preflight") is True
          assert float(report.get("conservative_cost_usd", 0)) <= float(report.get("max_estimated_cost_usd", 0.25))
          PY

      - name: Upload DeepSeek trial evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deepseek-specialist-trial-${{ github.run_id }}
          path: |
            artifacts/deepseek_specialist_dry_run.json
            artifacts/deepseek_specialist_trial.json
          if-no-files-found: ignore
          retention-days: 7
