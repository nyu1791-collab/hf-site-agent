name: Probe configured provider safely

# Preset and approval guidance: docs/SETUP_FLOW.md

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CHECK to run one bounded, read-only provider smoke test
        required: true
        type: string
      provider:
        description: "Commander or Worker provider to test; no automatic fallback."
        required: true
        type: choice
        options:
          - google
          - nvidia
          - groq
          - openrouter
      model:
        description: "Exact model ID from the current provider catalog; generic openrouter/free is forbidden"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provider-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate manual gate
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub dispatch text inputs can retain invisible whitespace from mobile keyboards.
          CONFIRM="$(printf '%s' "$CONFIRM" | tr -d '[:space:]')"
          if [[ "$REF_NAME" != "main" ]]; then
            echo "This smoke test is allowed only from main." >&2
            exit 2
          fi
          if [[ "$CONFIRM" != "CHECK" ]]; then
            echo "Type CHECK to run one bounded smoke test." >&2
            exit 2
          fi
          echo "Manual gate validated for main."

      - name: Check out the reviewed smoke test
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run one exact provider probe
        env:
          AI_PROVIDER: ${{ github.event.inputs.provider }}
          PROBE_MODEL_INPUT: ${{ github.event.inputs.model }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.AI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PROBE_MODEL_INPUT" || ${#PROBE_MODEL_INPUT} -gt 160 || "$PROBE_MODEL_INPUT" =~ [[:space:]] ]]; then
            echo "An exact provider model ID is required." >&2
            exit 2
          fi
          if [[ "$PROBE_MODEL_INPUT" == "openrouter/free" ]]; then
            echo "The generic OpenRouter router is forbidden." >&2
            exit 2
          fi
          case "$AI_PROVIDER" in
            google) export GOOGLE_PROBE_MODEL="$PROBE_MODEL_INPUT" ;;
            nvidia) export NVIDIA_PROBE_MODEL="$PROBE_MODEL_INPUT" ;;
            groq) export GROQ_PROBE_MODEL="$PROBE_MODEL_INPUT" ;;
            openrouter) export OPENROUTER_WORKER_PROBE_MODEL="$PROBE_MODEL_INPUT" ;;
            *) echo "Unsupported provider selection." >&2; exit 2 ;;
          esac
          python scripts/probe_providers.py --network --provider "$AI_PROVIDER" --output artifacts/provider_probe.json

      - name: Validate redacted probe report
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test -f artifacts/provider_probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/provider_probe.json").read_text(encoding="utf-8"))
          assert report["retry_count"] == 0
          assert report["model_calls"] in {0, 1}
          assert report["paid_fallback"] is False
          assert report["registry_changed"] is False
          encoded = json.dumps(report, ensure_ascii=False).lower()
          assert "api_key_env" not in encoded
          assert "authorization" not in encoded
          print(json.dumps({
              "model_calls": report["model_calls"],
              "statuses": [item.get("status") for item in report.get("providers", [])],
              "paid_fallback": report["paid_fallback"],
          }, ensure_ascii=False))
          PY

      - name: Upload redacted provider probe
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: provider-probe
          path: artifacts/provider_probe.json
          if-no-files-found: error
          retention-days: 14
