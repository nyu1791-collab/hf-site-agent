name: "DeepSeek supervisor policy check"

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - config/deepseek_paid_supervisor_policy.json
      - config/deepseek_paid_autonomy.json
      - config/legacy_deepseek_compatibility.json
      - config/multi_agent_operating_policy.json
      - config/ai_army_org_chart.json
      - config/current_commander_handoff.json
      - scripts/ai_army_routing_facade.py
      - .github/workflows/deepseek-supervisor-policy-check.yml
  pull_request:
    paths:
      - config/deepseek_paid_supervisor_policy.json
      - config/deepseek_paid_autonomy.json
      - config/legacy_deepseek_compatibility.json
      - config/multi_agent_operating_policy.json
      - config/ai_army_org_chart.json
      - config/current_commander_handoff.json
      - scripts/ai_army_routing_facade.py
      - .github/workflows/deepseek-supervisor-policy-check.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate paid DeepSeek executive-supervisor contract without paid calls
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          sup=json.loads(Path('config/deepseek_paid_supervisor_policy.json').read_text())
          mas=json.loads(Path('config/multi_agent_operating_policy.json').read_text())
          org=json.loads(Path('config/ai_army_org_chart.json').read_text())
          handoff=json.loads(Path('config/current_commander_handoff.json').read_text())
          legacy_pointer=json.loads(Path('config/deepseek_paid_autonomy.json').read_text())
          legacy_registry=json.loads(Path('config/legacy_deepseek_compatibility.json').read_text())

          assert sup['schema_version']=='deepseek-paid-supervisor-v3'
          assert sup['status']=='ACTIVE_SCOPED_EXCEPTION'
          assert sup['human_authorization']['authorized'] is True
          assert sup['human_authorization']['persistent_for_allowed_scope'] is True
          assert sup['human_authorization']['repeat_per_call_approval_required'] is False
          assert sup['provider']['canonical_request_model']=='deepseek-v4-flash'
          assert sup['routing_integration']['canonical_policy_router']=='scripts/ai_army_routing_facade.py'
          assert sup['routing_integration']['canonical_paid_execution_workflow']=='.github/workflows/deepseek-supervisor-research.yml'
          assert sup['routing_integration']['legacy_commander_router_is_compatibility_only'] is True
          assert sup['routing_integration']['historical_deepseek_configs_authorize_execution'] is False
          assert sup['routing_integration']['mandatory_paid_hop_for_every_task'] is False
          assert sup['routing_integration']['direct_specialist_bypass_may_authorize_paid_fallback'] is False
          assert sup['routing_integration']['chatgpt_final_authority_on_all_routes'] is True
          assert sup['hierarchy']['top_commander']=='chatgpt-work'
          assert sup['hierarchy']['deepseek_rank']=='EXECUTIVE_SUPERVISOR'
          assert sup['hierarchy']['deepseek_depth']==1
          assert sup['hierarchy']['deepseek_reports_to']=='chatgpt-work'
          assert sup['hierarchy']['deepseek_is_lowest_worker'] is False
          assert sup['hierarchy']['deepseek_is_bulk_coding_worker'] is False
          assert sup['usage_policy']['coding']['bulk_code_generation_by_default'] is False
          assert sup['usage_policy']['coding']['direct_repository_write'] is False
          assert sup['supervisor_admission']['routine_complex_missions_auto_admit'] is True
          assert sup['supervisor_admission']['user_reapproval_per_mission'] is False
          assert len(sup['supervisor_admission']['use_by_default_when_any']) >= 5
          assert sup['compute_allocation']['default_mode']=='HIGH_VALUE_SUPERVISORY_CONSUMPTION'
          assert sup['compute_allocation']['prefer_managerial_reasoning_over_bulk_implementation'] is True
          assert sup['compute_allocation']['successful_lane_reuse_before_new_call'] is True
          assert sup['compute_allocation']['stop_when_additional_calls_have_low_expected_information_gain'] is True

          fan=sup['research_fanout']
          assert fan['chatgpt_final_adjudication_required'] is True
          assert fan['default_max_distinct_research_lanes'] <= 6
          assert fan['default_max_parallel_deepseek_calls'] <= 3
          assert fan['default_max_deepseek_calls_per_mission'] <= 8
          assert fan['expansion_ceiling']['max_distinct_research_lanes'] <= 8
          assert fan['expansion_ceiling']['max_parallel_deepseek_calls'] <= 4
          assert fan['expansion_ceiling']['max_deepseek_calls_per_mission'] <= 12
          assert fan['failed_lane_retry_limit'] <= 1
          assert fan['same_root_cause_retry'] is False
          assert len(fan['expansion_requires']) >= 3

          assert sup['context_and_cache']['prefix_hash_required'] is True
          assert sup['context_and_cache']['cache_is_accelerator_not_checkpoint_or_evidence'] is True
          assert sup['budget']['max_estimated_cost_usd_per_mission'] <= 0.50
          assert sup['budget']['max_estimated_cost_usd_per_day'] <= 3.00
          assert sup['budget']['stop_before_estimated_budget_exceeded'] is True
          assert sup['budget']['auto_top_up'] is False
          assert sup['safety']['generic_paid_fallback'] is False
          assert sup['safety']['paid_media_generation'] is False
          assert sup['safety']['repository_write_by_deepseek'] is False
          assert sup['safety']['deploy'] is False
          assert sup['safety']['publish'] is False
          assert sup['safety']['merge'] is False
          assert sup['safety']['secret_mutation_or_disclosure'] is False

          assert mas['schema_version']=='multi-agent-operating-policy-v4'
          assert mas['routing']['canonical_routing_facade']=='scripts/ai_army_routing_facade.py'
          assert mas['routing']['legacy_commander_routing_is_compatibility_layer'] is True
          assert mas['routing']['deepseek_supervisor_not_mandatory_for_every_task'] is True
          assert mas['routing']['direct_specialist_bypass_allowed_for_narrow_bounded_execution'] is True
          assert mas['routing']['direct_specialist_bypass_may_authorize_paid_fallback'] is False
          exc=mas['paid_model_exceptions']['deepseek_supervisor']
          assert exc['enabled'] is True
          assert exc['preauthorized_by_user'] is True
          assert exc['persistent_across_chat_tabs'] is True
          assert exc['rank']=='EXECUTIVE_SUPERVISOR'
          assert exc['bulk_coding_worker'] is False
          assert exc['mandatory_hop_for_every_task'] is False
          assert exc['chatgpt_final_adjudication_required'] is True
          assert exc['other_paid_provider_authorization'] is False
          assert mas['free_only_policy']['auto_top_up'] is False
          assert mas['free_only_policy']['allow_paid_fallback'] is False
          assert mas['architecture']['max_delegation_depth'] <= 2
          assert mas['architecture']['parallel_direct_corps_safety_ceiling'] <= 3
          assert mas['architecture']['effective_parallelism_is_dynamic_below_ceiling'] is True
          assert 'PAID_EXECUTION' in mas['security_and_permissions']['human_approval_required_for']
          exceptions=mas['security_and_permissions']['preauthorized_paid_execution_exceptions']
          assert len(exceptions)==1 and exceptions[0]['provider']=='deepseek'
          assert exceptions[0]['repeat_per_call_approval_required'] is False
          assert exceptions[0]['generic_paid_fallback'] is False

          assert org['schema_version']=='ai-army-org-chart-v3'
          assert org['status']=='CANONICAL'
          assert org['policy_entrypoint']=='scripts/ai_army_routing_facade.py'
          assert org['hierarchy']['depth_0']['agent']=='chatgpt-work'
          assert org['hierarchy']['depth_1']['role']=='EXECUTIVE_SUPERVISOR'
          assert org['hierarchy']['depth_1']['default_bulk_coding'] is False
          assert org['hierarchy']['depth_1']['mandatory_hop_for_every_task'] is False
          assert org['hierarchy']['depth_2']['worker_to_worker_delegation'] is False
          assert org['direct_specialist_bypass']['allowed'] is True
          assert org['direct_specialist_bypass']['may_authorize_paid_fallback'] is False
          assert org['control_plane']['single_writer'] is True
          assert org['control_plane']['machine_oracle_over_majority_vote'] is True

          assert handoff['schema_version']=='top-commander-handoff-v7'
          assert 'config/deepseek_paid_supervisor_policy.json' in handoff['continuity']['on_new_session_required_read_order']
          assert 'config/ai_army_org_chart.json' in handoff['continuity']['on_new_session_required_read_order']
          assert handoff['canonical_routing_fixed_rules']['policy_entrypoint']=='scripts/ai_army_routing_facade.py'
          assert handoff['canonical_routing_fixed_rules']['paid_deepseek_supervisor_is_not_mandatory_for_every_task'] is True
          fixed=handoff['deepseek_supervisor_fixed_rules']
          assert fixed['paid_deepseek_persistently_authorized_for_supervisory_scope'] is True
          assert fixed['deepseek_is_not_default_bottom_worker'] is True
          assert fixed['deepseek_is_not_default_bulk_coder'] is True
          assert fixed['deepseek_is_not_mandatory_paid_hop_for_trivial_execution'] is True
          assert fixed['chatgpt_remains_final_decision_authority'] is True
          assert fixed['default_research_lanes'] <= 6
          assert fixed['default_parallel_calls'] <= 3
          assert fixed['default_calls_per_mission'] <= 8
          assert fixed['only_active_paid_deepseek_execution_workflow']=='.github/workflows/deepseek-supervisor-research.yml'
          assert fixed['historical_deepseek_configs_authorize_execution'] is False
          assert fixed['other_paid_providers_remain_disallowed_without_explicit_user_authorization'] is True
          assert fixed['auto_top_up'] is False
          assert fixed['generic_paid_fallback'] is False

          assert legacy_pointer['status']=='DEPRECATED_COMPATIBILITY_POINTER'
          assert legacy_pointer['canonical_policy']=='config/deepseek_paid_supervisor_policy.json'
          assert legacy_pointer['organizational_rank']=='EXECUTIVE_SUPERVISOR'
          assert legacy_pointer['not_default_bulk_coding_worker'] is True
          assert legacy_registry['status']=='HISTORICAL_COMPATIBILITY_ONLY'
          assert legacy_registry['canonical_runner']=='scripts/deepseek_supervisor_research.py'
          assert legacy_registry['canonical_workflow']=='.github/workflows/deepseek-supervisor-research.yml'
          assert legacy_registry['rules']['legacy_enabled_flag_does_not_authorize_execution'] is True

          print('DeepSeek executive-supervisor policy + canonical routing: PASS')
          print('No DeepSeek API call was made by this validation workflow.')
          PY
