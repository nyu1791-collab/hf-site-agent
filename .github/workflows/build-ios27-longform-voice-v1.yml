name: "Build iOS27 longform VOICEVOX timing v1"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios27-longform-voice-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install deterministic media tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Start local VOICEVOX with bounded retry
        run: |
          set -euo pipefail
          image=voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          for attempt in 1 2; do
            if timeout 360 docker pull "$image"; then
              break
            fi
            if [ "$attempt" = 2 ]; then
              echo "VOICEVOX docker pull failed after bounded retry" >&2
              exit 1
            fi
            sleep 8
          done
          docker run -d --name voicevox -p 127.0.0.1:50021:50021 "$image"
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 5 http://127.0.0.1:50021/version >/dev/null; then
              curl -fsS http://127.0.0.1:50021/version
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            docker logs voicevox || true
            exit 1
          fi

      - name: Generate VOICEVOX WAVs and measured timeline
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios27_longform_voice/wav
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import time
          import urllib.parse
          import urllib.request
          import urllib.error

          root = pathlib.Path('.')
          mission_path = root / 'missions/media/20260915-ios27-japan-trend-longform-v1.json'
          mission = json.loads(mission_path.read_text(encoding='utf-8'))
          out = root / 'artifacts/ios27_longform_voice'
          wav_dir = out / 'wav'
          wav_dir.mkdir(parents=True, exist_ok=True)

          def get_json(url, *, data=None, headers=None, method=None, attempts=2):
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      req = urllib.request.Request(url, data=data, headers=headers or {}, method=method)
                      with urllib.request.urlopen(req, timeout=45) as response:
                          return json.loads(response.read().decode('utf-8'))
                  except (urllib.error.URLError, TimeoutError, OSError, json.JSONDecodeError) as exc:
                      last = exc
                      if attempt < attempts:
                          time.sleep(1.5 * attempt)
              raise RuntimeError(f'bounded request failed: {url}: {last}')

          def get_bytes(url, *, data=None, headers=None, method=None, attempts=2):
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      req = urllib.request.Request(url, data=data, headers=headers or {}, method=method)
                      with urllib.request.urlopen(req, timeout=90) as response:
                          return response.read()
                  except (urllib.error.URLError, TimeoutError, OSError) as exc:
                      last = exc
                      if attempt < attempts:
                          time.sleep(1.5 * attempt)
              raise RuntimeError(f'bounded request failed: {url}: {last}')

          speakers = get_json('http://127.0.0.1:50021/speakers')

          def choose_style(name):
              sp = next(x for x in speakers if x.get('name') == name)
              styles = sp.get('styles') or []
              normal = next((x for x in styles if x.get('name') in ('ノーマル', 'Normal', 'normal')), None)
              return int((normal or styles[0])['id'])

          style_ids = {name: choose_style(name) for name in ('ずんだもん', '四国めたん')}
          print('style_ids=', style_ids)

          flat = []
          for scene in mission['scenes']:
              for item in scene['dialogue']:
                  flat.append((scene['scene_id'], scene['title'], item))

          timeline = []
          scene_summaries = []
          cursor = 0.0
          gap = 0.10
          current_scene = None
          scene_start = 0.0
          scene_utterances = 0

          for idx, (scene_id, scene_title, item) in enumerate(flat, start=1):
              if current_scene != scene_id:
                  if current_scene is not None:
                      scene_summaries.append({
                          'scene_id': current_scene,
                          'start': round(scene_start, 3),
                          'end': round(cursor, 3),
                          'duration': round(cursor - scene_start, 3),
                          'utterances': scene_utterances,
                      })
                  current_scene = scene_id
                  scene_start = cursor
                  scene_utterances = 0

              speaker = item['speaker']
              sid = style_ids[speaker]
              params = urllib.parse.urlencode({'text': item['voice_text'], 'speaker': sid})
              query = get_json(
                  'http://127.0.0.1:50021/audio_query?' + params,
                  data=b'',
                  method='POST',
              )

              if speaker == 'ずんだもん':
                  query['speedScale'] = 1.04
                  query['pitchScale'] = 0.01
                  query['intonationScale'] = 1.04
              else:
                  query['speedScale'] = 0.99
                  query['pitchScale'] = -0.01
                  query['intonationScale'] = 1.02

              body = json.dumps(query, ensure_ascii=False).encode('utf-8')
              wav = get_bytes(
                  f'http://127.0.0.1:50021/synthesis?speaker={sid}',
                  data=body,
                  headers={'Content-Type': 'application/json'},
                  method='POST',
              )
              safe_id = item['id'].replace('/', '_')
              fname = f'{idx:03d}_{safe_id}_{"zundamon" if speaker == "ずんだもん" else "metan"}.wav'
              path = wav_dir / fname
              tmp = path.with_suffix('.wav.partial')
              tmp.write_bytes(wav)
              duration = float(subprocess.check_output([
                  'ffprobe', '-v', 'error', '-show_entries', 'format=duration',
                  '-of', 'default=nw=1:nk=1', str(tmp)
              ], text=True).strip())
              tmp.replace(path)

              start = cursor
              end = start + duration
              timeline.append({
                  **item,
                  'scene_title': scene_title,
                  'style_id': sid,
                  'wav_file': f'wav/{fname}',
                  'start': round(start, 3),
                  'duration': round(duration, 3),
                  'end': round(end, 3),
              })
              cursor = end + gap
              scene_utterances += 1

          if current_scene is not None:
              scene_summaries.append({
                  'scene_id': current_scene,
                  'start': round(scene_start, 3),
                  'end': round(cursor, 3),
                  'duration': round(cursor - scene_start, 3),
                  'utterances': scene_utterances,
              })

          total = round(cursor, 3)
          status = 'PASS_8_TO_12_MIN' if 480 <= total <= 720 else 'OUTSIDE_8_TO_12_MIN_REVIEW_REQUIRED'
          manifest = {
              'schema': 'ios27-longform-voicevox-timeline-v1',
              'mission_id': mission['mission_id'],
              'engine': 'VOICEVOX_LOCAL_DOCKER',
              'style_ids': style_ids,
              'utterance_count': len(timeline),
              'gap_seconds': gap,
              'total_duration': total,
              'duration_gate': status,
              'target_duration_seconds': mission['target_duration_seconds'],
              'scene_summaries': scene_summaries,
              'dialogue': timeline,
              'generated_image_ai_used': False,
              'generated_video_ai_used': False,
              'public_publish_performed': False,
              'artifact_scope': 'VOICE_AND_MEASURED_TIMING_CHECKPOINT',
          }
          (out / 'timeline_manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          (out / 'speakers_snapshot.json').write_text(
              json.dumps(speakers, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'utterances': len(timeline),
              'total_duration': total,
              'duration_gate': status,
              'style_ids': style_ids,
          }, ensure_ascii=False))
          PY

      - name: Mechanical voice checkpoint validation
        run: |
          set -euo pipefail
          test -s artifacts/ios27_longform_voice/timeline_manifest.json
          count=$(find artifacts/ios27_longform_voice/wav -type f -name '*.wav' | wc -l)
          test "$count" -eq 57
          find artifacts/ios27_longform_voice/wav -type f -name '*.partial' -print -quit | grep -q . && exit 1 || true
          python - <<'PY'
          import json
          p='artifacts/ios27_longform_voice/timeline_manifest.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['utterance_count'] == 57
          assert d['total_duration'] > 0
          print('VOICE_CHECKPOINT_PASS', d['total_duration'], d['duration_gate'])
          PY

      - name: Upload VOICEVOX measured timing checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: ios27-longform-voice-v1
          path: artifacts/ios27_longform_voice
          retention-days: 3
