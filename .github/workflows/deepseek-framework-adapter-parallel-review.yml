name: DeepSeek V4.1 Flash framework adapter parallel review

on:
  push:
    branches:
      - ai-army/framework-adapter-v1
    paths:
      - .github/deepseek-framework-adapter-trigger.txt
      - .github/workflows/deepseek-framework-adapter-parallel-review.yml
      - config/deepseek_framework_adapter_review_*.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseek-framework-adapter-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deepseek-review:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - lane: control-plane
            manifest: config/deepseek_framework_adapter_review_a.json
          - lane: media-rights
            manifest: config/deepseek_framework_adapter_review_b.json
          - lane: failure-ci
            manifest: config/deepseek_framework_adapter_review_c.json
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact staging source without write credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile bounded DeepSeek review runner
        run: |
          python -m py_compile \
            scripts/deepseek_specialist_trial.py \
            scripts/deepseek_specialist_trial_v4.py \
            scripts/deepseek_targeted_review.py

      - name: Validate manifest and dry-run offline
        run: |
          set -euo pipefail
          python scripts/deepseek_targeted_review.py \
            --manifest "${{ matrix.manifest }}" \
            --output "artifacts/deepseek_${{ matrix.lane }}_dry_run.json"
          python -m json.tool "artifacts/deepseek_${{ matrix.lane }}_dry_run.json" >/dev/null

      - name: Run one explicitly approved DeepSeek V4.1 Flash review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/deepseek_targeted_review.py \
            --manifest "${{ matrix.manifest }}" \
            --network \
            --confirm DEEPSEEK_PAID_TRIAL \
            --output "artifacts/deepseek_${{ matrix.lane }}.json"
          python -m json.tool "artifacts/deepseek_${{ matrix.lane }}.json" >/dev/null
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          lane = os.environ["LANE"]
          report = json.loads(Path(f"artifacts/deepseek_{lane}.json").read_text(encoding="utf-8"))
          assert report.get("requested_model") == "deepseek-flash"
          assert report.get("generic_paid_fallback") is False
          assert report.get("production_routing_changed") is False
          assert report.get("repository_write") is False
          assert report.get("merge") is False
          assert report.get("deploy") is False
          assert report.get("publish") is False
          assert report.get("secret_mutation") is False
          assert report.get("targeted_max_calls") == 1
          assert float(report.get("targeted_max_estimated_cost_usd", 1)) <= 0.05
          assert int(report.get("selected_task_count", 0)) <= 1
          assert report.get("status") in {"TRIAL_READY", "TRIAL_PARTIAL"}
          print(json.dumps({
              "lane": lane,
              "status": report.get("status"),
              "model": report.get("requested_model"),
              "cost_usd": report.get("estimated_current_cost_usd", 0),
              "quality": report.get("average_quality_score", 0),
          }, sort_keys=True))
          PY
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LANE: ${{ matrix.lane }}

      - name: Upload redacted review evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deepseek-framework-${{ matrix.lane }}-${{ github.run_id }}
          path: |
            artifacts/deepseek_${{ matrix.lane }}_dry_run.json
            artifacts/deepseek_${{ matrix.lane }}.json
          if-no-files-found: ignore
          retention-days: 7
