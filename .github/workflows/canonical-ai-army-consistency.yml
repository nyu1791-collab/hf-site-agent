name: "Canonical AI Army consistency"

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - 'config/ai_army_org_chart.json'
      - 'config/multi_agent_operating_policy.json'
      - 'config/deepseek_paid_supervisor_policy.json'
      - 'config/agent_efficiency_policy.json'
      - 'config/current_commander_handoff.json'
      - 'config/permanent_standards_manifest.json'
      - 'config/media_command_read_gate.json'
      - 'config/longform_video_objectives.json'
      - 'config/longform_video_reliability_policy.json'
      - 'config/authorized_clipping_monetization_policy.json'
      - 'config/tiktok_shop_influence_policy.json'
      - 'config/legacy_deepseek_compatibility.json'
      - 'config/ci_execution_policy.json'
      - 'config/model_registry.json'
      - 'config/batch_media_orchestration_policy.json'
      - 'config/bulk_media_worker_pool.json'
      - 'scripts/ai_army_routing_facade.py'
      - 'scripts/validate_permanent_ai_army_state.py'
      - 'scripts/validate_media_command_read_gate.py'
      - 'scripts/ci_control_plane_guard.py'
      - 'scripts/agent_architecture_admission.py'
      - 'scripts/commander_routing.py'
      - 'scripts/deepseek_supervisor_research.py'
      - 'scripts/deepseek_supervisor_research_resilient.py'
      - 'scripts/deepseek_json_guard.py'
      - 'scripts/batch_media_scheduler.py'
      - 'scripts/media_batch_command_center.py'
      - 'schemas/deepseek_supervisor_mission.schema.json'
      - 'schemas/batch_media_job.schema.json'
      - 'schemas/media_batch_command.schema.json'
      - 'docs/AI_ARMY_CANONICAL_ORGANIZATION_2026-09-12.md'
      - 'docs/MEDIA_COMMAND_READ_GATE.md'
      - 'docs/MEDIA_PIPELINE.md'
      - 'docs/LONGFORM_VIDEO_OBJECTIVES.md'
      - 'docs/LONGFORM_VIDEO_RELIABILITY_PLAYBOOK.md'
      - 'docs/AI_ARMY_LONGFORM_RESEARCH_SYNTHESIS_2026-09-12.md'
      - 'docs/AUTHORIZED_CLIPPING_AND_MONETIZATION_PLAYBOOK.md'
      - 'docs/BATCH_MEDIA_ORCHESTRATION.md'
      - 'docs/MEDIA_BATCH_COMMAND_CENTER.md'
      - 'docs/TIKTOK_SHOP_INFLUENCE_PLAYBOOK.md'
      - 'tests/test_ai_army_routing_facade.py'
      - 'tests/test_deepseek_json_guard.py'
      - 'tests/test_batch_media_scheduler.py'
      - 'tests/test_media_batch_command_center.py'
      - 'tests/test_media_batch_command_center_ffmpeg.py'
      - '.github/workflows/deepseek-*.yml'
      - '.github/workflows/canonical-ai-army-consistency.yml'
      - '.github/workflows/verify-hierarchical-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-ai-army-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source without write credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compile canonical routing and validation code
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/ai_army_routing_facade.py \
            scripts/validate_permanent_ai_army_state.py \
            scripts/validate_media_command_read_gate.py \
            scripts/ci_control_plane_guard.py \
            scripts/agent_architecture_admission.py \
            scripts/deepseek_supervisor_research.py \
            scripts/deepseek_supervisor_research_resilient.py \
            scripts/deepseek_json_guard.py \
            scripts/batch_media_scheduler.py \
            scripts/media_batch_command_center.py

      - name: Validate canonical JSON policy stack
        run: |
          set -euo pipefail
          python -m json.tool config/ai_army_org_chart.json >/dev/null
          python -m json.tool config/multi_agent_operating_policy.json >/dev/null
          python -m json.tool config/deepseek_paid_supervisor_policy.json >/dev/null
          python -m json.tool config/agent_efficiency_policy.json >/dev/null
          python -m json.tool config/current_commander_handoff.json >/dev/null
          python -m json.tool config/permanent_standards_manifest.json >/dev/null
          python -m json.tool config/media_command_read_gate.json >/dev/null
          python -m json.tool config/longform_video_objectives.json >/dev/null
          python -m json.tool config/longform_video_reliability_policy.json >/dev/null
          python -m json.tool config/authorized_clipping_monetization_policy.json >/dev/null
          python -m json.tool config/tiktok_shop_influence_policy.json >/dev/null
          python -m json.tool config/legacy_deepseek_compatibility.json >/dev/null
          python -m json.tool config/ci_execution_policy.json >/dev/null
          python -m json.tool config/batch_media_orchestration_policy.json >/dev/null
          python -m json.tool config/bulk_media_worker_pool.json >/dev/null
          python -m json.tool schemas/batch_media_job.schema.json >/dev/null
          python -m json.tool schemas/media_batch_command.schema.json >/dev/null
          python -m json.tool examples/media_batch_3way.template.json >/dev/null

      - name: Run permanent organization consistency validator
        run: |
          set -euo pipefail
          python scripts/validate_permanent_ai_army_state.py

      - name: Enforce media command read gate
        run: |
          set -euo pipefail
          python scripts/validate_media_command_read_gate.py

      - name: Enforce bounded CI control plane
        run: |
          set -euo pipefail
          python scripts/ci_control_plane_guard.py

      - name: Run canonical and batch regression tests
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_ai_army_routing_facade \
            tests.test_deepseek_json_guard \
            tests.test_batch_media_scheduler \
            tests.test_media_batch_command_center \
            tests.test_media_batch_command_center_ffmpeg -v

      - name: Prove no paid call occurs in consistency CI
        run: |
          set -euo pipefail
          test -z "${DEEPSEEK_API_KEY:-}"
          ! grep -q 'secrets.DEEPSEEK_API_KEY' .github/workflows/canonical-ai-army-consistency.yml
          echo 'PAID_CALLS=0'
