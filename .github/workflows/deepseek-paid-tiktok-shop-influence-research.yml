name: "DeepSeek paid TikTok Shop influence research"

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - .github/workflows/deepseek-paid-tiktok-shop-influence-research.yml

permissions:
  contents: read

concurrency:
  group: deepseek-paid-tiktok-shop-influence-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering source without write credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Retry only failed creative psychology lane
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path

          mission=json.loads(Path('config/deepseek_tiktok_shop_influence_research_mission.json').read_text(encoding='utf-8'))
          api_key=os.environ.get('DEEPSEEK_API_KEY','')
          if not api_key: raise SystemExit('DEEPSEEK_API_KEY missing')
          system='''You are DeepSeek V4.1 Flash acting as a paid short-form commerce creative strategist under explicit human approval. Advisory only. Do not publish, deploy, merge, mutate repository state, reveal secrets, fabricate reviews or scarcity, or assert unsupported product effects. Return compact valid JSON only with keys: verdict, hook_taxonomy, first_frame_and_cover, subtitle_rules, story_arcs, trust_and_social_proof, target_personas, cta_rules, ab_tests, hard_gates, rejected_patterns, priorities, confidence. Keep the total answer concise enough to fit 3200 output tokens.'''
          evidence=json.dumps(mission,ensure_ascii=False)
          user='''TASK: Build an evidence-based TikTok Shop conversion system for short videos. Cover opening 0-3s, curiosity, product visibility, story progression, credibility, local reviews, objection reduction, subtitles, cover/thumbnail, audience targeting and CTA. Distinguish platform evidence from useful heuristics. Reject dark patterns and repetitive template spam.\nMISSION_AND_EVIDENCE='''+evidence+'\nReturn JSON only.'
          peak_in=0.44; peak_out=1.32; max_tokens=3200; cost_cap=0.02
          rough=max(1,(len(system+user)+3)//4)
          reserve=(rough*peak_in+max_tokens*peak_out)/1_000_000
          if reserve>cost_cap: raise RuntimeError(f'preflight reserve too high: {reserve}')
          payload={'model':'deepseek-flash','messages':[{'role':'system','content':system},{'role':'user','content':user}],'max_tokens':max_tokens,'stream':False,'response_format':{'type':'json_object'},'thinking':{'type':'disabled'}}
          req=urllib.request.Request('https://api.deepseek.com/chat/completions',data=json.dumps(payload,ensure_ascii=False).encode(),headers={'Authorization':f'Bearer {api_key}','Content-Type':'application/json','Accept':'application/json','User-Agent':'hf-site-agent-tiktok-shop-research-retry/1'},method='POST')
          t=time.monotonic()
          with urllib.request.urlopen(req,timeout=120) as r: obj=json.loads(r.read(1_000_000).decode())
          choices=obj.get('choices') or []
          if not choices: raise RuntimeError('choices missing')
          content=(choices[0].get('message') or {}).get('content')
          if not isinstance(content,str) or not content.strip(): raise RuntimeError('visible content missing')
          result=json.loads(content)
          usage=obj.get('usage') or {}
          prompt=int(usage.get('prompt_tokens') or 0); hit=int(usage.get('prompt_cache_hit_tokens') or 0); miss=int(usage.get('prompt_cache_miss_tokens') or max(0,prompt-hit)); completion=int(usage.get('completion_tokens') or 0)
          cost=(hit*0.014+miss*0.44+completion*1.32)/1_000_000
          report={'schema_version':'deepseek-tiktok-shop-creative-retry-v1','mission_id':mission['mission_id'],'status':'READY','model':'deepseek-flash','paid_calls':1,'successful_calls':1,'cost_cap_usd':cost_cap,'conservative_peak_cost_usd':round(cost,8),'production_change':False,'publish':False,'deploy':False,'merge':False,'secret_mutation':False,'result':result}
          if cost>cost_cap: raise RuntimeError('cost cap exceeded')
          Path('artifacts/deepseek_tiktok_shop_creative_retry.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:report[k] for k in ['status','paid_calls','successful_calls','cost_cap_usd','conservative_peak_cost_usd']},ensure_ascii=False))
          PY

      - name: Upload redacted research artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deepseek-tiktok-shop-influence-research-${{ github.run_id }}
          path: artifacts/deepseek_tiktok_shop_creative_retry.json
          if-no-files-found: ignore
          retention-days: 7
