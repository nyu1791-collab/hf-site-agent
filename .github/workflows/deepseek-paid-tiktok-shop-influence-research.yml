name: "DeepSeek paid TikTok Shop influence research"

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - .github/workflows/deepseek-paid-tiktok-shop-influence-research.yml

permissions:
  contents: read

concurrency:
  group: deepseek-paid-tiktok-shop-influence-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering source without write credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run bounded DeepSeek V4.1 Flash influence research
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import concurrent.futures, json, os, time, urllib.request
          from pathlib import Path

          mission=json.loads(Path('config/deepseek_tiktok_shop_influence_research_mission.json').read_text(encoding='utf-8'))
          api_key=os.environ.get('DEEPSEEK_API_KEY','')
          if not api_key:
              raise SystemExit('DEEPSEEK_API_KEY missing')

          roles=[
            {
              'id':'creative-psychology',
              'role':'SHORT_FORM_COMMERCE_CREATIVE_STRATEGIST',
              'instruction':'Design a rigorous TikTok Shop creative system covering hook taxonomies, first-frame design, subtitle hierarchy, story structures, curiosity, proof, trust, objections, use scenes, CTA, target personas, and A/B testing. Separate evidence-based guidance from heuristics. Reject fake urgency, fake reviews, unsupported claims, manipulative dark patterns and template spam.'
            },
            {
              'id':'research-discovery',
              'role':'PRODUCT_RESEARCH_AND_DISCOVERY_ARCHITECT',
              'instruction':'Design the product intelligence system: TikTok Shop product-page grounding, official/manufacturer evidence, local-language review collection and clustering, historical/cultural research, target-audience matching, product discovery scoring, evidence grading, hallucination controls, and analytics feedback. Include examples for imported snacks such as latiao and practical gadgets such as portable juicers, but do not invent product-specific facts not in evidence.'
            }
          ]
          system='''You are DeepSeek V4.1 Flash acting as a paid research specialist under explicit human approval. Advisory only. Do not publish, deploy, merge, mutate repository state, reveal secrets, fabricate reviews, fabricate scarcity, or assert unsupported product effects. Use the supplied evidence and reason critically. Return one JSON object with keys: verdict, principles, hook_system, subtitle_and_visual_system, story_system, trust_and_review_system, product_discovery_system, experimentation_system, hard_gates, rejected_patterns, implementation_priorities, confidence. Make recommendations precise enough to encode into machine policy.'''
          evidence=json.dumps(mission,ensure_ascii=False)
          peak_in=0.44; peak_out=1.32; max_tokens=5000; max_total_cost=0.04
          def rough_tokens(s): return max(1,(len(s)+3)//4)
          def call(role):
              user=f"ROLE={role['role']}\nTASK={role['instruction']}\nMISSION_AND_EVIDENCE={evidence}\nReturn JSON only."
              reserve=(rough_tokens(system+user)*peak_in+max_tokens*peak_out)/1_000_000
              if reserve>max_total_cost/2:
                  raise RuntimeError(f'preflight reserve too high: {reserve}')
              payload={
                'model':'deepseek-flash',
                'messages':[{'role':'system','content':system},{'role':'user','content':user}],
                'max_tokens':max_tokens,
                'stream':False,
                'response_format':{'type':'json_object'},
                'thinking':{'type':'disabled'}
              }
              req=urllib.request.Request('https://api.deepseek.com/chat/completions',data=json.dumps(payload,ensure_ascii=False).encode(),headers={'Authorization':f'Bearer {api_key}','Content-Type':'application/json','Accept':'application/json','User-Agent':'hf-site-agent-tiktok-shop-research/1'},method='POST')
              t=time.monotonic()
              with urllib.request.urlopen(req,timeout=120) as r:
                  obj=json.loads(r.read(1_000_000).decode())
              latency_ms=int((time.monotonic()-t)*1000)
              choices=obj.get('choices') or []
              if not choices: raise RuntimeError('choices missing')
              content=(choices[0].get('message') or {}).get('content')
              if not isinstance(content,str) or not content.strip(): raise RuntimeError('visible content missing')
              result=json.loads(content)
              usage=obj.get('usage') or {}
              prompt=int(usage.get('prompt_tokens') or 0); hit=int(usage.get('prompt_cache_hit_tokens') or 0); miss=int(usage.get('prompt_cache_miss_tokens') or max(0,prompt-hit)); completion=int(usage.get('completion_tokens') or 0)
              cost=(hit*0.014+miss*0.44+completion*1.32)/1_000_000
              return {'lane':role['id'],'role':role['role'],'status':'READY','requested_model':'deepseek-flash','response_model':obj.get('model'),'latency_ms':latency_ms,'usage':usage,'conservative_peak_cost_usd':round(cost,8),'result':result}

          outputs=[]; errors=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as ex:
              futs={ex.submit(call,r):r for r in roles}
              for fut,role in futs.items():
                  try: outputs.append(fut.result())
                  except Exception as e: errors.append({'lane':role['id'],'status':'FAILED','error_class':type(e).__name__,'detail':str(e)[:240]})
          total=sum(float(x.get('conservative_peak_cost_usd') or 0) for x in outputs)
          report={'schema_version':'deepseek-tiktok-shop-influence-report-v1','mission_id':mission['mission_id'],'status':'READY' if len(outputs)==2 else ('PARTIAL' if outputs else 'FAILED'),'model':'deepseek-flash','paid_calls':len(outputs)+len(errors),'successful_calls':len(outputs),'max_calls':2,'max_parallel_calls':2,'cost_cap_usd':max_total_cost,'conservative_peak_cost_usd':round(total,8),'production_change':False,'publish':False,'deploy':False,'merge':False,'secret_mutation':False,'results':outputs,'errors':errors}
          Path('artifacts/deepseek_tiktok_shop_influence_research.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:report[k] for k in ['status','paid_calls','successful_calls','cost_cap_usd','conservative_peak_cost_usd']},ensure_ascii=False))
          if total>max_total_cost: raise RuntimeError('cost cap exceeded')
          if not outputs: raise SystemExit(1)
          PY

      - name: Upload redacted research artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deepseek-tiktok-shop-influence-research-${{ github.run_id }}
          path: artifacts/deepseek_tiktok_shop_influence_research.json
          if-no-files-found: ignore
          retention-days: 7
