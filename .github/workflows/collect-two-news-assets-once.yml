name: "Collect two current-news rights-cleared assets once"

on:
  push:
    branches: ["ai-army/provider-v3"]
    paths:
      - ".github/workflows/collect-two-news-assets-once.yml"

permissions:
  contents: read

jobs:
  assets:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: openai-billion
            artifact: current-news-openai-billion-assets
          - id: anthropic-misuse
            artifact: current-news-anthropic-misuse-assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified real-photo assets
        env:
          ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          mkdir -p "artifacts/$ID"
          if [ "$ID" = "openai-billion" ]; then
            curl -fL --retry 2 --connect-timeout 15 'https://commons.wikimedia.org/wiki/Special:Redirect/file/1515_Third_Street.jpg' -o "artifacts/$ID/openai_hq.jpg"
            curl -fL --retry 2 --connect-timeout 15 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Datacenter_Server_Racks_(22370909788).jpg' -o "artifacts/$ID/datacenter.jpg"
            cat > "artifacts/$ID/rights.json" <<'JSON'
          {
            "assets":[
              {"file":"openai_hq.jpg","source_page":"https://commons.wikimedia.org/wiki/File:1515_Third_Street.jpg","author":"Coolcaesar","license":"CC-BY-4.0","usage":"OpenAI company/location context"},
              {"file":"datacenter.jpg","source_page":"https://commons.wikimedia.org/wiki/File:Datacenter_Server_Racks_(22370909788).jpg","author":"Carl Lender","license":"CC-BY-2.0","usage":"AI infrastructure/server context"}
            ],
            "generated_image_ai_used":false
          }
          JSON
          else
            curl -fL --retry 2 --connect-timeout 15 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Dario_Amodei_at_TechCrunch_Disrupt_2023_03.jpg' -o "artifacts/$ID/dario_amodei.jpg"
            curl -fL --retry 2 --connect-timeout 15 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Cyberport_Network_Operations_Centre.jpg' -o "artifacts/$ID/network_ops.jpg"
            curl -fL --retry 2 --connect-timeout 15 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Datacenter_Server_Racks_(22370909788).jpg' -o "artifacts/$ID/datacenter.jpg"
            cat > "artifacts/$ID/rights.json" <<'JSON'
          {
            "assets":[
              {"file":"dario_amodei.jpg","source_page":"https://commons.wikimedia.org/wiki/File:Dario_Amodei_at_TechCrunch_Disrupt_2023_03.jpg","author":"TechCrunch","license":"CC-BY-2.0","usage":"Anthropic CEO editorial context"},
              {"file":"network_ops.jpg","source_page":"https://commons.wikimedia.org/wiki/File:Cyberport_Network_Operations_Centre.jpg","author":"Sunnyhtho","license":"CC-BY-3.0","usage":"network/cybersecurity illustrative context"},
              {"file":"datacenter.jpg","source_page":"https://commons.wikimedia.org/wiki/File:Datacenter_Server_Racks_(22370909788).jpg","author":"Carl Lender","license":"CC-BY-2.0","usage":"AI infrastructure illustrative context"}
            ],
            "generated_image_ai_used":false
          }
          JSON
          fi
          file artifacts/$ID/* || true

      - name: Upload asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.id }}
          retention-days: 3
