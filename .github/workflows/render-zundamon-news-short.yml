name: Zundamon longform news - sourced web images

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - missions/news-video-pilot.json

permissions:
  contents: read

concurrency:
  group: zundamon-news-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact source without write credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deterministic media tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk curl
          ffmpeg -version | head -n 1

      - name: Validate mission and compile media scripts
        run: |
          set -euo pipefail
          python -m json.tool missions/news-video-pilot.json >/dev/null
          python -m json.tool config/deepseek_paid_autonomy.json >/dev/null
          python -m py_compile \
            scripts/news_video_editorial_council.py \
            scripts/deepseek_paid_media_council.py \
            scripts/render_zundamon_news_longform.py

      - name: Run bounded paid DeepSeek media council
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/deepseek_paid_media_council.py
          python -m json.tool artifacts/deepseek_paid_media_council.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('artifacts/deepseek_paid_media_council.json').read_text(encoding='utf-8'))
          print(json.dumps({
              'status':report.get('status'),
              'model':report.get('requested_model'),
              'paid_calls':report.get('paid_calls'),
              'success_count':report.get('success_count'),
              'preflight_cost_usd':report.get('conservative_preflight_cost_usd')
          }, ensure_ascii=False))
          assert report.get('authorized_by_user') is True
          assert report.get('per_run_confirmation_required') is False
          assert int(report.get('paid_calls', 0)) <= 8
          assert float(report.get('max_estimated_cost_usd', 0)) <= 0.25
          assert report.get('production_enabled') is False
          assert report.get('repository_write') is False
          assert report.get('deploy') is False
          assert report.get('publish') is False
          assert report.get('generic_paid_fallback') is False
          assert report.get('auto_top_up') is False
          PY

      - name: Run bounded live-free editorial council
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/news_video_editorial_council.py
          python -m json.tool artifacts/news_video_editorial_council.json >/dev/null

      - name: Start local VOICEVOX engine
        run: |
          set -euo pipefail
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run --rm -d --name voicevox-news-pilot -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then
              echo "VOICEVOX_READY=1"
              exit 0
            fi
            sleep 5
          done
          docker logs voicevox-news-pilot || true
          exit 1

      - name: Render longform with exact full-narration subtitles
        run: |
          set -euo pipefail
          python scripts/render_zundamon_news_longform.py

      - name: Validate longform artifact, subtitle coverage, hierarchy, and stationary Zundamon
        run: |
          set -euo pipefail
          python -m json.tool artifacts/news-video-pilot/render_report.json >/dev/null
          python -m json.tool artifacts/news-video-pilot/subtitle_manifest.json >/dev/null
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('artifacts/news-video-pilot')
          report=json.loads((root/'render_report.json').read_text(encoding='utf-8'))
          subs=json.loads((root/'subtitle_manifest.json').read_text(encoding='utf-8'))
          assert report['status']=='RENDERED'
          assert report['resolution']=='1080x1920'
          assert report['voice']=='VOICEVOX:ずんだもん'
          assert report['image_generation_used'] is False
          assert report['video_generation_used'] is False
          assert report['subtitle_coverage']==1.0
          assert subs['coverage']==1.0
          assert report['subtitle_chunk_count']==len(subs['chunks'])
          assert report['zundamon_overlay'] is True
          assert report['zundamon_motion'] is False
          assert report['zundamon_stationary'] is True
          assert report['zundamon_pose_count'] >= 4
          assert report['text_hierarchy'] is True
          assert 240 <= float(report['duration_seconds']) <= 600
          video=root/report['file']
          assert video.exists() and video.stat().st_size > 1_000_000
          probe=subprocess.check_output([
              'ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height',
              '-of','csv=p=0:s=x',str(video)
          ], text=True).strip()
          assert probe=='1080x1920', probe
          audio=subprocess.check_output([
              'ffprobe','-v','error','-select_streams','a:0','-show_entries','stream=codec_name',
              '-of','default=nk=1:nw=1',str(video)
          ], text=True).strip()
          assert audio, 'missing audio stream'
          transcript=(root/'transcript.txt').read_text(encoding='utf-8').strip()
          spoken=''.join(str(row['spoken_text']) for row in subs['chunks'])
          normalized=''.join(transcript.split())
          assert spoken==normalized, 'subtitle/spoken transcript coverage mismatch'
          print(json.dumps({
              'render':'PASS',
              'resolution':probe,
              'audio_codec':audio,
              'duration':report['duration_seconds'],
              'subtitle_coverage':report['subtitle_coverage'],
              'zundamon_stationary':report['zundamon_stationary'],
              'text_hierarchy':report['text_hierarchy']
          }, ensure_ascii=False))
          PY

      - name: Audit repository for secret literals
        run: python scripts/audit_secret_safety.py --root .

      - name: Upload longform video and production evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zundamon-news-video-${{ github.run_id }}
          path: |
            artifacts/news-video-pilot/**
            artifacts/news_video_editorial_council.json
            artifacts/deepseek_paid_media_council.json
          if-no-files-found: warn
          retention-days: 7

      - name: Stop VOICEVOX engine
        if: always()
        run: docker rm -f voicevox-news-pilot >/dev/null 2>&1 || true
