name: "AI Army implementation review: NVIDIA + Google"

on:
  workflow_dispatch:
    inputs:
      resume_mission_id:
        description: "Existing durable Mission ID"
        required: false
        type: string
      resume_run_id:
        description: "Existing logical Run ID"
        required: false
        type: string
      resume_result_hash:
        description: "Previous verified Result Hash"
        required: false
        type: string
      resume_revision:
        description: "Next expected revision"
        required: false
        type: string
      resume_artifact_run_id:
        description: "Carrier run containing previous durable artifact; defaults to resume_run_id"
        required: false
        type: string
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - .github/nvidia-google.implementation-review

permissions:
  contents: read
  actions: read

concurrency:
  group: ai-army-implementation-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  implementation-review:
    if: ${{ github.ref_name == 'ai-army/provider-v3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact event HEAD without write credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bind source identity and validate resume tuple
        id: identity
        env:
          RESUME_MISSION_ID: ${{ inputs.resume_mission_id }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          RESUME_RESULT_HASH: ${{ inputs.resume_result_hash }}
          RESUME_ARTIFACT_RUN_ID: ${{ inputs.resume_artifact_run_id }}
        run: |
          set -euo pipefail
          SOURCE_HEAD="$(git rev-parse HEAD)"
          test "$SOURCE_HEAD" = "$GITHUB_SHA"
          echo "SOURCE_HEAD=$SOURCE_HEAD" >> "$GITHUB_ENV"
          python - <<'PY'
          import os
          values = [
              os.environ.get("RESUME_MISSION_ID", "").strip(),
              os.environ.get("RESUME_RUN_ID", "").strip(),
              os.environ.get("RESUME_RESULT_HASH", "").strip(),
          ]
          if any(values) and not all(values):
              raise SystemExit("PARTIAL_RESUME_IDENTITY")
          requested = all(values)
          artifact_run = os.environ.get("RESUME_ARTIFACT_RUN_ID", "").strip() or values[1]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"resume_requested={'true' if requested else 'false'}\n")
              handle.write(f"artifact_run_id={artifact_run if requested else ''}\n")
          PY

      - name: Restore previous durable Mission bundle
        if: ${{ steps.identity.outputs.resume_requested == 'true' }}
        uses: actions/download-artifact@v6
        with:
          name: ai-army-implementation-review-${{ steps.identity.outputs.artifact_run_id }}
          path: artifacts/resume
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.identity.outputs.artifact_run_id }}

      - name: Compile durability and provider runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m py_compile \
            scripts/mission_integrity.py \
            scripts/run_nvidia_orchestrator_guarded.py \
            scripts/run_nvidia_orchestrator_mission.py \
            scripts/mission_scheduler.py \
            scripts/provider_adapters.py \
            scripts/focused_nvidia_streaming_adapter.py \
            scripts/secure_account_evidence.py \
            scripts/validate_secure_evidence.py \
            scripts/probe_providers.py \
            scripts/probe_nvidia_google_focused.py \
            scripts/google_staging_readiness.py

      - name: Collect fresh redacted NVIDIA and Google evidence
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: >-
          python scripts/secure_account_evidence.py
          --provider nvidia
          --provider google
          --output artifacts/secure_account_evidence.json

      - name: Validate evidence redaction and freshness
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python scripts/validate_secure_evidence.py --input artifacts/secure_account_evidence.json

      - name: Probe exact NVIDIA Nemotron and Google candidates
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_PROBE_MODEL: gemini-3.8-flash
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_PROBE_MODEL: nvidia/nemotron-3.5-lightning-30b-a3b
        run: >-
          python scripts/probe_nvidia_google_focused.py
          --evidence-file artifacts/secure_account_evidence.json
          --output artifacts/provider_probe.json

      - name: Run one durable NVIDIA Lead Engineer review
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SOURCE_HEAD: ${{ env.SOURCE_HEAD }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RESUME_MISSION_ID: ${{ inputs.resume_mission_id }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          RESUME_RESULT_HASH: ${{ inputs.resume_result_hash }}
          RESUME_REVISION: ${{ inputs.resume_revision }}
          NVIDIA_MISSION_MODE: GOOGLE_BOOTSTRAP_SAFE
        run: python scripts/run_nvidia_orchestrator_guarded.py

      - name: Evaluate Google staging and Result Inbox integrity
        if: always()
        run: >-
          python scripts/google_staging_readiness.py
          --evidence artifacts/secure_account_evidence.json
          --probe artifacts/provider_probe.json
          --result-inbox artifacts/result_inbox.json
          --expected-head "$SOURCE_HEAD"
          --output artifacts/google_staging_readiness.json

      - name: Run targeted durability tests
        if: always()
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_mission_integrity \
            tests.test_guarded_nvidia_runner \
            tests.test_google_staging_readiness -v

      - name: Build redacted implementation summary
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def read(name):
              try:
                  value = json.loads(Path(name).read_text(encoding="utf-8"))
                  return value if isinstance(value, dict) else {}
              except Exception:
                  return {}

          probe = read("artifacts/provider_probe.json")
          mission = read("artifacts/mission_state.json")
          inbox = read("artifacts/result_inbox.json")
          google = read("artifacts/google_staging_readiness.json")
          ledger = read("artifacts/nvidia_orchestrator_ledger.json")
          probe_items = probe.get("providers") if isinstance(probe.get("providers"), list) else []
          nvidia_probe = next((x for x in probe_items if isinstance(x, dict) and x.get("provider") == "nvidia"), {})
          google_probe = next((x for x in probe_items if isinstance(x, dict) and x.get("provider") == "google"), {})
          summary = {
              "schema_version": "ai-army-implementation-review-v1",
              "source_head": os.environ.get("SOURCE_HEAD"),
              "nvidia_model": "nvidia/nemotron-3.5-lightning-30b-a3b",
              "google_model": "gemini-3.8-flash",
              "nvidia_probe_status": nvidia_probe.get("status"),
              "google_probe_status": google_probe.get("status"),
              "nvidia_probe_calls": int(nvidia_probe.get("model_calls", 0) or 0),
              "google_probe_calls": int(google_probe.get("model_calls", 0) or 0),
              "nvidia_review_calls": int(mission.get("nvidia_external_calls", 0) or 0),
              "nvidia_review_calls_uncertain": int(mission.get("nvidia_external_calls_uncertain", 0) or 0),
              "mission_id": mission.get("mission_id"),
              "run_id": mission.get("run_id"),
              "revision": mission.get("revision"),
              "mission_state": mission.get("state"),
              "result_status": mission.get("result_status"),
              "result_hash": inbox.get("result_hash"),
              "result_hash_verified": inbox.get("result_hash_verified") is True,
              "delivery_state": inbox.get("delivery_state"),
              "provider_reservation_state": mission.get("provider_reservation_state"),
              "ledger_unsettled_count": int(ledger.get("unsettled_count", 0) or 0),
              "google_state": google.get("state"),
              "google_live_ready": google.get("live_ready") is True,
              "google_repeat_nvidia_call_allowed": google.get("repeat_nvidia_call_allowed") is True,
              "google_result_integration": (google.get("lead_integration") or {}).get("decision") if isinstance(google.get("lead_integration"), dict) else None,
              "paid_execution_count": 0,
              "paid_fallback_count": 0,
              "production_active": False,
              "production_routing_changed": False,
              "secret_values_persisted": 0,
          }
          Path("artifacts/implementation_review_summary.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, sort_keys=True))
          PY
          python scripts/audit_secret_safety.py --root .

      - name: Upload durable redacted implementation bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ai-army-implementation-review-${{ github.run_id }}
          path: |
            artifacts/secure_account_evidence.json
            artifacts/provider_probe.json
            artifacts/mission_state.json
            artifacts/result_inbox.json
            artifacts/nvidia_orchestrator_ledger.json
            artifacts/google_staging_readiness.json
            artifacts/implementation_review_summary.json
          if-no-files-found: ignore
          retention-days: 14
