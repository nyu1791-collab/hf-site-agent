name: Dispatch AI slowdown longform v1

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - missions/media/20260915-ai-slowdown-longform-v1.render-trigger-v2

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical longform build at current branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-ai-slowdown-longform-v1.yml --repo nyu1791-collab/hf-site-agent --ref ai-army/provider-v3 -f checkpoint_run_id=34980788175
