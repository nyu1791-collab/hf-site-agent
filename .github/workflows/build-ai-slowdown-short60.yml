name: Build WOSADO TikTok Zundamon preview

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - missions/media/20260916-wosado-tiktok-zundamon.render-trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wosado-tiktok-zundamon-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUT: artifacts/wosado-tiktok-zundamon
      CACHE: .media-cache/assets
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Placeholder
        run: echo 'WRONG PATH - do not run'
