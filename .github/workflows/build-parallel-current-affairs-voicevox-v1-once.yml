name: "Build two current-affairs VOICEVOX tracks once"

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - .github/workflows/build-parallel-current-affairs-voicevox-v1-once.yml

permissions:
  contents: read

jobs:
  voice:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        video_id: [anthropic_ipo, nvidia_huggingface]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Start local VOICEVOX engine
        run: |
          set -euo pipefail
          docker pull voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          docker run -d --name voicevox -p 50021:50021 voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then
              curl -fsS http://127.0.0.1:50021/version
              exit 0
            fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1

      - name: Generate dialogue WAVs and measured timing
        env:
          VIDEO_ID: ${{ matrix.video_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.parse, urllib.request

          video_id = os.environ['VIDEO_ID']
          mission = json.loads(pathlib.Path('missions/media/20260914-parallel-current-affairs-v1.json').read_text(encoding='utf-8'))
          job = mission['jobs'][video_id]
          speakers = json.loads(urllib.request.urlopen('http://127.0.0.1:50021/speakers').read().decode('utf-8'))
          engine_version = urllib.request.urlopen('http://127.0.0.1:50021/version').read().decode('utf-8').strip()

          def choose_style(name):
              sp = next(x for x in speakers if x.get('name') == name)
              styles = sp.get('styles') or []
              normal = next((x for x in styles if x.get('name') in ('ノーマル','Normal','normal')), None)
              return sp.get('speaker_uuid'), (normal or styles[0])['id']

          voice_info = {name: choose_style(name) for name in ('ずんだもん','四国めたん')}
          out = pathlib.Path('artifacts')/video_id
          wavdir = out/'wav'
          wavdir.mkdir(parents=True, exist_ok=True)
          timing=[]
          cursor=0.0

          for item in job['dialogue']:
              speaker=item['speaker']
              speaker_uuid, sid = voice_info[speaker]
              params=urllib.parse.urlencode({'text':item['text'],'speaker':sid})
              req=urllib.request.Request('http://127.0.0.1:50021/audio_query?'+params,data=b'',method='POST')
              q=json.loads(urllib.request.urlopen(req).read().decode('utf-8'))
              emotion=item.get('emotion','neutral')
              if speaker=='ずんだもん':
                  q['speedScale']=1.05
                  q['pitchScale']=0.015
                  q['intonationScale']=1.06
              else:
                  q['speedScale']=1.00
                  q['pitchScale']=-0.005
                  q['intonationScale']=1.03
              if emotion in ('surprised','question','curious'):
                  q['intonationScale']=min(1.12, q['intonationScale']+0.04)
              if emotion in ('serious','skeptical'):
                  q['speedScale']=max(0.96, q['speedScale']-0.02)
              body=json.dumps(q,ensure_ascii=False).encode('utf-8')
              synth=urllib.request.Request(
                  f'http://127.0.0.1:50021/synthesis?speaker={sid}',
                  data=body,headers={'Content-Type':'application/json'},method='POST')
              wav=urllib.request.urlopen(synth).read()
              short='zundamon' if speaker=='ずんだもん' else 'metan'
              fname=f"{item['id']:03d}_{short}.wav"
              path=wavdir/fname
              path.write_bytes(wav)
              dur=float(subprocess.check_output([
                  'ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(path)
              ],text=True).strip())
              timing.append({**item,'speaker_uuid':speaker_uuid,'style_id':sid,'file':f'wav/{fname}','start':round(cursor,3),'duration':round(dur,3),'end':round(cursor+dur,3)})
              cursor += dur + 0.10

          manifest={
              'schema':'voicevox-parallel-current-affairs-timeline-v1',
              'video_id':video_id,
              'title':job['title'],
              'engine':'VOICEVOX local Docker',
              'engine_version':engine_version,
              'voice_info':{k:{'speaker_uuid':v[0],'style_id':v[1]} for k,v in voice_info.items()},
              'total_duration':round(cursor,3),
              'dialogue':timing,
              'pronunciation_policy':job['pronunciation_policy'],
              'generated_image_ai_used':False,
              'generated_video_ai_used':False,
              'public_publish_performed':False
          }
          (out/'timeline_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'source_notes.json').write_text(json.dumps(job['source_notes'],ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'video_id':video_id,'utterances':len(timing),'duration':manifest['total_duration'],'voice_info':manifest['voice_info']},ensure_ascii=False))
          PY

      - name: Upload voice artifact
        uses: actions/upload-artifact@v4
        with:
          name: current-affairs-${{ matrix.video_id }}-voicevox
          path: artifacts/${{ matrix.video_id }}
          retention-days: 3
