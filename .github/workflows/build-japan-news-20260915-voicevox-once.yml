name: "Build Japan news 20260915 VOICEVOX once"

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - missions/media/20260915-japan-news-two-videos.json

permissions:
  contents: read

concurrency:
  group: japan-news-20260915-voicevox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  voicevox:
    strategy:
      fail-fast: false
      matrix:
        video: [tax, hamaoka]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
      - name: Start local VOICEVOX engine
        run: |
          set -euo pipefail
          docker pull voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          docker run -d --name voicevox -p 50021:50021 voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1
      - name: Generate dialogue WAVs and timing
        env:
          VIDEO_KEY: ${{ matrix.video }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.parse, urllib.request
          key=os.environ['VIDEO_KEY']; root=pathlib.Path('.')
          mission=json.loads((root/'missions/media/20260915-japan-news-two-videos.json').read_text(encoding='utf-8'))
          video=next(v for v in mission['videos'] if v['key']==key)
          speakers=json.loads(urllib.request.urlopen('http://127.0.0.1:50021/speakers').read().decode('utf-8'))
          def choose_style(name):
              sp=next(x for x in speakers if x.get('name')==name); styles=sp.get('styles') or []
              normal=next((x for x in styles if x.get('name') in ('ノーマル','Normal','normal')),None)
              return (normal or styles[0])['id']
          ids={name:choose_style(name) for name in ('ずんだもん','四国めたん')}
          out=root/'artifacts'/'japan_news_20260915'/key; (out/'wav').mkdir(parents=True,exist_ok=True)
          timing=[]; cursor=0.0
          for item in video['dialogue']:
              speaker=item['speaker']; sid=ids[speaker]
              params=urllib.parse.urlencode({'text':item['voice_text'],'speaker':sid})
              req=urllib.request.Request('http://127.0.0.1:50021/audio_query?'+params,data=b'',method='POST')
              query=json.loads(urllib.request.urlopen(req).read().decode('utf-8'))
              if speaker=='ずんだもん': query.update(speedScale=1.15,pitchScale=0.02,intonationScale=1.14)
              else: query.update(speedScale=1.11,pitchScale=-0.01,intonationScale=1.10)
              body=json.dumps(query,ensure_ascii=False).encode('utf-8')
              synth=urllib.request.Request(f'http://127.0.0.1:50021/synthesis?speaker={sid}',data=body,headers={'Content-Type':'application/json'},method='POST')
              wav=urllib.request.urlopen(synth).read(); short='zundamon' if speaker=='ずんだもん' else 'metan'
              fname=f"{item['id']:03d}_{short}.wav"; path=out/'wav'/fname; path.write_bytes(wav)
              dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(path)],text=True).strip())
              timing.append({**item,'style_id':sid,'file':f'wav/{fname}','start':round(cursor,3),'duration':round(dur,3),'end':round(cursor+dur,3)})
              cursor += dur + 0.07
          manifest={'schema':'voicevox-dialogue-timeline-v3','video_key':key,'title':video['title'],'engine':'VOICEVOX local Docker','style_ids':ids,'total_duration':round(cursor,3),'dialogue':timing,'voice_caption_separated':True,'public_publish_performed':False,'artifact_scope':'VOICE_AND_TIMING_ONLY_NOT_FINAL_VIDEO'}
          (out/'timeline_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'video':key,'style_ids':ids,'utterances':len(timing),'total_duration':manifest['total_duration']},ensure_ascii=False))
          PY
      - name: Upload VOICEVOX artifact
        uses: actions/upload-artifact@v6
        with:
          name: japan-news-20260915-voicevox-${{ matrix.video }}-${{ github.run_id }}
          path: artifacts/japan_news_20260915/${{ matrix.video }}
          retention-days: 3
