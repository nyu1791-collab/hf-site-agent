name: Verify live Worker and source

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-worker-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact source without write credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate JavaScript source syntax
        run: |
          node --check worker/index.js
          node --check worker/ai-ops-audit.mjs
          node --check hf-space/app.js
      - name: Validate typed packet tooling
        run: |
          python3 -m py_compile scripts/validate_agent_packets.py scripts/provider_smoke.py scripts/provider_adapters.py
          python3 scripts/validate_agent_packets.py \
            --schema schemas/commander_packet.schema.json \
            --schema schemas/agent_task_packet.schema.json \
            --schema schemas/media_pipeline_plan.schema.json \
            --commander tests/fixtures/commander_packet.example.json \
            --agent tests/fixtures/agent_task_packet.example.json \
            --media tests/fixtures/media_pipeline_plan.example.json
      - name: Verify bounded provider source markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          worker = Path('worker/index.js').read_text(encoding='utf-8')
          adapter = Path('scripts/provider_adapters.py').read_text(encoding='utf-8')
          for marker in ('function redactLogText', 'function safeLogData', 'async function fetchWithTimeout'):
              assert marker in worker
          for marker in ('LIMITED_STAGING_MAX_OUTPUT_TOKENS = 8', '"RATE_LIMITED"', '"FREE_COST_UNVERIFIED"'):
              assert marker in adapter
          print('LIVE_WORKER_SOURCE_GUARDS=PASS')
          PY
      - name: Check public health endpoint
        run: |
          response="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 https://groq-github-site-agent.n-yu1791.workers.dev/health)"
          printf '%s' "$response" | jq -e '.ok == true and .service == "groq-github-site-agent"' >/dev/null
          echo 'LIVE_WORKER_HEALTH=PASS'
