name: Verify live Worker and source

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "worker/index.js"
      - ".github/workflows/verify-live-worker.yml"
      - ".github/workflows/sync-worker-admin-password.yml"
      - "hf-space/app.js"
      - "hf-space/index.html"
      - ".github/workflows/sync-hf-space.yml"
  push:
    branches:
      - main
    paths:
      - "worker/index.js"
      - ".github/workflows/verify-live-worker.yml"
      - ".github/workflows/sync-worker-admin-password.yml"
      - "hf-space/app.js"
      - "hf-space/index.html"
      - ".github/workflows/sync-hf-space.yml"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Worker source syntax
        uses: actions/checkout@v6

      - name: Run Node syntax check
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/index.js

      - name: Check admin-secret migration workflow safety
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const source = fs.readFileSync(".github/workflows/sync-worker-admin-password.yml", "utf8");
          if (!source.includes("on:\n  workflow_dispatch:\n")) {
            throw new Error("Admin-secret migration must remain manually dispatchable.");
          }
          if (/^  push:\s*$/m.test(source)) {
            throw new Error("Admin-secret migration must not run automatically on code pushes.");
          }
          if (!source.includes("uses: actions/checkout@v6")) {
            throw new Error("Admin-secret migration checkout action must use the Node 24 runtime.");
          }
          if (!source.includes("inputs.confirm == 'MIGRATE'") || !source.includes("github.ref == 'refs/heads/main'")) {
            throw new Error("Admin-secret migration requires the main-branch MIGRATE confirmation gate.");
          }
          if (!source.includes("persist-credentials: false")) {
            throw new Error("Admin-secret migration checkout credentials must not persist.");
          }
          const jobHeader = source.slice(0, source.indexOf("\n    steps:"));
          if (jobHeader.includes("secrets.")) {
            throw new Error("Admin-secret migration must not expose secrets at job scope.");
          }
          console.log("Admin-secret migration workflow safety check passed.");
          NODE

      - name: Check Hugging Face frontend safety contract
        shell: bash
        run: |
          set -euo pipefail
          node --check hf-space/app.js
          node <<'NODE'
          const fs = require("node:fs");
          const app = fs.readFileSync("hf-space/app.js", "utf8");
          const page = fs.readFileSync("hf-space/index.html", "utf8");
          const checkboxCheck = app.indexOf('if (!$("confirmed").checked)');
          const publishFlag = app.indexOf("confirmPublish: true");
          if (checkboxCheck < 0 || publishFlag < checkboxCheck) {
            throw new Error("HF publish confirmation must follow the checked review box.");
          }
          if (app.includes("allowPaidResearch") || app.includes("approve-paid") || page.includes("paid-approval")) {
            throw new Error("Paid-search controls must remain removed from the HF frontend.");
          }
          if (!page.includes("課金検索は実行しません")) {
            throw new Error("HF frontend must clearly state that paid search is disabled.");
          }
          console.log("Hugging Face frontend safety contract passed.");
          NODE

      - name: Check quota guard source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const source = fs.readFileSync("worker/index.js", "utf8");
          const expected = "const month = /^\\d{4}-\\d{2}$/.test";
          const broken = "const month = /^\\\\d{4}-\\\\d{2}$/.test";
          if (!source.includes(expected) || source.includes(broken)) {
            throw new Error("Tavily quota month validation is malformed.");
          }
          console.log("Quota guard source check passed.");
          NODE
      - name: Check public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 --retry-all-errors             --connect-timeout 10 --max-time 20             https://groq-github-site-agent.n-yu1791.workers.dev/health)"
          printf '%s' "$response" | jq -e '
            .ok == true and
            .service == "groq-github-site-agent" and
            .research.sourcesPerRequest == 10
          ' >/dev/null
          echo "Health check passed."

      - name: Check approval-gated content pipeline source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const source = fs.readFileSync("worker/index.js", "utf8");
          if (source.includes("allowPaidResearch")) throw new Error("Paid Tavily authorization path must remain removed.");
          if (!source.includes("/command/content-plan")) throw new Error("Content plan route is missing.");
          if (!source.includes('paidOperations: "disabled"')) throw new Error("Paid operations are not disabled in the pipeline.");
          const publishStart = source.indexOf('if (url.pathname === "/publish")');
          const publishEnd = source.indexOf('return fail("Unknown path."', publishStart);
          const publishRoute = source.slice(publishStart, publishEnd);
          const confirmationIndex = publishRoute.indexOf("payload.confirmPublish !== true");
          const validationIndex = publishRoute.indexOf("verifySite(payload.site, env)");
          const publishIndex = publishRoute.indexOf("await publish(site, env, id)");
          if (publishStart < 0 || publishEnd < 0 || confirmationIndex < 0) {
            throw new Error("Explicit publish confirmation gate is missing.");
          }
          if (confirmationIndex > validationIndex || confirmationIndex > publishIndex) {
            throw new Error("Publish confirmation must be checked before validation and repository writes.");
          }
          if (!publishRoute.includes("new HttpError(428")) {
            throw new Error("Missing publish confirmation must return HTTP 428.");
          }
          console.log("Approval-gated content pipeline source check passed.");
          NODE


      - name: Check authenticated content plan safety gates
        env:
          ADMIN_PASSWORD: ${{ secrets.WORKER_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_PASSWORD"
          response="$(curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 10 --max-time 20 \
            -H 'Origin: https://yu-179191-groq-github-site-agent.hf.space' \
            -H 'content-type: application/json' \
            -H "x-admin-password: $ADMIN_PASSWORD" \
            --data '{"goal":"安全なコンテンツ制作計画のランタイム検証"}' \
            https://groq-github-site-agent.n-yu1791.workers.dev/command/content-plan)"
          printf '%s' "$response" | jq -e '
            .content.pipeline.paidOperations == "disabled" and
            .content.pipeline.maxSources == 10 and
            .content.controls.paidSearch == "disabled" and
            .content.controls.youtubeUpload == "not_connected" and
            .content.controls.publicPublish == "explicit_confirmation_required"
          ' >/dev/null
          echo "Content plan safety-gate runtime check passed."

      - name: Check authenticated commander status
        env:
          ADMIN_PASSWORD: ${{ secrets.WORKER_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_PASSWORD"
          response="$(curl --fail --silent --show-error --retry 2 --retry-all-errors             --connect-timeout 10 --max-time 20             -H 'Origin: https://yu-179191-groq-github-site-agent.hf.space'             -H 'content-type: application/json'             -H "x-admin-password: $ADMIN_PASSWORD"             --data '{}'             https://groq-github-site-agent.n-yu1791.workers.dev/command/status)"
          printf '%s' "$response" | jq -e '
            .commander.specialists.web_research.implementation == "wired" and
            .commander.specialists.code_review.implementation == "planned" and
            .commander.specialists.vision_review.implementation == "planned" and
            .commander.specialists.image_generation.implementation == "planned" and
            .commander.specialists.video_generation.implementation == "planned"
          ' >/dev/null
          echo "Commander status check passed."
