name: Collect AI news searched assets

on:
  push:
    branches: [ai-army/provider-v3]
    paths:
      - 'media_jobs/ai_news_slowdown_assets_v2.json'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source without write credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Collect searched and rights-tracked assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.parse, hashlib, mimetypes

          root = pathlib.Path('artifacts/ai_news_slowdown_assets_v2')
          root.mkdir(parents=True, exist_ok=True)
          ua = {'User-Agent': 'hf-site-agent-media-asset-collector/1.0'}

          def fetch(url, path):
              req = urllib.request.Request(url, headers=ua)
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read()
                  ctype = r.headers.get_content_type()
              if not data:
                  raise RuntimeError(f'empty download: {url}')
              path.write_bytes(data)
              return {'url': url, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'content_type': ctype}

          def commons_file(filename, out_name, license_name, author, source_page):
              api = 'https://commons.wikimedia.org/w/api.php?' + urllib.parse.urlencode({
                  'action':'query','format':'json','prop':'imageinfo','iiprop':'url','titles':'File:'+filename
              })
              req = urllib.request.Request(api, headers=ua)
              with urllib.request.urlopen(req, timeout=30) as r:
                  obj = json.load(r)
              page = next(iter(obj['query']['pages'].values()))
              info = page['imageinfo'][0]
              rec = fetch(info['url'], root/out_name)
              rec.update({'source_page': source_page, 'license': license_name, 'author': author, 'kind':'SEARCH_COLLECTED_BACKGROUND'})
              return rec

          records = []

          # Official character artwork discovered from the official project site, not generated.
          rec = fetch('https://zunko.jp/images/chara_zm.png', root/'zundamon_official.png')
          rec.update({'source_page':'https://zunko.jp/temp.html','license':'OFFICIAL_CHARACTER_GUIDELINE_RECHECK_BEFORE_PUBLICATION','author':'SSS LLC / Tohoku Zunko & Zundamon Project','kind':'OFFICIAL_CHARACTER_ART'})
          records.append(rec)
          rec = fetch('https://zunko.jp/images/chara_sm.png', root/'shikoku_metan_official.png')
          rec.update({'source_page':'https://zunko.jp/temp.html','license':'OFFICIAL_CHARACTER_GUIDELINE_RECHECK_BEFORE_PUBLICATION','author':'SSS LLC / Tohoku Zunko & Zundamon Project','kind':'OFFICIAL_CHARACTER_ART'})
          records.append(rec)

          records.append(commons_file(
              'Dario Amodei at TechCrunch Disrupt 2023 01.jpg',
              'dario_amodei_ccby2.jpg','CC BY 2.0','TechCrunch',
              'https://commons.wikimedia.org/wiki/File:Dario_Amodei_at_TechCrunch_Disrupt_2023_01.jpg'))
          records.append(commons_file(
              'Datacenter Server Racks (22370909788).jpg',
              'datacenter_racks_ccby2.jpg','CC BY 2.0','Carl Lender',
              'https://commons.wikimedia.org/wiki/File:Datacenter_Server_Racks_(22370909788).jpg'))
          records.append(commons_file(
              'Anthropic logo.svg','anthropic_logo.svg','PUBLIC_DOMAIN_SIMPLE_TEXT_LOGO','Anthropic',
              'https://commons.wikimedia.org/wiki/File:Anthropic_logo.svg'))
          records.append(commons_file(
              'OpenAI logo 2025 (wordmark).svg','openai_wordmark.svg','PUBLIC_DOMAIN_SIMPLE_TEXT_LOGO','OpenAI',
              'https://commons.wikimedia.org/wiki/File:OpenAI_logo_2025_(wordmark).svg'))

          manifest = {
              'schema':'ai-news-slowdown-searched-assets-v2',
              'generated_by':'GitHub Actions network collector',
              'generated_image_ai_used': False,
              'video_generation_ai_used': False,
              'search_discovery_then_original_source_verification': True,
              'public_publish_performed': False,
              'assets': records,
              'notes': [
                  'Character art is official project artwork and must be rechecked against the current character guideline before monetized/public publication.',
                  'Dario Amodei and datacenter photographs are search-collected Wikimedia Commons files with stated CC BY 2.0 licenses; attribution must be retained.',
                  'Logos are used as editorial identifiers; trademark restrictions may still apply even when copyright status is public domain.'
              ]
          }
          (root/'asset_manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({'asset_count':len(records),'generated_image_ai_used':False}, ensure_ascii=False))
          PY

      - name: Validate collected assets
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/ai_news_slowdown_assets_v2/zundamon_official.png
          test -s artifacts/ai_news_slowdown_assets_v2/shikoku_metan_official.png
          test -s artifacts/ai_news_slowdown_assets_v2/dario_amodei_ccby2.jpg
          test -s artifacts/ai_news_slowdown_assets_v2/datacenter_racks_ccby2.jpg
          python - <<'PY'
          import json
          p='artifacts/ai_news_slowdown_assets_v2/asset_manifest.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['generated_image_ai_used'] is False
          assert len(d['assets']) >= 6
          PY

      - name: Upload searched asset pack
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-slowdown-searched-assets-v2
          path: artifacts/ai_news_slowdown_assets_v2
          if-no-files-found: error
          retention-days: 3
