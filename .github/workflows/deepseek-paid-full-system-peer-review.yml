name: "DeepSeek paid full-system peer review"

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - .github/workflows/deepseek-paid-full-system-peer-review.yml

permissions:
  contents: read

concurrency:
  group: deepseek-paid-full-system-peer-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact triggering source without write credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run eight bounded DeepSeek V4.1 Flash peer-review lanes
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import concurrent.futures
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          root=Path('.')
          mission=json.loads((root/'config/deepseek_full_system_peer_review_20260912.json').read_text(encoding='utf-8'))
          api_key=os.environ.get('DEEPSEEK_API_KEY','')
          if not api_key:
              raise SystemExit('DEEPSEEK_API_KEY missing')

          roles=[
            ('org-architecture','ORGANIZATION_ARCHITECT',
             'Audit the AI Army hierarchy, single-agent admission gate, central-manager pattern, role boundaries, task ownership and topology. Use the fresh evidence to propose the smallest architecture that maximizes success and speed. Explicitly identify rules to remove or demote.'),
            ('reliability-recovery','RELIABILITY_AND_RECOVERY_ENGINEER',
             'Map current policy against MAST-style failures and long-running-agent failure modes. Focus on fault containment, task leases, idempotency, checkpoints, stale-write prevention, termination, circuit breakers, provider isolation, rapid recovery, and preventing false success.'),
            ('context-state-observability','CONTEXT_STATE_AND_OBSERVABILITY_ENGINEER',
             'Audit context quarantine, handoffs, persistent state, trace design, artifact references, compaction, checkpoint semantics, evaluator independence, and regression evaluation. Reduce context/token waste while improving debuggability and evidence quality.'),
            ('routing-efficiency','ROUTING_AND_EFFICIENCY_ARCHITECT',
             'Design measurable routing and parallelism admission rules using task parallelizability, single-agent baseline strength, tool intensity, latency, cost, provider health and verification risk. Propose adaptive concurrency/backpressure and stop conditions without overengineering.'),
            ('clipping-highlights','CLIPPING_AND_HIGHLIGHT_SYSTEMS_REVIEWER',
             'Peer review livestream/podcast clipping automation: ASR/VAD/alignment, chat/audio/motion/semantic highlight signals, candidate diversity, boundary refinement, speaker awareness, duplicate suppression, reframing, captions, and human review. Prefer local/open tooling and evidence-based heuristics.'),
            ('video-editing','VIDEO_EDITING_RELIABILITY_REVIEWER',
             'Peer review long-form and short-form editing reliability: scene normalization, concat compatibility, ffprobe/decode validation, loudness normalization, subtitle timing, scene detection, partial outputs, atomic promotion, caching, disk/RAM efficiency and retry scope. Identify needless steps to remove.'),
            ('tiktok-commerce','TIKTOK_SHOP_COMMERCE_REVIEWER',
             'Peer review TikTok Shop research and creative policy: first 3 seconds, hooks, covers, subtitles, story arcs, product-page/official grounding, local review clustering, personas, product discovery, A/B tests, conversion metrics, return/complaint guardrails, AIGC disclosure and policy freshness.'),
            ('red-team-pruner','RED_TEAM_POLICY_PRUNER',
             'Assume the current policies are overbuilt. Challenge every layer. Find redundant agents, stale harness assumptions, duplicate checks, unnecessary framework adapters, brittle fixed heuristics, excessive review loops and expensive steps. Preserve only rules with clear failure-prevention or measurable value; propose ablation tests before deletion when uncertain.')
          ]

          policy_paths=[
            'config/multi_agent_operating_policy.json',
            'docs/MULTI_AGENT_OPERATING_STANDARD.md',
            'config/longform_video_reliability_policy.json',
            'config/authorized_clipping_monetization_policy.json',
            'config/tiktok_shop_influence_policy.json',
            'config/current_commander_handoff.json'
          ]
          chunks=[]
          for p in policy_paths:
              path=root/p
              if path.exists():
                  txt=path.read_text(encoding='utf-8',errors='replace')
                  chunks.append(f'\n### {p}\n{txt[:6500]}')
          current=''.join(chunks)[:32000]
          evidence=json.dumps(mission,ensure_ascii=False,separators=(',',':'))

          system='''You are DeepSeek V4.1 Flash serving as an independent paid peer reviewer under explicit human authorization. You are advisory only. Do not modify repository state, publish, deploy, merge, access or reveal secrets, or recommend bypassing platform rules. Distinguish primary-source evidence from research findings and from heuristics. Do not preserve complexity merely because it already exists. Prefer the simplest architecture that measurably improves success, latency, cost, recovery, and auditability. Return exactly one compact JSON object with keys: role, verdict, retain, change, remove_or_demote, add, failure_modes_addressed, tests, metrics, migration_order, confidence. Arrays must be concise and implementation-ready. Maximum 12 items per array.'''

          peak_hit=0.014
          peak_miss=0.44
          peak_out=1.32
          max_tokens=2200
          max_calls=8
          max_parallel=2
          max_total_cost=0.10

          def rough_tokens(s):
              return max(1,(len(s)+3)//4)

          def build(role):
              lane, role_name, instruction=role
              user=(f'ROLE={role_name}\nLANE={lane}\nTASK={instruction}\n'
                    f'FRESH_EVIDENCE_AND_REVIEW_QUESTIONS={evidence}\n'
                    f'CURRENT_POLICY_EXCERPTS={current}\n'
                    'Return JSON only. Do not claim facts beyond supplied evidence; label proposals as heuristics when appropriate.')
              return user

          reservations=[]
          for r in roles:
              user=build(r)
              reserve=(rough_tokens(system+user)*peak_miss + max_tokens*peak_out)/1_000_000
              reservations.append(reserve)
          if len(roles)>max_calls or sum(reservations)>max_total_cost:
              raise SystemExit(f'PAID_PREFLIGHT_BLOCKED calls={len(roles)} reserve={sum(reservations):.8f}')

          def call(idx,role):
              lane, role_name, _=role
              user=build(role)
              payload={
                'model':'deepseek-flash',
                'messages':[{'role':'system','content':system},{'role':'user','content':user}],
                'max_tokens':max_tokens,
                'stream':False,
                'response_format':{'type':'json_object'},
                'thinking':{'type':'disabled'}
              }
              req=urllib.request.Request(
                'https://api.deepseek.com/chat/completions',
                data=json.dumps(payload,ensure_ascii=False,separators=(',',':')).encode('utf-8'),
                headers={'Authorization':f'Bearer {api_key}','Content-Type':'application/json','Accept':'application/json','User-Agent':'hf-site-agent-full-peer-review/1'},
                method='POST')
              started=time.monotonic()
              try:
                  with urllib.request.urlopen(req,timeout=150) as resp:
                      obj=json.loads(resp.read(1_500_000).decode('utf-8'))
                  latency_ms=int((time.monotonic()-started)*1000)
                  choices=obj.get('choices') or []
                  if not choices:
                      raise RuntimeError('choices missing')
                  content=(choices[0].get('message') or {}).get('content')
                  if not isinstance(content,str) or not content.strip():
                      raise RuntimeError('visible content missing')
                  parsed=json.loads(content)
                  if not isinstance(parsed,dict):
                      raise RuntimeError('result is not object')
                  usage=obj.get('usage') or {}
                  prompt=int(usage.get('prompt_tokens') or 0)
                  hit=int(usage.get('prompt_cache_hit_tokens') or 0)
                  miss_raw=usage.get('prompt_cache_miss_tokens')
                  miss=int(miss_raw) if miss_raw is not None else max(0,prompt-hit)
                  completion=int(usage.get('completion_tokens') or 0)
                  cost=(hit*peak_hit+miss*peak_miss+completion*peak_out)/1_000_000
                  return {
                    'lane':lane,'role':role_name,'status':'READY','latency_ms':latency_ms,
                    'requested_model':'deepseek-flash','response_model':obj.get('model'),
                    'usage':usage,'conservative_peak_cost_usd':round(cost,8),
                    'reserved_peak_cost_usd':round(reservations[idx],8),'result':parsed
                  }
              except Exception as e:
                  return {
                    'lane':lane,'role':role_name,'status':'FAILED','error_class':type(e).__name__,
                    'detail':str(e)[:240],'reserved_peak_cost_usd':round(reservations[idx],8)
                  }

          outputs=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=max_parallel) as ex:
              futures={ex.submit(call,i,r):i for i,r in enumerate(roles)}
              for fut in concurrent.futures.as_completed(futures):
                  outputs.append(fut.result())

          outputs.sort(key=lambda x:[r[0] for r in roles].index(x['lane']))
          successful=[x for x in outputs if x['status']=='READY']
          known_cost=sum(float(x.get('conservative_peak_cost_usd') or 0) for x in successful)
          report={
            'schema_version':'deepseek-full-system-peer-review-report-v1',
            'mission_id':mission['mission_id'],
            'status':'READY' if len(successful)==len(roles) else ('PARTIAL' if successful else 'FAILED'),
            'model':'deepseek-flash','attempted_calls':len(outputs),'successful_calls':len(successful),
            'max_calls':max_calls,'max_parallel_calls':max_parallel,
            'reserved_peak_cost_usd':round(sum(reservations),8),
            'known_successful_conservative_peak_cost_usd':round(known_cost,8),
            'max_total_conservative_peak_cost_usd':max_total_cost,
            'repository_write':False,'publish':False,'deploy':False,'merge':False,'secret_mutation':False,
            'results':outputs
          }
          (root/'artifacts/deepseek_full_system_peer_review.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:report[k] for k in ['status','attempted_calls','successful_calls','reserved_peak_cost_usd','known_successful_conservative_peak_cost_usd']},ensure_ascii=False))
          if known_cost>max_total_cost or not successful:
              raise SystemExit(1)
          PY

      - name: Upload redacted peer-review artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deepseek-full-system-peer-review-${{ github.run_id }}
          path: artifacts/deepseek_full_system_peer_review.json
          if-no-files-found: ignore
          retention-days: 7
