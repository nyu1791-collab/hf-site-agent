name: Verify framework parallel governor

on:
  pull_request:
    paths:
      - "config/framework_adapter_layer.json"
      - "scripts/framework_adapter_layer.py"
      - "scripts/framework_consolidation_policy.py"
      - "scripts/framework_parallel_governor.py"
      - "scripts/parallel_framework_batch.py"
      - "tests/test_framework_parallel_governor.py"
      - "tests/test_parallel_framework_batch.py"
      - ".github/workflows/verify-framework-parallel-governor.yml"
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - "config/framework_adapter_layer.json"
      - "scripts/framework_adapter_layer.py"
      - "scripts/framework_consolidation_policy.py"
      - "scripts/framework_parallel_governor.py"
      - "scripts/parallel_framework_batch.py"
      - "tests/test_framework_parallel_governor.py"
      - "tests/test_parallel_framework_batch.py"
      - ".github/workflows/verify-framework-parallel-governor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile framework runtime
        run: |
          python -m py_compile \
            scripts/framework_adapter_layer.py \
            scripts/framework_consolidation_policy.py \
            scripts/framework_parallel_governor.py \
            scripts/parallel_framework_batch.py \
            tests/test_framework_parallel_governor.py \
            tests/test_parallel_framework_batch.py
      - name: Run parallel governor tests
        run: |
          python -m unittest \
            tests.test_framework_parallel_governor \
            tests.test_parallel_framework_batch \
            -v
      - name: Verify authority boundaries
        run: |
          python - <<'PY'
          from scripts.framework_adapter_layer import load_config
          config = load_config()
          policy = config['policy']
          assert policy['free_only_default'] is True
          assert policy['generic_paid_fallback'] is False
          assert policy['auto_top_up'] is False
          assert policy['external_framework_repository_write'] is False
          assert policy['external_framework_secret_mutation'] is False
          assert policy['external_framework_deploy'] is False
          assert policy['external_framework_publish'] is False
          assert policy['external_framework_payment'] is False
          assert int(config['parallel_batch']['max_frameworks_per_batch']) <= 2
          print('framework parallel safety boundaries ok')
          PY
