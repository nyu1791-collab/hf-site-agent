name: DeepSeek Targeted Review Offline CI

on:
  push:
    branches:
      - ai-army/framework-adapter-v1
    paths:
      - scripts/deepseek_targeted_review.py
      - scripts/deepseek_specialist_trial.py
      - scripts/deepseek_specialist_trial_v4.py
      - tests/test_deepseek_targeted_review.py
      - config/deepseek_targeted_review.json
      - config/deepseek_framework_adapter_review_*.json
      - .github/workflows/deepseek-targeted-review-offline-ci.yml
  pull_request:
    branches:
      - ai-army/provider-v3
    paths:
      - scripts/deepseek_targeted_review.py
      - scripts/deepseek_specialist_trial.py
      - scripts/deepseek_specialist_trial_v4.py
      - tests/test_deepseek_targeted_review.py
      - config/deepseek_targeted_review.json
      - config/deepseek_framework_adapter_review_*.json
      - .github/workflows/deepseek-targeted-review-offline-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseek-targeted-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact source without write credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile bounded review path
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/deepseek_specialist_trial.py \
            scripts/deepseek_specialist_trial_v4.py \
            scripts/deepseek_targeted_review.py \
            tests/test_deepseek_targeted_review.py

      - name: Test safety boundaries and concurrent isolation
        run: python -m unittest tests.test_deepseek_targeted_review -v

      - name: Dry-run all targeted manifests with network disabled
        run: |
          set -euo pipefail
          mkdir -p artifacts/offline-deepseek
          for manifest in \
            config/deepseek_targeted_review.json \
            config/deepseek_framework_adapter_review_a.json \
            config/deepseek_framework_adapter_review_b.json \
            config/deepseek_framework_adapter_review_c.json
          do
            name="$(basename "${manifest}" .json)"
            output="artifacts/offline-deepseek/${name}.json"
            python scripts/deepseek_targeted_review.py \
              --manifest "${manifest}" \
              --output "${output}"
            python -m json.tool "${output}" >/dev/null
            python - "${output}" <<'PY'
          import json
          from pathlib import Path
          import sys

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report.get("status") == "TRIAL_DRY_RUN"
          assert report.get("repository_write") is False
          assert report.get("merge") is False
          assert report.get("deploy") is False
          assert report.get("publish") is False
          assert report.get("secret_mutation") is False
          assert report.get("generic_paid_fallback") is False
          assert report.get("production_routing_changed") is False
          assert report.get("targeted_max_calls") == 1
          assert float(report.get("targeted_max_estimated_cost_usd", 1)) <= 0.05
          PY
          done
