name: Resume AI slowdown longform render v5

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - missions/media/20260915-ai-slowdown-longform-v1.resume-render-trigger-v5

permissions:
  contents: read
  actions: read

concurrency:
  group: ai-slowdown-longform-render-v5
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OUT: artifacts/ai-slowdown-longform-v1
      CACHE: .media-cache/assets
      REACTION: .media-cache/derived/zm-reaction-pack-v1
    steps:
      - uses: actions/checkout@v4

      - name: Install deterministic media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fontconfig
          python -m pip install --upgrade pip
          python -m pip install pillow
          mkdir -p "$OUT" "$CACHE" "$REACTION"

      - name: Restore verified narration checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ai-slowdown-longform-v1-34981975586
          path: artifacts/ai-slowdown-longform-v1
          github-token: ${{ github.token }}
          repository: nyu1791-collab/hf-site-agent
          run-id: 34981975586

      - name: Validate checkpoint and current entrypoints
        run: |
          python -m py_compile scripts/render_zundamon_metan_longform.py
          python -m py_compile scripts/prepare_character_reaction_pack.py
          python -m py_compile scripts/character_shell_root.py
          python scripts/media_asset_resolver.py --validate-only
          python - <<'PY'
          import base64,gzip,json,os
          from pathlib import Path
          out=Path(os.environ['OUT'])
          mission=json.loads(gzip.decompress(base64.b64decode(Path('missions/media/20260915-ai-slowdown-longform-v1.json.gz.b64').read_text().strip())).decode())
          timing=json.loads((out/'timing.json').read_text())
          lines=[line for scene in mission['scenes'] for line in scene['dialogue']]
          expected_ids={str(line['id']) for line in lines}
          wav_ids={p.stem for p in (out/'voice').glob('*.wav')}
          assert timing.get('mission_id')==mission.get('mission_id')
          assert int(timing.get('line_count',-1))==len(lines)==64
          dur=float(timing.get('total_duration',0))
          assert 480 <= dur <= 720, dur
          assert float(timing.get('subtitle_narration_coverage_ratio',0))==1.0
          assert wav_ids==expected_ids, {'missing':sorted(expected_ids-wav_ids),'extra':sorted(wav_ids-expected_ids)}
          (out/'mission.json').write_text(json.dumps(mission,ensure_ascii=False,indent=2)+'\n')
          print({'checkpoint':'PASS','line_count':len(lines),'duration':dur,'coverage':1.0})
          PY

      - name: Rebuild verified character reaction pack
        run: |
          python scripts/media_asset_resolver.py \
            --asset-id zm_shell_20230806 \
            --cache-root "$CACHE" \
            --allow-network \
            --max-workers 1 \
            --manifest-out "$OUT/character-shell.json"
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.character_shell_root import resolve_character_shell_root
          m=json.loads(Path('artifacts/ai-slowdown-longform-v1/character-shell.json').read_text())
          extracted=m['results'][0].get('extracted_path')
          assert extracted and Path(extracted).is_dir(), extracted
          root=resolve_character_shell_root(Path(extracted))
          Path('artifacts/ai-slowdown-longform-v1/character-source.txt').write_text(str(root),encoding='utf-8')
          PY
          SRC=$(cat "$OUT/character-source.txt")
          python scripts/prepare_character_reaction_pack.py \
            --shell-root "$SRC" \
            --source-receipt "$CACHE/characters/zm_shell_20230806/receipt.json" \
            --output "$REACTION"
          python - <<'PY'
          import json,os
          from pathlib import Path
          pack=Path(os.environ['REACTION'])
          inv=json.loads((pack/'inventory.json').read_text(encoding='utf-8'))
          char_map={'Zundamon':'zundamon','Metan':'metan'}
          category_map={'full_body':'full_body','eyes':'eye','brows':'eyebrow','mouth':'mouth'}
          records=[]
          for source_char,target_char in char_map.items():
              char=inv['characters'][source_char]
              for source_category,target_category in category_map.items():
                  for row in char.get('categories',{}).get(source_category,[]):
                      path=(pack/row['normalized_path']).resolve()
                      assert path.is_file(), path
                      records.append({'character':target_char,'category':target_category,'path':str(path),'sha256':row.get('sha256'),'width':row.get('width'),'height':row.get('height')})
          for character in ('zundamon','metan'):
              assert any(r['character']==character and r['category']=='full_body' for r in records)
              assert any(r['character']==character and r['category']=='mouth' for r in records)
          Path(os.environ['OUT'],'reaction_inventory.json').write_text(json.dumps({'schema':'longform-character-inventory-v1','records':records},ensure_ascii=False,indent=2)+'\n')
          print({'reaction_records':len(records)})
          PY
          python scripts/validate_media_character_reaction_cache.py

      - name: Resolve optional rights-registered photos sequentially
        run: |
          python - <<'PY'
          import json,time,traceback,os
          from pathlib import Path
          from scripts.media_asset_resolver import load_standard, validate_standard, resolve_ids
          standard=load_standard(); validate_standard(standard)
          cache=Path(os.environ['CACHE'])
          ids=[
            'dario_amodei_tc_disrupt_2023',
            'sam_altman_ted_2025',
            'openai_hq_1515_third_street',
            'csiro_server_racks_2042',
            'cyberport_network_operations_centre',
          ]
          results=[]; failures=[]
          for aid in ids:
              try:
                  rows=resolve_ids(standard,asset_ids=[aid],cache_root=cache,allow_network=True,max_workers=1)
                  results.extend(rows)
                  print({'asset':aid,'status':rows[0].get('status')})
              except Exception as exc:
                  failures.append({'asset_id':aid,'error_type':type(exc).__name__,'error':str(exc)[:500]})
                  print({'asset':aid,'status':'OPTIONAL_FALLBACK','error':str(exc)[:200]})
              time.sleep(2.0)
          manifest={'schema':'media-asset-materialization-manifest-v1','cache_root':str(cache),'asset_count':len(results),'search_performed':False,'results':results,'optional_failures':failures}
          out=Path(os.environ['OUT'])/'visual_assets.json'
          out.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          print({'visual_successes':len(results),'visual_fallbacks':len(failures)})
          PY

      - name: Risk-triggered visual preview gate
        run: |
          rm -rf "$OUT/preview"
          python scripts/render_zundamon_metan_longform.py \
            --mission-b64 missions/media/20260915-ai-slowdown-longform-v1.json.gz.b64 \
            --timing "$OUT/timing.json" \
            --reaction-inventory "$OUT/reaction_inventory.json" \
            --asset-manifest "$OUT/visual_assets.json" \
            --voice-root "$OUT/voice" \
            --output-dir "$OUT/preview" \
            --preview-only
          python - <<'PY'
          from PIL import Image,ImageStat
          from pathlib import Path
          p=Path('artifacts/ai-slowdown-longform-v1/preview/representative_contact_sheet.jpg')
          im=Image.open(p).convert('RGB')
          assert im.size==(1350,960), im.size
          stat=ImageStat.Stat(im)
          assert sum(stat.var)/3 > 400, stat.var
          print({'preview_size':im.size,'variance':stat.var})
          PY

      - name: Render scene checkpoints and final MP4
        run: |
          rm -rf "$OUT/final"
          python scripts/render_zundamon_metan_longform.py \
            --mission-b64 missions/media/20260915-ai-slowdown-longform-v1.json.gz.b64 \
            --timing "$OUT/timing.json" \
            --reaction-inventory "$OUT/reaction_inventory.json" \
            --asset-manifest "$OUT/visual_assets.json" \
            --voice-root "$OUT/voice" \
            --output-dir "$OUT/final"

      - name: Mechanical final gate
        run: |
          FINAL="$OUT/final/ai-slowdown-longform-v1.mp4"
          test -s "$FINAL"
          ffprobe -v error -show_streams -show_format -of json "$FINAL" > "$OUT/final/ffprobe.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/ai-slowdown-longform-v1/final')
          d=json.loads((root/'ffprobe.json').read_text())
          v=next(x for x in d['streams'] if x['codec_type']=='video'); a=next(x for x in d['streams'] if x['codec_type']=='audio')
          dur=float(d['format']['duration'])
          assert 480 <= dur <= 720, dur
          assert int(v['width'])==1080 and int(v['height'])==1920
          assert v['codec_name']=='h264' and v.get('pix_fmt')=='yuv420p'
          assert a['codec_name']=='aac' and int(a['sample_rate'])==48000
          t=json.loads(Path('artifacts/ai-slowdown-longform-v1/timing.json').read_text())
          assert t['subtitle_narration_coverage_ratio']==1.0
          print({'duration':dur,'video':v['codec_name'],'pix_fmt':v.get('pix_fmt'),'audio':a['codec_name'],'sample_rate':a['sample_rate']})
          PY
          ffmpeg -v error -i "$FINAL" -f null - 2> "$OUT/final/decode-errors.log"
          test ! -s "$OUT/final/decode-errors.log"
          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/ai-slowdown-longform-v1/final/ai-slowdown-longform-v1.mp4')
          b=p.read_bytes()[:8_000_000]
          moov=b.find(b'moov'); mdat=b.find(b'mdat')
          assert moov>0 and mdat>0 and moov<mdat, (moov,mdat)
          print({'faststart':True,'moov':moov,'mdat':mdat})
          PY

      - name: Extract representative frames and completion manifest
        run: |
          FINAL="$OUT/final/ai-slowdown-longform-v1.mp4"
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$FINAL")
          python - "$DUR" <<'PY'
          import subprocess,sys,hashlib,json
          from pathlib import Path
          from PIL import Image
          dur=float(sys.argv[1]); root=Path('artifacts/ai-slowdown-longform-v1/final'); out=root/'visual-samples'; out.mkdir(parents=True,exist_ok=True)
          for i,f in enumerate((.05,.25,.50,.75,.95),1):
              subprocess.run(['ffmpeg','-y','-hide_banner','-loglevel','error','-ss',str(dur*f),'-i',str(root/'ai-slowdown-longform-v1.mp4'),'-frames:v','1',str(out/f'sample-{i}.jpg')],check=True)
          files=sorted(out.glob('*.jpg')); sheet=Image.new('RGB',(270*5,480),(235,240,244))
          for i,p in enumerate(files):
              im=Image.open(p).convert('RGB'); im.thumbnail((270,480)); sheet.paste(im,(i*270,0))
          sheet.save(root/'final-contact-sheet.jpg',quality=90)
          mp4=root/'ai-slowdown-longform-v1.mp4'
          result={'schema':'longform-finished-artifact-v1','mission_id':'20260915-ai-slowdown-longform-v1','status':'MACHINE_GATES_PASS_VISUAL_REREVIEW_PENDING','sha256':hashlib.sha256(mp4.read_bytes()).hexdigest(),'bytes':mp4.stat().st_size,'duration_seconds':dur,'decode_error_count':0,'fast_start':True,'subtitle_narration_coverage_ratio':1.0,'public_publish':False}
          (root/'completion.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(result)
          PY

      - name: Upload build evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-slowdown-longform-v1-resume-v5-${{ github.run_id }}
          path: artifacts/ai-slowdown-longform-v1
          if-no-files-found: warn
          retention-days: 7
