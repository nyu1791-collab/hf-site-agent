name: "AI Army subordinate continuation carrier"

on:
  workflow_dispatch:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - .github/subordinate-continuation-trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: subordinate-continuation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  continuation-carrier:
    if: ${{ github.ref_name == 'ai-army/provider-v3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact triggering source without write credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate continuation contracts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m py_compile \
            scripts/subordinate_continuation_carrier.py \
            scripts/subordinate_continuation_carrier_v2.py \
            scripts/failure_aware_specialist_retry.py \
            scripts/failure_aware_specialist_council.py \
            scripts/organization_coordination.py \
            scripts/deepseek_paid_parallel.py \
            scripts/deepseek_v41_paid_parallel.py \
            scripts/staging_parallel_scheduler.py \
            scripts/run_nvidia_worker_expansion_self_heal.py \
            scripts/run_nvidia_google_staging_focused.py
          python -m json.tool config/subordinate_continuation_policy.json >/dev/null
          python -m json.tool config/current_commander_handoff.json >/dev/null
          python -m json.tool config/deepseek_v41_paid_parallel.json >/dev/null
          python -m unittest \
            tests.test_subordinate_continuation_carrier \
            tests.test_subordinate_continuation_carrier_v2 \
            tests.test_staging_parallel_scheduler \
            tests.test_deepseek_v41_policy_alignment -v
          python - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path('config/subordinate_continuation_policy.json').read_text())
          hard = policy['hard_boundaries']
          assert float(policy['paid_seed']['max_estimated_cost_usd_per_execution']) <= 0.10
          assert int(policy['paid_seed']['max_calls']) <= 2
          assert policy['paid_seed']['allow_repeat_inside_continuation'] is False
          for key in ('repository_write','merge','deploy','publish','secret_readback','secret_mutation','auto_top_up','generic_paid_fallback','production_active'):
              assert hard[key] is False
          PY

      - name: Run one bounded DeepSeek V4.1 Flash seed
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          grep -Fxq 'allow_deepseek_paid_trial=true' .github/worker-expansion-trigger.txt
          python scripts/deepseek_v41_paid_parallel.py \
            --network \
            --config config/deepseek_v41_paid_parallel.json \
            --approval-file .github/worker-expansion-trigger.txt \
            --output artifacts/deepseek_paid_parallel.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/deepseek_paid_parallel.json').read_text())
          assert int(report.get('paid_calls', 0)) <= 2
          assert float(report.get('cost_exposure_usd', 0) or 0) <= 0.10
          assert float(report.get('max_estimated_cost_usd', 0) or 0) <= 0.10
          assert report.get('repository_write') is False
          assert report.get('deploy') is False
          assert report.get('publish') is False
          assert report.get('generic_paid_fallback') is False
          PY

      - name: Probe exact-free lower worker pool
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.probe_free_workers_multi import run_multi_probe
          report = run_multi_probe(api_key=os.environ.get('OPENROUTER_API_KEY') or '', explicit_approval=True)
          Path('artifacts/openrouter_expansion_probe.json').write_text(json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2) + '\n')
          print(json.dumps({'status': report.get('status'), 'verified_free_model_count': report.get('verified_free_model_count', 0), 'model_calls': report.get('model_calls', 0)}, sort_keys=True))
          PY

      - name: Benchmark verified lower workers
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.benchmark_free_workers import run_benchmarks
          probe = json.loads(Path('artifacts/openrouter_expansion_probe.json').read_text())
          report = run_benchmarks(api_key=os.environ.get('OPENROUTER_API_KEY') or '', probe_report=probe)
          Path('artifacts/openrouter_expansion_benchmark.json').write_text(json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2) + '\n')
          print(json.dumps({'status': report.get('status'), 'ready_role_count': report.get('ready_role_count', 0), 'model_calls': report.get('model_calls', 0)}, sort_keys=True))
          PY

      - name: Hand commander result to bounded lower-AI continuation loop
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/subordinate_continuation_carrier_v2.py \
            --handoff config/current_commander_handoff.json \
            --policy config/subordinate_continuation_policy.json \
            --probe artifacts/openrouter_expansion_probe.json \
            --benchmark artifacts/openrouter_expansion_benchmark.json \
            --deepseek-seed artifacts/deepseek_paid_parallel.json \
            --source-head "$GITHUB_SHA" \
            --output artifacts/subordinate_continuation_state.json \
            --council-output artifacts/worker_council.json
          python scripts/organization_coordination.py \
            --council artifacts/worker_council.json \
            --source-head "$GITHUB_SHA" \
            --mission-id subordinate-continuation-${{ github.run_id }} \
            --output artifacts/organization_blackboard.json

      - name: Collect fresh redacted NVIDIA and Google evidence
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: >-
          python scripts/secure_account_evidence.py
          --provider nvidia
          --provider google
          --output artifacts/secure_account_evidence.json

      - name: Validate upper-provider evidence
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python scripts/validate_secure_evidence.py --input artifacts/secure_account_evidence.json

      - name: Probe exact NVIDIA and Google upper models
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_PROBE_MODEL: gemini-3.8-flash
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_PROBE_MODEL: nvidia/nemotron-3.5-lightning-30b-a3b
        run: >-
          python scripts/probe_nvidia_google_focused.py
          --evidence-file artifacts/secure_account_evidence.json
          --output artifacts/provider_probe.json

      - name: Run independent NVIDIA final synthesis on lower-AI results
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          SOURCE_HEAD: ${{ github.sha }}
        run: python scripts/run_nvidia_worker_expansion_self_heal.py

      - name: Bind continuation state into optional Google plus NVIDIA final review
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads(Path('artifacts/subordinate_continuation_state.json').read_text())
          handoff = json.loads(Path('config/current_commander_handoff.json').read_text())
          objective = (
              str(handoff.get('objective') or '')[:5000]
              + ' Final upper-organization review. Lower-AI completed lanes=' + json.dumps(state.get('completed_lanes', []))
              + '; remaining lanes=' + json.dumps(state.get('remaining_lanes', []))
              + '. Validate correctness, contradictions, retry/no-replay behavior, and minimal tests. Do not edit repository state.'
          )
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('AI_ARMY_TASK_ROLE=SUBORDINATE_CONTINUATION_FINAL_REVIEW\n')
              f.write('AI_ARMY_OBJECTIVE<<EOF\n' + objective + '\nEOF\n')
          PY

      - name: Run fail-closed Google executor plus NVIDIA reviewer when both routes are proven
        continue-on-error: true
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SOURCE_HEAD: ${{ github.sha }}
        run: >-
          python scripts/run_nvidia_google_staging_focused.py
          --evidence-file artifacts/secure_account_evidence.json
          --probe-file artifacts/provider_probe.json
          --network
          --ledger artifacts/upper_review_ledger.json
          --checkpoint-root artifacts/upper_review_checkpoints
          --output artifacts/upper_review.json

      - name: Audit continuation safety and outputs
        if: always()
        run: |
          set -euo pipefail
          python scripts/audit_secret_safety.py --root .
          python -m json.tool artifacts/subordinate_continuation_state.json >/dev/null
          python -m json.tool artifacts/worker_council.json >/dev/null
          python -m json.tool artifacts/organization_blackboard.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('artifacts/subordinate_continuation_state.json').read_text())
          council = json.loads(Path('artifacts/worker_council.json').read_text())
          hard = state.get('hard_boundaries') or {}
          assert state.get('deepseek_repeat_paid_calls') == 0
          assert state.get('duplicate_replay_on_uncertain_usage') is False
          assert float(state.get('max_paid_cost_usd_per_execution', 0)) <= 0.10
          assert council.get('schema_version') == 'failure-aware-specialist-council-v8'
          assert council.get('length_exhaustion_policy') == 'EXPLICIT_LENGTH_STOP_ONLY'
          assert council.get('empty_visible_content_is_length_exhaustion') is False
          for key in ('repository_write','merge','deploy','publish','secret_readback','secret_mutation','auto_top_up','generic_paid_fallback','production_active'):
              assert hard.get(key) is False
          PY

      - name: Upload redacted continuation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: subordinate-continuation-${{ github.run_id }}
          path: |
            artifacts/deepseek_paid_parallel.json
            artifacts/openrouter_expansion_probe.json
            artifacts/openrouter_expansion_benchmark.json
            artifacts/subordinate_continuation_state.json
            artifacts/worker_council.json
            artifacts/organization_blackboard.json
            artifacts/secure_account_evidence.json
            artifacts/provider_probe.json
            artifacts/mission_state.json
            artifacts/result_inbox.json
            artifacts/nvidia_orchestrator_ledger.json
            artifacts/commander_self_heal.json
            artifacts/upper_review.json
            artifacts/upper_review_ledger.json
          if-no-files-found: ignore
          retention-days: 14
