name: Build AI slowdown longform v1

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - missions/media/20260915-ai-slowdown-longform-v1.render-trigger

permissions:
  contents: read

concurrency:
  group: ai-slowdown-longform-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OUT: artifacts/ai-slowdown-longform-v1
      CACHE: .media-cache/assets
      REACTION: .media-cache/derived/zm-reaction-pack-v1
    steps:
      - uses: actions/checkout@v4

      - name: Install deterministic media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fontconfig
          python -m pip install --upgrade pip
          python -m pip install pillow
          mkdir -p "$OUT" "$CACHE" "$REACTION" artifacts/longform-preflight

      - name: Validate Python entrypoints
        run: |
          python -m py_compile scripts/synthesize_longform_voicevox.py
          python -m py_compile scripts/render_zundamon_metan_longform.py
          python scripts/media_asset_resolver.py --validate-only

      - name: Start local VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          docker run -d --rm --name voicevox -p 50021:50021 voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1

      - name: Longform runtime preflight
        run: |
          python scripts/longform_video_preflight.py \
            --output-dir artifacts/longform-preflight \
            --voicevox-url http://127.0.0.1:50021

      - name: Decode canonical dialogue for evidence artifact
        run: |
          python - <<'PY'
          import base64,gzip
          from pathlib import Path
          src=Path('missions/media/20260915-ai-slowdown-longform-v1.json.gz.b64')
          out=Path('artifacts/ai-slowdown-longform-v1/mission.json')
          out.write_bytes(gzip.decompress(base64.b64decode(src.read_text().strip())))
          PY

      - name: Synthesize and measure 67 VOICEVOX turns
        run: |
          python scripts/synthesize_longform_voicevox.py \
            --mission-b64 missions/media/20260915-ai-slowdown-longform-v1.json.gz.b64 \
            --output-dir "$OUT/voice" \
            --timing-out "$OUT/timing.json" \
            --min-seconds 480 \
            --max-seconds 720

      - name: Resolve registered character shell once
        run: |
          python scripts/media_asset_resolver.py \
            --asset-id zm_shell_20230806 \
            --cache-root "$CACHE" \
            --allow-network \
            --manifest-out "$OUT/character-shell.json"
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('artifacts/ai-slowdown-longform-v1/character-shell.json').read_text())
          p=m['results'][0].get('extracted_path')
          assert p and Path(p).is_dir(), p
          Path('artifacts/ai-slowdown-longform-v1/character-source.txt').write_text(p)
          PY

      - name: Prepare and validate reusable reaction pack
        run: |
          SRC=$(cat "$OUT/character-source.txt")
          python scripts/prepare_character_reaction_pack.py \
            --source-root "$SRC" \
            --pack-root "$REACTION" \
            --inventory-out "$OUT/reaction_inventory.json" \
            --contact-sheet "$OUT/reaction_contact_sheet.png"
          python scripts/validate_media_character_reaction_cache.py

      - name: Resolve rights-registered visuals before render
        run: |
          python scripts/media_asset_resolver.py \
            --asset-id dario_amodei_tc_disrupt_2023 \
            --asset-id sam_altman_ted_2025 \
            --asset-id openai_hq_1515_third_street \
            --asset-id datacenter_server_racks_22370909788 \
            --asset-id csiro_server_racks_2042 \
            --asset-id cyberport_network_operations_centre \
            --cache-root "$CACHE" \
            --allow-network \
            --manifest-out "$OUT/visual_assets.json"

      - name: Risk-triggered visual preview gate
        run: |
          rm -rf "$OUT/preview"
          python scripts/render_zundamon_metan_longform.py \
            --mission-b64 missions/media/20260915-ai-slowdown-longform-v1.json.gz.b64 \
            --timing "$OUT/timing.json" \
            --reaction-inventory "$OUT/reaction_inventory.json" \
            --asset-manifest "$OUT/visual_assets.json" \
            --voice-root "$OUT/voice" \
            --output-dir "$OUT/preview" \
            --preview-only
          python - <<'PY'
          from PIL import Image,ImageStat
          from pathlib import Path
          p=Path('artifacts/ai-slowdown-longform-v1/preview/representative_contact_sheet.jpg')
          im=Image.open(p).convert('RGB')
          assert im.size==(1350,960), im.size
          stat=ImageStat.Stat(im)
          assert sum(stat.var)/3 > 400, stat.var
          print({'preview_size':im.size,'mean':stat.mean,'variance':stat.var})
          PY

      - name: Render scene checkpoints and final MP4
        run: |
          rm -rf "$OUT/final"
          python scripts/render_zundamon_metan_longform.py \
            --mission-b64 missions/media/20260915-ai-slowdown-longform-v1.json.gz.b64 \
            --timing "$OUT/timing.json" \
            --reaction-inventory "$OUT/reaction_inventory.json" \
            --asset-manifest "$OUT/visual_assets.json" \
            --voice-root "$OUT/voice" \
            --output-dir "$OUT/final"

      - name: Mechanical final gate
        run: |
          FINAL="$OUT/final/ai-slowdown-longform-v1.mp4"
          test -s "$FINAL"
          ffprobe -v error -show_streams -show_format -of json "$FINAL" > "$OUT/final/ffprobe.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/ai-slowdown-longform-v1/final/ffprobe.json')
          d=json.loads(p.read_text())
          streams=d['streams']; v=next(x for x in streams if x['codec_type']=='video'); a=next(x for x in streams if x['codec_type']=='audio')
          dur=float(d['format']['duration'])
          assert 480 <= dur <= 720, dur
          assert int(v['width'])==1080 and int(v['height'])==1920, (v['width'],v['height'])
          assert v['codec_name']=='h264', v['codec_name']
          assert v.get('pix_fmt')=='yuv420p', v.get('pix_fmt')
          assert a['codec_name']=='aac', a['codec_name']
          assert int(a['sample_rate'])==48000, a['sample_rate']
          t=json.loads(Path('artifacts/ai-slowdown-longform-v1/timing.json').read_text())
          assert t['subtitle_narration_coverage_ratio']==1.0
          print({'duration':dur,'video':v['codec_name'],'audio':a['codec_name'],'sample_rate':a['sample_rate']})
          PY
          ffmpeg -v error -i "$FINAL" -f null - 2> "$OUT/final/decode-errors.log"
          test ! -s "$OUT/final/decode-errors.log"
          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/ai-slowdown-longform-v1/final/ai-slowdown-longform-v1.mp4')
          b=p.read_bytes()[:8_000_000]
          moov=b.find(b'moov'); mdat=b.find(b'mdat')
          assert moov>0 and mdat>0 and moov<mdat, (moov,mdat)
          print({'faststart':True,'moov':moov,'mdat':mdat})
          PY

      - name: Extract representative frames from final video
        run: |
          FINAL="$OUT/final/ai-slowdown-longform-v1.mp4"
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$FINAL")
          python - "$DUR" <<'PY'
          import subprocess,sys
          from pathlib import Path
          dur=float(sys.argv[1]); out=Path('artifacts/ai-slowdown-longform-v1/final/visual-samples'); out.mkdir(parents=True,exist_ok=True)
          for i,f in enumerate((.05,.25,.50,.75,.95),1):
              t=dur*f
              subprocess.run(['ffmpeg','-y','-hide_banner','-loglevel','error','-ss',str(t),'-i','artifacts/ai-slowdown-longform-v1/final/ai-slowdown-longform-v1.mp4','-frames:v','1',str(out/f'sample-{i}.jpg')],check=True)
          PY
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          files=sorted(Path('artifacts/ai-slowdown-longform-v1/final/visual-samples').glob('*.jpg'))
          sheet=Image.new('RGB',(270*5,480),(235,240,244))
          for i,p in enumerate(files):
              im=Image.open(p).convert('RGB'); im.thumbnail((270,480)); sheet.paste(im,(i*270,0))
          sheet.save('artifacts/ai-slowdown-longform-v1/final/final-contact-sheet.jpg',quality=90)
          PY

      - name: Record completion manifest
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('artifacts/ai-slowdown-longform-v1/final')
          mp4=root/'ai-slowdown-longform-v1.mp4'
          probe=json.loads((root/'ffprobe.json').read_text())
          result={
            'schema':'longform-finished-artifact-v1',
            'mission_id':'20260915-ai-slowdown-longform-v1',
            'status':'MACHINE_GATES_PASS_VISUAL_REREVIEW_PENDING',
            'sha256':hashlib.sha256(mp4.read_bytes()).hexdigest(),
            'bytes':mp4.stat().st_size,
            'duration_seconds':float(probe['format']['duration']),
            'decode_error_count':0,
            'fast_start':True,
            'subtitle_narration_coverage_ratio':1.0,
            'public_publish':False
          }
          (root/'completion.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Upload build evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-slowdown-longform-v1-${{ github.run_id }}
          path: artifacts/ai-slowdown-longform-v1
          if-no-files-found: warn
          retention-days: 7
