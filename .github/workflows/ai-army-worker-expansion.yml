name: "AI army worker expansion: NVIDIA + OpenRouter"

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - .github/worker-expansion-trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: ai-army-worker-expansion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nvidia-worker-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source without write credentials
        uses: actions/checkout@v6
        with:
          ref: ai-army/provider-v3
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile expansion runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m py_compile \
            scripts/run_nvidia_worker_expansion.py \
            scripts/run_nvidia_orchestrator_guarded.py \
            scripts/run_nvidia_orchestrator_mission.py \
            scripts/focused_nvidia_streaming_adapter.py \
            scripts/secure_account_evidence.py \
            scripts/probe_nvidia_google_focused.py \
            scripts/worker_selection.py \
            scripts/probe_free_workers_multi.py \
            scripts/benchmark_free_workers.py \
            scripts/parallel_worker_council.py \
            scripts/failure_aware_specialist_council.py \
            scripts/worker_canary.py \
            scripts/worker_benchmark_ranking.py \
            scripts/openrouter_worker_orchestrator.py \
            scripts/continuous_project_loop.py

      - name: Collect redacted NVIDIA route evidence
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: >-
          python scripts/secure_account_evidence.py
          --provider nvidia
          --output artifacts/secure_account_evidence.json

      - name: Build exact NVIDIA direct-agent admission
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: >-
          python scripts/probe_nvidia_google_focused.py
          --evidence-file artifacts/secure_account_evidence.json
          --output artifacts/provider_probe.json

      - name: Probe broad OpenRouter exact-free worker pool in parallel
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.probe_free_workers_multi import run_multi_probe
          report = run_multi_probe(
              api_key=os.environ.get("OPENROUTER_API_KEY") or "",
              explicit_approval=True,
          )
          Path("artifacts/openrouter_expansion_probe.json").write_text(
              json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "status": report.get("status"),
              "model_calls": report.get("model_calls", 0),
              "verified_free_model_count": report.get("verified_free_model_count", 0),
              "parallel_worker_limit": report.get("parallel_worker_limit", 0),
              "selected_probe_models": report.get("selected_probe_models", []),
          }, sort_keys=True))
          PY

      - name: Benchmark verified workers in parallel
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.benchmark_free_workers import run_benchmarks
          probe = json.loads(Path("artifacts/openrouter_expansion_probe.json").read_text(encoding="utf-8"))
          report = run_benchmarks(
              api_key=os.environ.get("OPENROUTER_API_KEY") or "",
              probe_report=probe,
          )
          Path("artifacts/openrouter_expansion_benchmark.json").write_text(
              json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "status": report.get("status"),
              "model_calls": report.get("model_calls", 0),
              "ready_role_count": report.get("ready_role_count", 0),
              "benchmarked_unique_model_count": report.get("benchmarked_unique_model_count", 0),
              "parallel_worker_limit": report.get("parallel_worker_limit", 0),
          }, sort_keys=True))
          PY

      - name: Canary current winners and build same-run routing policy
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.openrouter_worker_orchestrator import _handoff
          from scripts.worker_canary import run_worker_canary
          from scripts.continuous_project_loop import build_routing_policy, run_resilience_rehearsal

          probe = json.loads(Path("artifacts/openrouter_expansion_probe.json").read_text(encoding="utf-8"))
          benchmark = json.loads(Path("artifacts/openrouter_expansion_benchmark.json").read_text(encoding="utf-8"))
          handoff = _handoff(benchmark)
          seed = {"probe": probe, "benchmark": benchmark, "handoff": handoff}
          canary = run_worker_canary(
              api_key=os.environ.get("OPENROUTER_API_KEY") or "",
              handoff=handoff,
              probe_report=probe,
          )
          routing = build_routing_policy(seed, canary)
          resilience = run_resilience_rehearsal(routing)
          for name, report in (
              ("worker_canary.json", canary),
              ("worker_routing_policy.json", routing),
              ("worker_resilience_rehearsal.json", resilience),
          ):
              Path("artifacts", name).write_text(
                  json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
                  encoding="utf-8",
              )
          print(json.dumps({
              "canary_status": canary.get("status"),
              "canary_calls": canary.get("model_calls", 0),
              "canary_parallel_limit": canary.get("parallel_worker_limit", 0),
              "routing_status": routing.get("status"),
              "ready_role_count": routing.get("ready_role_count", 0),
              "same_run_orchestrator_reselection": routing.get("same_run_orchestrator_reselection", False),
              "resilience_status": resilience.get("status"),
          }, sort_keys=True))
          PY

      - name: Run failure-aware parallel specialist council
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          python scripts/failure_aware_specialist_council.py
          --probe artifacts/openrouter_expansion_probe.json
          --benchmark artifacts/openrouter_expansion_benchmark.json
          --output artifacts/worker_council.json

      - name: Run NVIDIA lead with subordinate council and routing evidence
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          SOURCE_HEAD: ${{ github.sha }}
        run: python scripts/run_nvidia_worker_expansion.py

      - name: Build dynamic AI army worker pool handoff
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          probe = json.loads(Path("artifacts/openrouter_expansion_probe.json").read_text(encoding="utf-8"))
          benchmark = json.loads(Path("artifacts/openrouter_expansion_benchmark.json").read_text(encoding="utf-8"))
          council = json.loads(Path("artifacts/worker_council.json").read_text(encoding="utf-8"))
          canary = json.loads(Path("artifacts/worker_canary.json").read_text(encoding="utf-8"))
          routing = json.loads(Path("artifacts/worker_routing_policy.json").read_text(encoding="utf-8"))
          resilience = json.loads(Path("artifacts/worker_resilience_rehearsal.json").read_text(encoding="utf-8"))
          verified = []
          for row in probe.get("results", []):
              if not isinstance(row, dict) or row.get("status") != "FREE_ACTIVE":
                  continue
              requested = str(row.get("requested_model") or "")
              if requested and row.get("response_model") == requested and row.get("fallback_used") is not True:
                  verified.append(requested)
          pools = {}
          unique_ranked = set()
          for role, ranking in (benchmark.get("rankings") or {}).items():
              if not isinstance(ranking, list):
                  continue
              entries = []
              for item in ranking[:8]:
                  if not isinstance(item, dict) or not item.get("model"):
                      continue
                  model = str(item["model"])
                  unique_ranked.add(model)
                  entries.append({
                      "model": model,
                      "rank": item.get("rank"),
                      "score": item.get("score"),
                      "status": "BENCHMARKED_ROLE_CANDIDATE",
                  })
              if entries:
                  pools[str(role)] = entries
          report = {
              "schema_version": "ai-army-dynamic-worker-pool-v4",
              "source_head": "${{ github.sha }}",
              "nvidia_commander": "nvidia/nemotron-3.5-lightning-30b-a3b",
              "google_policy": "CRITICAL_IMPLEMENTATION_DIFFICULT_DESIGN_FINAL_CRITICAL_REVIEW_ONLY",
              "execution_policy": "PARALLEL_SPECIALISTS_BOUNDED_WORK_STEALING_NVIDIA_SYNTHESIS",
              "verified_free_models": sorted(set(verified)),
              "verified_free_model_count": len(set(verified)),
              "benchmarked_unique_models": sorted(unique_ranked),
              "benchmarked_unique_model_count": len(unique_ranked),
              "council_successful_model_count": int(council.get("successful_model_count", 0) or 0),
              "council_successful_lane_count": int(council.get("successful_lane_count", 0) or 0),
              "council_recovered_lane_count": int(council.get("recovered_lane_count", 0) or 0),
              "council_work_stealing_count": int(council.get("work_stealing_count", 0) or 0),
              "council_parallel_metrics": council.get("parallel_metrics", {}),
              "worker_health": council.get("worker_health", []),
              "canary_status": canary.get("status"),
              "routing_status": routing.get("status"),
              "resilience_status": resilience.get("status"),
              "same_run_orchestrator_reselection": routing.get("same_run_orchestrator_reselection") is True,
              "role_pools": pools,
              "parallel_worker_limit": max(
                  int(probe.get("parallel_worker_limit", 0) or 0),
                  int(benchmark.get("parallel_worker_limit", 0) or 0),
                  int(canary.get("parallel_worker_limit", 0) or 0),
                  int(council.get("parallel_worker_limit", 0) or 0),
              ),
              "generic_openrouter_free_router_allowed": False,
              "provider_automatic_fallback": False,
              "paid_fallback": False,
              "automatic_unverified_activation": False,
              "external_repository_write": False,
          }
          Path("artifacts/ai_army_dynamic_worker_pool.json").write_text(
              json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "verified_free_model_count": report["verified_free_model_count"],
              "benchmarked_unique_model_count": report["benchmarked_unique_model_count"],
              "council_successful_lane_count": report["council_successful_lane_count"],
              "council_recovered_lane_count": report["council_recovered_lane_count"],
              "council_work_stealing_count": report["council_work_stealing_count"],
              "canary_status": report["canary_status"],
              "routing_status": report["routing_status"],
              "resilience_status": report["resilience_status"],
              "parallel_worker_limit": report["parallel_worker_limit"],
              "roles": sorted(report["role_pools"]),
          }, sort_keys=True))
          PY

      - name: Audit repository and result artifacts
        run: |
          set -euo pipefail
          python scripts/audit_secret_safety.py --root .
          python -m json.tool artifacts/mission_state.json >/dev/null
          python -m json.tool artifacts/result_inbox.json >/dev/null
          python -m json.tool artifacts/nvidia_orchestrator_ledger.json >/dev/null
          python -m json.tool artifacts/openrouter_expansion_probe.json >/dev/null
          python -m json.tool artifacts/openrouter_expansion_benchmark.json >/dev/null
          python -m json.tool artifacts/worker_canary.json >/dev/null
          python -m json.tool artifacts/worker_routing_policy.json >/dev/null
          python -m json.tool artifacts/worker_resilience_rehearsal.json >/dev/null
          python -m json.tool artifacts/worker_council.json >/dev/null
          python -m json.tool artifacts/ai_army_dynamic_worker_pool.json >/dev/null

      - name: Upload NVIDIA and OpenRouter expansion result
        uses: actions/upload-artifact@v6
        with:
          name: nvidia-worker-expansion-${{ github.run_id }}
          path: |
            artifacts/secure_account_evidence.json
            artifacts/provider_probe.json
            artifacts/mission_state.json
            artifacts/result_inbox.json
            artifacts/nvidia_orchestrator_ledger.json
            artifacts/openrouter_expansion_probe.json
            artifacts/openrouter_expansion_benchmark.json
            artifacts/worker_canary.json
            artifacts/worker_routing_policy.json
            artifacts/worker_resilience_rehearsal.json
            artifacts/worker_council.json
            artifacts/ai_army_dynamic_worker_pool.json
          retention-days: 7
