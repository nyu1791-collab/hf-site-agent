name: "AI army worker expansion: NVIDIA + OpenRouter"

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - .github/worker-expansion-trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: ai-army-worker-expansion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nvidia-worker-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering source without write credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile expansion runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m py_compile \
            scripts/run_nvidia_worker_expansion.py \
            scripts/run_nvidia_worker_expansion_compact.py \
            scripts/run_nvidia_worker_expansion_self_heal.py \
            scripts/run_nvidia_orchestrator_guarded.py \
            scripts/run_nvidia_orchestrator_mission.py \
            scripts/focused_nvidia_streaming_adapter.py \
            scripts/secure_account_evidence.py \
            scripts/probe_nvidia_google_focused.py \
            scripts/worker_selection.py \
            scripts/probe_free_workers_multi.py \
            scripts/benchmark_free_workers.py \
            scripts/replaceable_agent_organization.py \
            scripts/global_agent_role_optimizer.py \
            scripts/replaceable_agent_scheduler.py \
            scripts/low_latency_agent_fabric.py \
            scripts/replaceable_agent_scheduler_v2.py \
            scripts/independent_agent_runtime.py \
            scripts/independent_agent_scheduler.py \
            scripts/independent_agent_scheduler_probe.py \
            scripts/reconcile_agent_organization.py \
            scripts/parallel_worker_council.py \
            scripts/failure_aware_specialist_council.py \
            scripts/failure_aware_specialist_retry.py \
            scripts/specialist_lane_router.py \
            scripts/organization_coordination.py \
            scripts/organization_feedback.py \
            scripts/update_worker_organization_memory.py \
            scripts/staging_parallel_scheduler.py \
            scripts/staging_parallel_scheduler_probe.py \
            scripts/worker_canary.py \
            scripts/worker_benchmark_ranking.py \
            scripts/openrouter_worker_orchestrator.py \
            scripts/continuous_project_loop.py
          python -m json.tool config/replaceable_agent_organization.json >/dev/null
          python -m unittest \
            tests.test_independent_agent_scheduler \
            tests.test_nvidia_worker_expansion_self_heal -v

      - name: Collect redacted NVIDIA route evidence
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: >-
          python scripts/secure_account_evidence.py
          --provider nvidia
          --output artifacts/secure_account_evidence.json

      - name: Build exact NVIDIA direct-agent admission
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: >-
          python scripts/probe_nvidia_google_focused.py
          --evidence-file artifacts/secure_account_evidence.json
          --output artifacts/provider_probe.json

      - name: Probe broad OpenRouter exact-free worker pool in parallel
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.probe_free_workers_multi import run_multi_probe
          report = run_multi_probe(
              api_key=os.environ.get("OPENROUTER_API_KEY") or "",
              explicit_approval=True,
          )
          Path("artifacts/openrouter_expansion_probe.json").write_text(
              json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "status": report.get("status"),
              "model_calls": report.get("model_calls", 0),
              "verified_free_model_count": report.get("verified_free_model_count", 0),
              "parallel_worker_limit": report.get("parallel_worker_limit", 0),
              "selected_probe_models": report.get("selected_probe_models", []),
          }, sort_keys=True))
          PY

      - name: Benchmark verified workers in parallel
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.benchmark_free_workers import run_benchmarks
          probe = json.loads(Path("artifacts/openrouter_expansion_probe.json").read_text(encoding="utf-8"))
          report = run_benchmarks(
              api_key=os.environ.get("OPENROUTER_API_KEY") or "",
              probe_report=probe,
          )
          Path("artifacts/openrouter_expansion_benchmark.json").write_text(
              json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "status": report.get("status"),
              "model_calls": report.get("model_calls", 0),
              "ready_role_count": report.get("ready_role_count", 0),
              "benchmarked_unique_model_count": report.get("benchmarked_unique_model_count", 0),
              "parallel_worker_limit": report.get("parallel_worker_limit", 0),
          }, sort_keys=True))
          PY

      - name: Reconcile current benchmark into replaceable agent organization
        run: >-
          python scripts/reconcile_agent_organization.py
          --openrouter-probe artifacts/openrouter_expansion_probe.json
          --openrouter-benchmark artifacts/openrouter_expansion_benchmark.json
          --output artifacts/replaceable_agent_organization.json

      - name: Prove independent role-agent mission behavior
        run: >-
          python scripts/independent_agent_scheduler_probe.py
          --organization artifacts/replaceable_agent_organization.json
          --output artifacts/independent_agent_scheduler_probe.json

      - name: Canary current winners and build same-run routing policy
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.openrouter_worker_orchestrator import _handoff
          from scripts.worker_canary import run_worker_canary
          from scripts.continuous_project_loop import build_routing_policy, run_resilience_rehearsal

          probe = json.loads(Path("artifacts/openrouter_expansion_probe.json").read_text(encoding="utf-8"))
          benchmark = json.loads(Path("artifacts/openrouter_expansion_benchmark.json").read_text(encoding="utf-8"))
          handoff = _handoff(benchmark)
          seed = {"probe": probe, "benchmark": benchmark, "handoff": handoff}
          canary = run_worker_canary(
              api_key=os.environ.get("OPENROUTER_API_KEY") or "",
              handoff=handoff,
              probe_report=probe,
          )
          routing = build_routing_policy(seed, canary)
          resilience = run_resilience_rehearsal(routing)
          for name, report in (
              ("worker_canary.json", canary),
              ("worker_routing_policy.json", routing),
              ("worker_resilience_rehearsal.json", resilience),
          ):
              Path("artifacts", name).write_text(
                  json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
                  encoding="utf-8",
              )
          print(json.dumps({
              "canary_status": canary.get("status"),
              "canary_calls": canary.get("model_calls", 0),
              "canary_parallel_limit": canary.get("parallel_worker_limit", 0),
              "routing_status": routing.get("status"),
              "ready_role_count": routing.get("ready_role_count", 0),
              "same_run_orchestrator_reselection": routing.get("same_run_orchestrator_reselection", False),
              "resilience_status": resilience.get("status"),
          }, sort_keys=True))
          PY

      - name: Run history-aware parallel specialist corps
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          python scripts/failure_aware_specialist_retry.py
          --probe artifacts/openrouter_expansion_probe.json
          --benchmark artifacts/openrouter_expansion_benchmark.json
          --output artifacts/worker_council.json

      - name: Build shared blackboard before commander
        env:
          SOURCE_HEAD: ${{ github.sha }}
        run: >-
          python scripts/organization_coordination.py
          --council artifacts/worker_council.json
          --source-head "${SOURCE_HEAD}"
          --mission-id worker-efficiency-${{ github.run_id }}
          --output artifacts/organization_blackboard.json

      - name: Run scope-guarded self-healing NVIDIA lead synthesis
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          SOURCE_HEAD: ${{ github.sha }}
        run: python scripts/run_nvidia_worker_expansion_self_heal.py

      - name: Build dynamic AI army worker pool handoff
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          probe = json.loads(Path("artifacts/openrouter_expansion_probe.json").read_text(encoding="utf-8"))
          benchmark = json.loads(Path("artifacts/openrouter_expansion_benchmark.json").read_text(encoding="utf-8"))
          council = json.loads(Path("artifacts/worker_council.json").read_text(encoding="utf-8"))
          canary = json.loads(Path("artifacts/worker_canary.json").read_text(encoding="utf-8"))
          routing = json.loads(Path("artifacts/worker_routing_policy.json").read_text(encoding="utf-8"))
          resilience = json.loads(Path("artifacts/worker_resilience_rehearsal.json").read_text(encoding="utf-8"))
          replaceable_org = json.loads(Path("artifacts/replaceable_agent_organization.json").read_text(encoding="utf-8"))
          feedback_path = Path("artifacts/organization_feedback.json")
          feedback = json.loads(feedback_path.read_text(encoding="utf-8")) if feedback_path.exists() else {}
          blackboard_path = Path("artifacts/organization_blackboard.json")
          blackboard = json.loads(blackboard_path.read_text(encoding="utf-8")) if blackboard_path.exists() else {}
          agents_path = Path("artifacts/independent_agent_scheduler_probe.json")
          agents = json.loads(agents_path.read_text(encoding="utf-8")) if agents_path.exists() else {}
          heal_path = Path("artifacts/commander_self_heal.json")
          heal = json.loads(heal_path.read_text(encoding="utf-8")) if heal_path.exists() else {}
          verified = []
          for row in probe.get("results", []):
              if not isinstance(row, dict) or row.get("status") != "FREE_ACTIVE":
                  continue
              requested = str(row.get("requested_model") or "")
              if requested and row.get("response_model") == requested and row.get("fallback_used") is not True:
                  verified.append(requested)
          pools = {}
          unique_ranked = set()
          for role, ranking in (benchmark.get("rankings") or {}).items():
              if not isinstance(ranking, list):
                  continue
              entries = []
              for item in ranking[:8]:
                  if not isinstance(item, dict) or not item.get("model"):
                      continue
                  model = str(item["model"])
                  unique_ranked.add(model)
                  entries.append({
                      "model": model,
                      "rank": item.get("rank"),
                      "score": item.get("score"),
                      "status": "BENCHMARKED_ROLE_CANDIDATE",
                  })
              if entries:
                  pools[str(role)] = entries
          replaceable_assignments = {}
          for slot, item in (replaceable_org.get("assignments") or {}).items():
              if not isinstance(item, dict):
                  continue
              replaceable_assignments[str(slot)] = {
                  "status": item.get("status"),
                  "provider": item.get("provider"),
                  "model": item.get("model"),
                  "role_fit": item.get("role_fit"),
                  "required_capability_coverage": item.get("required_capability_coverage"),
                  "swap_decision": (item.get("swap_decision") or {}).get("decision"),
              }
          report = {
              "schema_version": "ai-army-dynamic-worker-pool-v8",
              "source_head": "${{ github.sha }}",
              "nvidia_commander": "nvidia/nemotron-3.5-lightning-30b-a3b",
              "google_policy": "CRITICAL_IMPLEMENTATION_DIFFICULT_DESIGN_FINAL_CRITICAL_REVIEW_ONLY",
              "execution_policy": "INDEPENDENT_ROLE_AGENTS_GLOBAL_REPLACEABLE_ROLES_HISTORY_ROUTING_PARALLEL_SPECIALISTS_WORK_STEALING_BLACKBOARD_FEEDBACK",
              "verified_free_models": sorted(set(verified)),
              "verified_free_model_count": len(set(verified)),
              "benchmarked_unique_models": sorted(unique_ranked),
              "benchmarked_unique_model_count": len(unique_ranked),
              "replaceable_organization_mode": replaceable_org.get("organization_mode"),
              "replaceable_assignment_policy": replaceable_org.get("assignment_policy"),
              "replaceable_role_assignments": replaceable_assignments,
              "replaceable_provider_concurrency": replaceable_org.get("provider_concurrency", {}),
              "replaceable_model_names_are_replaceable": replaceable_org.get("model_names_are_replaceable") is True,
              "replaceable_role_slots_are_stable": replaceable_org.get("role_slots_are_stable") is True,
              "independent_agents": agents.get("independent_agents") is True,
              "independent_agent_count": int(agents.get("independent_agent_count", 0) or 0),
              "agent_generated_task_count": int(agents.get("generated_task_count", 0) or 0),
              "local_revision_without_commander_roundtrip": agents.get("probe", {}).get("code_revised_locally_without_commander_roundtrip") is True,
              "direct_peer_handoff_verified": agents.get("probe", {}).get("qa_received_code_handoff") is True and agents.get("probe", {}).get("synth_received_qa_handoff") is True,
              "stable_role_identity_across_model_swap": agents.get("stable_role_identity_across_model_swap") is True,
              "commander_self_heal": heal,
              "council_primary_successful_lane_count": int(council.get("primary_successful_lane_count", 0) or 0),
              "council_successful_lane_count": int(council.get("successful_lane_count", 0) or 0),
              "council_recovered_lane_count": int(council.get("recovered_lane_count", 0) or 0),
              "council_work_stealing_count": int(council.get("work_stealing_count", 0) or 0),
              "council_parallel_metrics": council.get("parallel_metrics", {}),
              "lane_assignment_policy": council.get("lane_assignment_policy"),
              "redispatch_selection_policy": council.get("redispatch_selection_policy"),
              "organization_memory_loaded": council.get("organization_memory_loaded") is True,
              "blackboard_status": blackboard.get("status"),
              "blackboard_entry_count": int(blackboard.get("entry_count", 0) or 0),
              "blackboard_early_stop": blackboard.get("early_stop", {}),
              "organization_feedback_status": feedback.get("status"),
              "recommended_parallel_worker_limit": feedback.get("recommended_parallel_worker_limit"),
              "next_goals": feedback.get("next_goals", []),
              "worker_health": council.get("worker_health", []),
              "canary_status": canary.get("status"),
              "routing_status": routing.get("status"),
              "resilience_status": resilience.get("status"),
              "same_run_orchestrator_reselection": routing.get("same_run_orchestrator_reselection") is True,
              "role_pools": pools,
              "parallel_worker_limit": max(
                  int(probe.get("parallel_worker_limit", 0) or 0),
                  int(benchmark.get("parallel_worker_limit", 0) or 0),
                  int(canary.get("parallel_worker_limit", 0) or 0),
                  int(council.get("parallel_worker_limit", 0) or 0),
              ),
              "generic_openrouter_free_router_allowed": False,
              "provider_automatic_fallback": False,
              "paid_fallback": False,
              "automatic_unverified_activation": False,
              "external_repository_write": False,
          }
          Path("artifacts/ai_army_dynamic_worker_pool.json").write_text(
              json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "verified_free_model_count": report["verified_free_model_count"],
              "benchmarked_unique_model_count": report["benchmarked_unique_model_count"],
              "replaceable_role_count": sum(item.get("status") == "ASSIGNED" for item in replaceable_assignments.values()),
              "independent_agent_count": report["independent_agent_count"],
              "local_revision_without_commander": report["local_revision_without_commander_roundtrip"],
              "direct_peer_handoff_verified": report["direct_peer_handoff_verified"],
              "commander_final_status": heal.get("final_result_status"),
              "commander_continuations": heal.get("continuation_count", 0),
              "primary_successful_lane_count": report["council_primary_successful_lane_count"],
              "successful_lane_count": report["council_successful_lane_count"],
              "recovered_lane_count": report["council_recovered_lane_count"],
              "blackboard_status": report["blackboard_status"],
              "feedback_status": report["organization_feedback_status"],
              "parallel_worker_limit": report["parallel_worker_limit"],
          }, sort_keys=True))
          PY

      - name: Audit repository and result artifacts
        run: |
          set -euo pipefail
          python scripts/audit_secret_safety.py --root .
          for file in \
            artifacts/mission_state.json \
            artifacts/result_inbox.json \
            artifacts/nvidia_orchestrator_ledger.json \
            artifacts/openrouter_expansion_probe.json \
            artifacts/openrouter_expansion_benchmark.json \
            artifacts/replaceable_agent_organization.json \
            artifacts/independent_agent_scheduler_probe.json \
            artifacts/commander_self_heal.json \
            artifacts/worker_canary.json \
            artifacts/worker_routing_policy.json \
            artifacts/worker_resilience_rehearsal.json \
            artifacts/worker_council.json \
            artifacts/organization_blackboard.json \
            artifacts/staging_parallel_scheduler_probe.json \
            artifacts/organization_feedback.json \
            artifacts/worker_organization_memory_next.json \
            artifacts/ai_army_dynamic_worker_pool.json; do
            python -m json.tool "$file" >/dev/null
          done
          python - <<'PY'
          import json
          from pathlib import Path
          agents = json.loads(Path("artifacts/independent_agent_scheduler_probe.json").read_text(encoding="utf-8"))
          heal = json.loads(Path("artifacts/commander_self_heal.json").read_text(encoding="utf-8"))
          assert agents.get("independent_agents") is True
          assert agents.get("completed_task_count") == 7
          assert agents.get("probe", {}).get("code_revised_locally_without_commander_roundtrip") is True
          assert agents.get("probe", {}).get("qa_received_code_handoff") is True
          assert agents.get("probe", {}).get("synth_received_qa_handoff") is True
          assert heal.get("continuation_count", 0) <= 1
          assert heal.get("unbounded_retry") is False
          assert heal.get("repository_write") is False
          assert heal.get("paid_fallback") is False
          PY

      - name: Upload NVIDIA and OpenRouter expansion result
        uses: actions/upload-artifact@v6
        with:
          name: nvidia-worker-expansion-${{ github.run_id }}
          path: |
            artifacts/secure_account_evidence.json
            artifacts/provider_probe.json
            artifacts/mission_state.json
            artifacts/result_inbox.json
            artifacts/nvidia_orchestrator_ledger.json
            artifacts/openrouter_expansion_probe.json
            artifacts/openrouter_expansion_benchmark.json
            artifacts/replaceable_agent_organization.json
            artifacts/independent_agent_scheduler_probe.json
            artifacts/commander_self_heal.json
            artifacts/worker_canary.json
            artifacts/worker_routing_policy.json
            artifacts/worker_resilience_rehearsal.json
            artifacts/worker_council.json
            artifacts/organization_blackboard.json
            artifacts/staging_parallel_scheduler_probe.json
            artifacts/organization_feedback.json
            artifacts/worker_organization_memory_next.json
            artifacts/ai_army_dynamic_worker_pool.json
          retention-days: 7
