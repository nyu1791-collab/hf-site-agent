name: Migrate Worker admin password to an encrypted secret

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-worker-admin-password.yml"
      - "worker/index.js"

permissions:
  contents: read

concurrency:
  group: sync-worker-admin-password
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_PASSWORD_VALUE: ${{ secrets.WORKER_ADMIN_PASSWORD }}
      WORKER_NAME: groq-github-site-agent

    steps:
      - name: Check out Worker source
        uses: actions/checkout@v4

      - name: Validate required secrets and source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ACCOUNT_ID"
          test -n "$API_TOKEN"
          test -n "$ADMIN_PASSWORD_VALUE"
          test -s worker/index.js
          node --check worker/index.js

      - name: Create or update encrypted password binding
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg text "$ADMIN_PASSWORD_VALUE" '{name:"WORKER_ADMIN_PASSWORD", text:$text, type:"secret_text"}')"
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --retry 3 --retry-all-errors             --connect-timeout 10 --max-time 30             -o "$response_file" -w '%{http_code}'             -X PUT             -H "Authorization: Bearer $API_TOKEN"             -H "Content-Type: application/json"             --data "$payload"             "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets")"
          if [[ "$status" != 2* ]]; then
            echo "Cloudflare rejected the encrypted password update (HTTP $status)." >&2
            jq -r '.errors[]?.message // "No Cloudflare error message returned."' "$response_file" >&2
            exit 1
          fi
          jq -e '.success == true and .result.name == "WORKER_ADMIN_PASSWORD" and .result.type == "secret_text"' "$response_file" >/dev/null
          echo "Encrypted password binding created or updated."

      - name: Load live settings without printing values
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$WORKER_NAME"
          response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors             --connect-timeout 10 --max-time 30             -H "Authorization: Bearer $API_TOKEN"             "$api/settings")"
          printf '%s' "$response" | jq -e '
            .success == true and
            (.result.compatibility_date | type == "string") and
            (.result.bindings | type == "array")
          ' >/dev/null
          settings_file="$RUNNER_TEMP/worker-settings.json"
          printf '%s' "$response" > "$settings_file"
          chmod 600 "$settings_file"
          echo "Live settings loaded; values remain on the runner and are not printed."

      - name: Build migration metadata and remove legacy plaintext binding
        shell: bash
        env:
          SETTINGS_FILE: ${{ runner.temp }}/worker-settings.json
        run: |
          set -euo pipefail
          metadata="$(node - "$SETTINGS_FILE" <<'NODE'
          const fs = require("node:fs");
          const settingsFile = process.argv[2];
          const payload = JSON.parse(fs.readFileSync(settingsFile, "utf8"));
          const settings = payload?.result;
          const bindings = Array.isArray(settings?.bindings) ? settings.bindings : [];
          const durableObject = bindings.find(
            (binding) =>
              binding?.name === "TAVILY_QUOTA" &&
              binding?.type === "durable_object_namespace"
          );
          if (!durableObject) {
            throw new Error("TAVILY_QUOTA Durable Object binding is missing; migration aborted.");
          }
          const plainBindings = bindings
            .filter(
              (binding) =>
                binding?.type === "plain_text" &&
                binding?.name !== "ADMIN_PASSWORD" &&
                binding?.name !== "WORKER_ADMIN_PASSWORD"
            )
            .map((binding) => ({
              type: "plain_text",
              name: binding.name,
              text: binding.text
            }));
          if (plainBindings.some((binding) => typeof binding.name !== "string" || typeof binding.text !== "string")) {
            throw new Error("A live plaintext binding is missing a safe value; migration aborted.");
          }
          const keepBindings = [
            ...new Set(
              bindings
                .map((binding) => binding?.type)
                .filter((type) => type && type !== "plain_text")
            )
          ];
          if (!keepBindings.includes("durable_object_namespace")) {
            throw new Error("Durable Object binding type is missing; migration aborted.");
          }
          const shortSha = process.env.GITHUB_SHA.slice(0, 12);
          const metadata = {
            main_module: "worker.js",
            compatibility_date: settings.compatibility_date,
            compatibility_flags: Array.isArray(settings.compatibility_flags)
              ? settings.compatibility_flags
              : [],
            bindings: plainBindings,
            keep_bindings: keepBindings,
            annotations: {
              "workers/message": "secure admin secret migration " + shortSha,
              "workers/tag": "secure-admin-" + shortSha
            }
          };
          if (typeof settings.usage_model === "string") metadata.usage_model = settings.usage_model;
          if (typeof settings.logpush === "boolean") metadata.logpush = settings.logpush;
          if (Array.isArray(settings.tail_consumers) && settings.tail_consumers.length) {
            metadata.tail_consumers = settings.tail_consumers;
          }
          if (settings.placement && Object.keys(settings.placement).length) {
            metadata.placement = settings.placement;
          }
          process.stdout.write(JSON.stringify(metadata));
          NODE
          )"
          printf '%s' "$metadata" | jq -e '
            .main_module == "worker.js" and
            (.keep_bindings | index("durable_object_namespace") != null) and
            ([.bindings[] | select(.name == "ADMIN_PASSWORD")] | length == 0)
          ' >/dev/null
          printf '%s' "$metadata" > "$RUNNER_TEMP/worker-migration-metadata.json"
          chmod 600 "$RUNNER_TEMP/worker-migration-metadata.json"
          echo "Migration metadata prepared; legacy ADMIN_PASSWORD is excluded."

      - name: Redeploy Worker without the legacy plaintext password
        shell: bash
        env:
          METADATA_FILE: ${{ runner.temp }}/worker-migration-metadata.json
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$WORKER_NAME?bindings_inherit=strict"
          response_file="$RUNNER_TEMP/worker-migration-response.json"
          http_status="$(curl --silent --show-error --retry 3 --retry-all-errors             --connect-timeout 10 --max-time 90             -X PUT             -H "Authorization: Bearer $API_TOKEN"             -F "metadata=<$METADATA_FILE;type=application/json"             -F "worker.js=@worker/index.js;filename=worker.js;type=application/javascript+module"             -o "$response_file" -w "%{http_code}"             "$api")"
          if [[ "$http_status" != 2* ]]; then
            echo "Cloudflare rejected the secure migration upload (HTTP $http_status)." >&2
            jq -c '{success, errors, messages}' "$response_file" >&2 || true
            exit 1
          fi
          jq -e '.success == true' "$response_file" >/dev/null
          echo "Worker redeployed with binding-preserving metadata."

      - name: Verify encrypted password and public health
        shell: bash
        run: |
          set -euo pipefail
          settings="$(curl --fail --silent --show-error --retry 3 --retry-all-errors             -H "Authorization: Bearer $API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings")"
          jq -e '
            .success == true and
            ([.result.bindings[] | select(.name == "WORKER_ADMIN_PASSWORD" and .type == "secret_text")] | length == 1) and
            ([.result.bindings[] | select(.name == "ADMIN_PASSWORD" and .type == "plain_text")] | length == 0) and
            ([.result.bindings[] | select(.name == "TAVILY_QUOTA" and .type == "durable_object_namespace")] | length == 1)
          ' <<<"$settings" >/dev/null
          health="$(curl --fail --silent --show-error --retry 3 --retry-all-errors             --connect-timeout 10 --max-time 20             "https://groq-github-site-agent.n-yu1791.workers.dev/health")"
          printf '%s' "$health" | jq -e '
            .ok == true and
            .service == "groq-github-site-agent" and
            (.research.missing | type == "array")
          ' >/dev/null
          echo "Encrypted password, Durable Object binding, and public health verified."
