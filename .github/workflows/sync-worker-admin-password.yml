name: Sync Worker admin password securely

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-worker-admin-password.yml"

permissions:
  contents: read

concurrency:
  group: sync-worker-admin-password
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_PASSWORD: ${{ secrets.WORKER_ADMIN_PASSWORD }}
      WORKER_NAME: groq-github-site-agent
    steps:
      - name: Validate required secrets
        run: |
          set -euo pipefail
          test -n "$ACCOUNT_ID"
          test -n "$API_TOKEN"
          test -n "$ADMIN_PASSWORD"

      - name: Replace the Worker password binding with a Cloudflare Secret
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg text "$ADMIN_PASSWORD" '{name:"ADMIN_PASSWORD", text:$text, type:"secret_text"}')"
          response="$(curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors \
            -X PUT \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets")"
          jq -e '.success == true and .result.name == "ADMIN_PASSWORD" and .result.type == "secret_text"' <<<"$response" >/dev/null

      - name: Verify encrypted binding type without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          settings="$(curl --fail --silent --show-error --retry 2 --retry-all-errors \
            -H "Authorization: Bearer $API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings")"
          jq -e '.success == true and ([.result.bindings[] | select(.name == "ADMIN_PASSWORD" and .type == "secret_text")] | length == 1)' <<<"$settings" >/dev/null
          echo "ADMIN_PASSWORD is now a Cloudflare Secret."
