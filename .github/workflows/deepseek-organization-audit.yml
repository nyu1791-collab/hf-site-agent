name: DeepSeek organization architecture audit

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - .github/deepseek-organization-audit-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseek-organization-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering source without write credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile and test organization audit
        run: |
          set -euo pipefail
          python -m py_compile scripts/deepseek_organization_audit.py
          python -m unittest tests.test_deepseek_organization_audit -v

      - name: Verify audit dry-run is network inert
        run: |
          set -euo pipefail
          python scripts/deepseek_organization_audit.py \
            --output artifacts/deepseek_organization_audit_dry_run.json
          python -m json.tool artifacts/deepseek_organization_audit_dry_run.json >/dev/null

      - name: Run explicitly approved paid DeepSeek architecture audit
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/deepseek_organization_audit.py \
            --network \
            --confirm DEEPSEEK_ORGANIZATION_AUDIT \
            --output artifacts/deepseek_organization_audit.json
          python -m json.tool artifacts/deepseek_organization_audit.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/deepseek_organization_audit.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "status": report.get("status"),
              "requested_model": report.get("requested_model"),
              "response_model": report.get("response_model"),
              "model_calls": report.get("model_calls", 0),
              "validation": report.get("validation", {}),
              "estimated_current_cost_usd": report.get("estimated_current_cost_usd", 0),
              "conservative_cost_usd": report.get("conservative_cost_usd", 0),
          }, sort_keys=True))
          assert report.get("status") in {"AUDIT_READY", "AUDIT_PARTIAL"}
          assert int(report.get("model_calls", 0)) == 1
          assert report.get("generic_paid_fallback") is False
          assert report.get("production_routing_changed") is False
          assert report.get("repository_write") is False
          assert float(report.get("conservative_preflight_cost_usd", 0)) <= float(report.get("max_conservative_cost_usd", 0.06))
          PY

      - name: Audit repository for secret literals
        run: python scripts/audit_secret_safety.py --root .

      - name: Upload paid architecture audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deepseek-organization-audit-${{ github.run_id }}
          path: |
            artifacts/deepseek_organization_audit_dry_run.json
            artifacts/deepseek_organization_audit.json
          if-no-files-found: warn
          retention-days: 7
