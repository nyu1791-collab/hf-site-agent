name: "AI Army efficiency and supervisor contract check"

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - config/ai_army_org_chart.json
      - config/agent_efficiency_policy.json
      - config/deepseek_paid_supervisor_policy.json
      - scripts/agent_architecture_admission.py
      - scripts/agent_efficiency_eval.py
      - scripts/deepseek_supervisor_research.py
      - schemas/agent_failure_event.schema.json
      - schemas/deepseek_supervisor_mission.schema.json
      - .github/workflows/deepseek-supervisor-research.yml
      - .github/workflows/agent-efficiency-policy-check.yml
  pull_request:
    paths:
      - config/ai_army_org_chart.json
      - config/agent_efficiency_policy.json
      - config/deepseek_paid_supervisor_policy.json
      - scripts/agent_architecture_admission.py
      - scripts/agent_efficiency_eval.py
      - scripts/deepseek_supervisor_research.py
      - schemas/agent_failure_event.schema.json
      - schemas/deepseek_supervisor_mission.schema.json
      - .github/workflows/deepseek-supervisor-research.yml
      - .github/workflows/agent-efficiency-policy-check.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Static JSON and Python checks
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/agent_architecture_admission.py \
            scripts/agent_efficiency_eval.py \
            scripts/deepseek_supervisor_research.py
          python - <<'PY'
          import json
          from pathlib import Path
          for name in [
              'config/ai_army_org_chart.json',
              'config/agent_efficiency_policy.json',
              'config/deepseek_paid_supervisor_policy.json',
              'schemas/agent_failure_event.schema.json',
              'schemas/deepseek_supervisor_mission.schema.json',
          ]:
              json.loads(Path(name).read_text(encoding='utf-8'))
          assert not Path('config/agent_org_chart.json').exists(), 'duplicate org chart must remain removed'
          org=json.loads(Path('config/ai_army_org_chart.json').read_text())
          assert org['status']=='CANONICAL'
          assert org['hierarchy']['depth_0']['agent']=='chatgpt-work'
          assert org['hierarchy']['depth_1']['role']=='EXECUTIVE_SUPERVISOR'
          assert org['hierarchy']['depth_1']['default_bulk_coding'] is False
          assert org['control_plane']['machine_oracle_over_majority_vote'] is True
          print('Static policy checks: PASS')
          PY

      - name: Test deterministic shadow architecture admission
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('scripts/agent_architecture_admission.py')
          spec=importlib.util.spec_from_file_location('admission',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          seq=m.advise({'task_class':'ARCHITECTURE','dependency_shape':'SEQUENTIAL','mutation_scope':'READ_ONLY','independent_workstreams':1})
          assert seq['architecture']=='SINGLE_CONTROLLER'
          assert seq['use_paid_deepseek_supervisor'] is True
          par=m.advise({'task_class':'RESEARCH','dependency_shape':'PARALLEL','mutation_scope':'DISJOINT','independent_workstreams':3})
          assert par['architecture']=='CENTRALIZED_MANAGER_WITH_SPECIALISTS'
          assert par['recommended_parallel_direct_workstreams']==3
          assert par['use_paid_deepseek_supervisor'] is True
          shared=m.advise({'task_class':'MEDIA_RESEARCH','dependency_shape':'MIXED','mutation_scope':'SAME_TARGET','independent_workstreams':3,'high_impact':True})
          assert shared['architecture']=='CENTRALIZED_MANAGER_READ_ONLY_FANOUT_SINGLE_WRITER'
          assert shared['single_writer_required'] is True
          assert shared['independent_verifier_required'] is True
          det=m.advise({'task_class':'VALIDATION','dependency_shape':'PARALLEL','mutation_scope':'READ_ONLY','independent_workstreams':5,'deterministic':True})
          assert det['architecture']=='SINGLE_CONTROLLER_WITH_DETERMINISTIC_TOOLS'
          assert det['use_paid_deepseek_supervisor'] is False
          print('Architecture admission fixtures: PASS')
          PY

      - name: Test efficiency evaluator does not promote worse treatment
        run: |
          set -euo pipefail
          cat > /tmp/eff.jsonl <<'EOF'
          {"architecture":"SINGLE_CONTROLLER","success":true,"acceptance_pass":true,"latency_ms":1000,"tokens":1000,"requests":2,"estimated_cost_usd":0.01,"retry_count":0,"escaped_defects":0}
          {"architecture":"SINGLE_CONTROLLER","success":true,"acceptance_pass":true,"latency_ms":1100,"tokens":1050,"requests":2,"estimated_cost_usd":0.01,"retry_count":0,"escaped_defects":0}
          {"architecture":"CENTRALIZED_MANAGER_WITH_SPECIALISTS","success":true,"acceptance_pass":true,"latency_ms":1500,"tokens":3000,"coordination_tokens":900,"requests":7,"estimated_cost_usd":0.05,"retry_count":1,"escaped_defects":1}
          {"architecture":"CENTRALIZED_MANAGER_WITH_SPECIALISTS","success":false,"acceptance_pass":false,"latency_ms":1600,"tokens":3200,"coordination_tokens":950,"requests":8,"estimated_cost_usd":0.05,"retry_count":1,"escaped_defects":1}
          EOF
          python scripts/agent_efficiency_eval.py /tmp/eff.jsonl > /tmp/report.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/report.json'))
          assert r['comparison']['status']=='MEASURED'
          assert r['comparison']['promotion_candidate'] is False
          assert r['comparison']['guardrails_non_worse'] is False
          print('Efficiency evaluator negative-control fixture: PASS')
          PY

      - name: Validate supervisor runner contract without any paid call
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('ds','scripts/deepseek_supervisor_research.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          policy=json.loads(Path('config/deepseek_paid_supervisor_policy.json').read_text())
          mission={
              'mission_id':'ci-offline-supervisor-fixture',
              'scope':'DEEPSEEK_EXECUTIVE_SUPERVISOR',
              'objective':'offline contract validation only; never call provider',
              'shared_evidence':[],
              'lanes':[{'id':'research','objective':'review one bounded research question for offline validation'}],
              'synthesize':False,
              'max_parallel_calls':1,
              'max_calls':1,
              'max_estimated_cost_usd':0.05,
              'known_estimated_daily_spend_before_mission_usd':0,
              'chatgpt_final_adjudication_required':True,
              'repository_write':False,'deploy':False,'publish':False,'merge':False,
              'secret_mutation':False,'auto_top_up':False,'generic_paid_fallback':False,'paid_media_generation':False,
          }
          cfg=m._validate_mission(policy,mission)
          assert cfg['max_parallel']==1
          assert cfg['synthesize'] is False
          assert policy['hierarchy']['deepseek_is_bulk_coding_worker'] is False
          print('DeepSeek supervisor offline contract: PASS')
          print('No provider API call was made.')
          PY

      - name: Verify paid research workflow is mission-scoped rather than branch-wide
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/deepseek-supervisor-research.yml').read_text()
          assert 'missions/deepseek-supervisor/*.json' in text
          assert 'DEEPSEEK_API_KEY' in text
          assert 'persist-credentials: false' in text
          assert 'known_estimated_daily_spend_before_mission_usd' in text
          assert 'generic_paid_fallback' in text
          print('Mission-scoped paid workflow contract: PASS')
          PY
