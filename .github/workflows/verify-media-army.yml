name: Verify media agent army

on:
  pull_request:
    paths:
      - config/media_agent_organization.json
      - scripts/media_agent_runtime.py
      - scripts/run_nvidia_media_org_audit.py
      - tests/test_media_agent_runtime.py
      - tests/test_nvidia_media_org_audit.py
      - docs/MEDIA_AGENT_ARMY.md
      - .github/workflows/verify-media-army.yml
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - config/media_agent_organization.json
      - scripts/media_agent_runtime.py
      - scripts/run_nvidia_media_org_audit.py
      - tests/test_media_agent_runtime.py
      - tests/test_nvidia_media_org_audit.py
      - docs/MEDIA_AGENT_ARMY.md
      - .github/workflows/verify-media-army.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source without write credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile media runtime
        run: >-
          python -m py_compile
          scripts/media_agent_runtime.py
          scripts/run_nvidia_media_org_audit.py
          tests/test_media_agent_runtime.py
          tests/test_nvidia_media_org_audit.py

      - name: Validate media config
        run: python -m json.tool config/media_agent_organization.json >/dev/null

      - name: Run media runtime tests
        run: python -m unittest tests.test_media_agent_runtime tests.test_nvidia_media_org_audit -v

      - name: Produce deterministic no-publish connector canary
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cat > artifacts/media_metadata_canary.json <<'JSON'
          {
            "youtube": {
              "title": "Safe canary title",
              "caption": "Safe canary caption",
              "media_ready": true,
              "media_count": 1,
              "media_type": "video"
            }
          }
          JSON
          python scripts/media_agent_runtime.py \
            --platform youtube \
            --connected-platform youtube \
            --plugin descript \
            --plugin fal \
            --plugin runway \
            --free-gpu-worker \
            --rights-status verified \
            --metadata-file artifacts/media_metadata_canary.json \
            --output artifacts/media_agent_plan.json
          python -m json.tool artifacts/media_agent_plan.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('artifacts/media_agent_plan.json').read_text(encoding='utf-8'))
          tasks = {row['task_id']: row for row in p['tasks']}
          plugins = p['connector_state']['plugin_state']
          assert p['connector_state']['snapshot']['fresh'] is True
          assert p['rights_gate']['ready'] is True
          assert p['metadata_validation']['youtube']['ready'] is True
          assert plugins['descript'] is True
          assert plugins['fal'] is True
          assert plugins['runway'] is True
          assert p['connector_state']['creative_generation']['fal'] is False
          assert p['connector_state']['creative_generation']['runway'] is False
          assert p['connector_state']['video_editing']['fal'] is False
          assert p['connector_state']['video_editing']['runway'] is False
          assert p['selected_routes']['generation'] == 'NOT_REQUIRED'
          assert tasks['metadata_youtube']['state'] == 'READY'
          assert tasks['publish_youtube']['state'] == 'APPROVAL_REQUIRED'
          assert tasks['strategy_feedback']['depends_on'] == ['monetization']
          assert p['direct_publish_executed'] is False
          assert p['production_active'] is False
          assert p['hard_boundaries']['fresh_connector_evidence_required'] is True
          assert p['hard_boundaries']['rights_and_disclosure_required'] is True
          assert p['hard_boundaries']['platform_metadata_validation_required'] is True
          assert p['hard_boundaries']['installed_plugin_implies_paid_execution_approval'] is False
          assert p['hard_boundaries']['generic_paid_fallback'] is False
          assert p['hard_boundaries']['auto_top_up'] is False
          PY
