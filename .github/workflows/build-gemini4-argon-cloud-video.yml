name: Build Gemini 4 Argon cloud video without external device

on:
  workflow_dispatch:
    inputs:
      content_run_id:
        description: Unique video job ID (reuse only to recover this same job)
        required: true
        type: string
      mission:
        description: Path to the fresh source-backed mission in this checkout
        required: true
        type: string
        default: missions/media/20261005-gemini4-argon-cloud-v1.json

permissions:
  contents: read
  actions: read

concurrency:
  group: gemini4-argon-cloud-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OUT: artifacts/gemini4-argon-cloud
      CACHE: .media-cache/assets
      HF_VIDEO_CACHE_ROOT: /home/runner/.cache/hf-site-agent
      MISSION: ${{ inputs.mission }}
      CONTENT_RUN_ID: ${{ inputs.content_run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Fail-fast static preflight
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, json
          from pathlib import Path
          identity = os.environ['CONTENT_RUN_ID']
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]{0,127}', identity), 'invalid content_run_id'
          mission_path = Path(os.environ['MISSION']).resolve()
          assert mission_path.is_relative_to(Path.cwd()), 'mission path escapes checkout'
          mission = json.loads(mission_path.read_text())
          assert mission.get('content_run_id', identity) == identity, 'mission/job identity mismatch'
          assert mission.get('scenes'), 'mission scenes required'
          PY
          python3 -m py_compile             scripts/build_gemini4_argon_cloud_video.py             scripts/synthesize_longform_voicevox.py             scripts/render_reusable_landscape.py             scripts/validate_video_content_contract.py
          python3 -m json.tool "$MISSION" >/dev/null
          python3 -m json.tool config/approved_landscape_video_template.json >/dev/null
          python3 -m json.tool config/media_speed_quality_policy.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          profile=json.loads(Path("config/approved_landscape_video_template.json").read_text())
          assert profile["layout"]["width"] == 1280
          assert profile["layout"]["height"] == 720
          assert profile["layout"]["fps"] == 15
          assert profile["performance"]["default_execution_lanes"] == 1
          assert profile["performance"]["maximum_independent_preparation_lanes"] == 2
          assert profile["performance"]["ffmpeg_encoder_concurrency"] == 1
          print("STATIC_PREFLIGHT_OK")
          PY

      - name: Restore reusable media caches
        uses: actions/cache@v4
        with:
          path: |
            .media-cache/assets
            /home/runner/.cache/hf-site-agent/characters
            /home/runner/.cache/hf-site-agent/official-assets
          key: gemini4-landscape-v4-${{ runner.os }}-zm-shell-20230806
          restore-keys: |
            gemini4-landscape-v4-${{ runner.os }}-
            gemini4-landscape-v3-${{ runner.os }}-

      - name: Restore this job's successful checkpoints
        id: job-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/gemini4-argon-cloud
            /home/runner/.cache/hf-site-agent/voicevox-wav/${{ inputs.content_run_id }}
          key: video-job-${{ runner.os }}-${{ inputs.content_run_id }}-${{ hashFiles(inputs.mission) }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            video-job-${{ runner.os }}-${{ inputs.content_run_id }}-${{ hashFiles(inputs.mission) }}-

      - name: Reuse a finished job before tool or engine startup
        id: finished
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path(os.environ['OUT'])
          completion_path = out / 'completion.json'
          ready = False
          if completion_path.is_file():
              done = json.loads(completion_path.read_text())
              video = out / 'Gemini4_Argon_landscape.mp4'
              assert done['content_run_id'] == os.environ['CONTENT_RUN_ID']
              assert done['mission_sha256'] == hashlib.sha256(Path(os.environ['MISSION']).read_bytes()).hexdigest()
              assert done['status'] == 'READY_TO_PUBLISH_INTERNAL_ONLY'
              assert video.is_file() and video.stat().st_size == done['bytes'] and done['bytes'] > 0
              digest = hashlib.sha256()
              with video.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              assert digest.hexdigest() == done['sha256'], 'completed artifact changed; do not re-encode'
              ready = True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write('ready=' + str(ready).lower() + '\n')
          PY

      - name: Install only missing media tools
        if: steps.finished.outputs.ready != 'true'
        run: |
          set -euo pipefail
          missing=()
          command -v ffmpeg >/dev/null || missing+=(ffmpeg)
          fc-match 'Noto Sans CJK JP' 2>/dev/null | grep -qi 'Noto' || missing+=(fonts-noto-cjk fontconfig)
          if (( ${#missing[@]} )); then
            sudo apt-get update -y
            sudo apt-get install -y "${missing[@]}"
          fi
          python3 - <<'PY' || python3 -m pip install --disable-pip-version-check --no-input pillow
          import PIL
          print(PIL.__version__)
          PY
          mkdir -p "$OUT" "$CACHE" "$HF_VIDEO_CACHE_ROOT"

      - name: Resolve Zundamon and Metan shell cache-first
        if: steps.finished.outputs.ready != 'true'
        run: |
          set -euo pipefail
          python3 scripts/media_asset_resolver.py             --asset-id zm_shell_20230806             --cache-root "$CACHE"             --allow-network             --max-workers 1             --manifest-out "$OUT/character-shell.json"
          RAW="$(python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('artifacts/gemini4-argon-cloud/character-shell.json').read_text())
          p=m['results'][0].get('extracted_path')
          assert p and Path(p).is_dir(), p
          print(p)
          PY
          )"
          python3 scripts/character_shell_root.py "$RAW" > "$OUT/character-shell-root.txt"

      - name: Start one local VOICEVOX engine
        if: steps.finished.outputs.ready != 'true'
        run: |
          set -euo pipefail
          if curl -fsS http://127.0.0.1:50021/version >/dev/null 2>&1; then
            echo "VOICEVOX_ALREADY_READY"
            exit 0
          fi
          IMAGE=voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          docker image inspect "$IMAGE" >/dev/null 2>&1 || docker pull "$IMAGE"
          docker run -d --name voicevox -p 127.0.0.1:50021:50021 "$IMAGE"
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then
              curl -fsS http://127.0.0.1:50021/version
              exit 0
            fi
            sleep 1
          done
          docker logs voicevox || true
          exit 1

      - name: Build Gemini 4 Argon longform through canonical one-pass renderer
        if: steps.finished.outputs.ready != 'true'
        run: |
          set -euo pipefail
          SHELL_ROOT="$(cat "$OUT/character-shell-root.txt")"
          python3 scripts/build_gemini4_argon_cloud_video.py \
            --mission "$MISSION" --content-run-id "$CONTENT_RUN_ID" \
            --shell-root "$SHELL_ROOT" --output-dir "$OUT" \
            --voicevox-url http://127.0.0.1:50021

      - name: Collect verified delivery (builder already ran the mechanical gate)
        run: |
          set -euo pipefail
          FINAL="$OUT/Gemini4_Argon_landscape.mp4"
          test -s "$FINAL"
          python3 - <<'PY'
          import json
          from pathlib import Path
          completion=json.loads(Path('artifacts/gemini4-argon-cloud/completion.json').read_text())
          assert completion['status'] == 'READY_TO_PUBLISH_INTERNAL_ONLY'
          print({'status':'PASS','duration_seconds':completion['duration_seconds']})
          PY

      - name: Preserve this job's checkpoints after success or failure
        if: always() && steps.job-cache.outcome == 'success' && steps.finished.outputs.ready != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            artifacts/gemini4-argon-cloud
            /home/runner/.cache/hf-site-agent/voicevox-wav/${{ inputs.content_run_id }}
          key: video-job-${{ runner.os }}-${{ inputs.content_run_id }}-${{ hashFiles(inputs.mission) }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload finished MP4 and build report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gemini4-argon-landscape-${{ inputs.content_run_id }}-${{ github.run_id }}
          path: |
            artifacts/gemini4-argon-cloud/Gemini4_Argon_landscape.mp4
            artifacts/gemini4-argon-cloud/Gemini4_Argon_landscape.report.json
            artifacts/gemini4-argon-cloud/STATE.json
            artifacts/gemini4-argon-cloud/completion.json
            artifacts/gemini4-argon-cloud/presentation.json
            artifacts/gemini4-argon-cloud/timing.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
