name: Build Gemini 4 Argon cloud video without external device

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gemini4-argon-cloud-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUT: artifacts/gemini4-argon-cloud
      CACHE: .media-cache/assets
      MISSION: missions/media/20261005-gemini4-argon-cloud-v1.json
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install deterministic local media toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-cjk fontconfig
          python -m pip install --disable-pip-version-check --no-input pillow
          mkdir -p "$OUT" "$CACHE"

      - name: Restore reusable character asset cache
        uses: actions/cache@v4
        with:
          path: .media-cache/assets
          key: media-assets-${{ runner.os }}-v1-zm-shell-20230806
          restore-keys: |
            media-assets-${{ runner.os }}-v1-

      - name: Resolve Zundamon and Metan shell cache-first
        run: |
          set -euo pipefail
          python scripts/media_asset_resolver.py             --asset-id zm_shell_20230806             --cache-root "$CACHE"             --allow-network             --max-workers 1             --manifest-out "$OUT/character-shell.json"
          RAW="$(python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('artifacts/gemini4-argon-cloud/character-shell.json').read_text())
          p=m['results'][0].get('extracted_path')
          assert p and Path(p).is_dir(), p
          print(p)
          PY
          )"
          python scripts/character_shell_root.py "$RAW" > "$OUT/character-shell-root.txt"

      - name: Start local VOICEVOX in GitHub runner
        run: |
          set -euo pipefail
          docker pull voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          docker run -d --name voicevox -p 50021:50021 voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then
              curl -fsS http://127.0.0.1:50021/version
              exit 0
            fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1

      - name: Build Gemini 4 Argon video locally on hosted runner
        run: |
          set -euo pipefail
          SHELL_ROOT="$(cat "$OUT/character-shell-root.txt")"
          python scripts/build_gemini4_argon_cloud_video.py             --mission "$MISSION"             --shell-root "$SHELL_ROOT"             --output-dir "$OUT"             --voicevox-url http://127.0.0.1:50021

      - name: Minimum mechanical delivery gate
        run: |
          set -euo pipefail
          FINAL="$OUT/Gemini4_Argon_10min.mp4"
          test -s "$FINAL"
          ffprobe -v error -show_streams -show_format -of json "$FINAL" > "$OUT/ffprobe.json"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/gemini4-argon-cloud/ffprobe.json').read_text())
          v=[x for x in d['streams'] if x['codec_type']=='video']
          a=[x for x in d['streams'] if x['codec_type']=='audio']
          assert v and a
          dur=float(d['format']['duration'])
          assert 420 <= dur <= 720, dur
          print({'status':'PASS','duration_seconds':dur,'video':v[0]['codec_name'],'audio':a[0]['codec_name']})
          PY

      - name: Upload finished MP4 and build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini4-argon-cloud-video-${{ github.run_id }}
          path: |
            artifacts/gemini4-argon-cloud/Gemini4_Argon_10min.mp4
            artifacts/gemini4-argon-cloud/Gemini4_Argon_10min.report.json
            artifacts/gemini4-argon-cloud/completion.json
            artifacts/gemini4-argon-cloud/ffprobe.json
            artifacts/gemini4-argon-cloud/presentation.json
            artifacts/gemini4-argon-cloud/timing.json
          if-no-files-found: warn
          retention-days: 7
