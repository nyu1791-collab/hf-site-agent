name: Run one commander-approved OpenRouter worker safely

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type COMMANDER_APPROVE only after reviewing the handoff packet
        required: true
        type: string
      probe_confirm:
        description: Type PROBE_FREE_WORKERS to permit the bounded current-catalog probe
        required: true
        type: string
      task_id:
        description: Stable task ID from the approved handoff packet
        required: true
        type: string
      role:
        description: Specialist role for this one draft-only task
        required: true
        type: choice
        options:
          - research
          - data
          - media
          - long-context
          - fact-check
          - planning
          - product
          - content
          - video
          - code
          - qa
          - metrics
      parent_agent_id:
        description: Direct provider commander that owns this specialist task
        required: true
        type: choice
        options:
          - google-general-commander
          - nvidia-engineering-commander
          - groq-rapid-commander
      instruction:
        description: Commander-approved task instruction (no secrets; maximum 5000 characters)
        required: true
        type: string
      context:
        description: Optional approved context (maximum 6000 characters)
        required: false
        default: ""
        type: string
      acceptance:
        description: Optional acceptance tests (maximum 3000 characters)
        required: false
        default: ""
        type: string
permissions:
  contents: read

concurrency:
  group: commander-approved-agent-task
  cancel-in-progress: false

jobs:
  execute:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate commander approval and draft-only scope
        env:
          REF_NAME: ${{ github.ref_name }}
          CONFIRM: ${{ inputs.confirm }}
          PROBE_CONFIRM: ${{ inputs.probe_confirm }}
          TASK_ID: ${{ inputs.task_id }}
          TASK_INSTRUCTION: ${{ inputs.instruction }}
          TASK_CONTEXT: ${{ inputs.context }}
          TASK_ACCEPTANCE: ${{ inputs.acceptance }}
          PARENT_AGENT_ID: ${{ inputs.parent_agent_id }}
        shell: bash
        run: |
          set -euo pipefail
          CONFIRM="$(printf '%s' "$CONFIRM" | tr -d '[:space:]')"
          if [[ "$REF_NAME" != "main" ]]; then
            echo "Commander-approved tasks are allowed only from main." >&2
            exit 1
          fi
          if [[ "$CONFIRM" != "COMMANDER_APPROVE" ]]; then
            echo "Type COMMANDER_APPROVE only after the commander reviews the packet." >&2
            exit 1
          fi
          PROBE_CONFIRM="$(printf '%s' "$PROBE_CONFIRM" | tr -d '[:space:]')"
          if [[ "$PROBE_CONFIRM" != "PROBE_FREE_WORKERS" ]]; then
            echo "Type PROBE_FREE_WORKERS to permit the bounded current-catalog probe." >&2
            exit 1
          fi
          if [[ -z "$TASK_ID" || ${#TASK_ID} -gt 100 || "$TASK_ID" =~ [[:space:]] ]]; then
            echo "Task ID is empty, too long, or contains whitespace." >&2
            exit 1
          fi
          if [[ -z "$TASK_INSTRUCTION" || ${#TASK_INSTRUCTION} -gt 5000 ]]; then
            echo "Task instruction must be 1-5000 characters." >&2
            exit 1
          fi
          if [[ ${#TASK_CONTEXT} -gt 6000 || ${#TASK_ACCEPTANCE} -gt 3000 ]]; then
            echo "Task context or acceptance tests exceed the allowed size." >&2
            exit 1
          fi
          echo "Commander approval and bounded free-worker probe consent validated; specialist remains draft-only."

      - name: Check out reviewed specialist script
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Discover and verify one current Worker per role
        env:
          OPENROUTER_API_KEY: ${{ secrets.AI_API_KEY }}
          FREE_WORKER_PROBE_OUTPUT: artifacts/free_worker_probe.json
        shell: bash
        run: |
          set -euo pipefail
          python scripts/probe_free_workers.py --network

      - name: Run one specialist draft
        env:
          OPENROUTER_API_KEY: ${{ secrets.AI_API_KEY }}
          TASK_ID: ${{ inputs.task_id }}
          TASK_ROLE: ${{ inputs.role }}
          TASK_INSTRUCTION: ${{ inputs.instruction }}
          TASK_CONTEXT: ${{ inputs.context }}
          TASK_ACCEPTANCE: ${{ inputs.acceptance }}
          PARENT_AGENT_ID: ${{ inputs.parent_agent_id }}
          WORKER_PROBE_PATH: artifacts/free_worker_probe.json
          AGENT_PACKET_PATH: artifacts/agent_task_packet.json
        shell: bash
        run: |
          set -euo pipefail
          python scripts/agent_executor.py

      - name: Upload specialist artifact for commander review
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: agent-task-${{ inputs.task_id }}
          path: artifacts/agent_task_packet.json
          if-no-files-found: error
          retention-days: 7
