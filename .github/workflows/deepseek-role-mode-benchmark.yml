name: DeepSeek role-mode efficiency benchmark

on:
  push:
    branches:
      - ai-army/provider-v3
    paths:
      - .github/deepseek-role-mode-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseek-role-mode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile role-mode benchmark
        run: python -m py_compile scripts/deepseek_role_mode_benchmark.py

      - name: Run deterministic benchmark tests
        run: python -m unittest tests.test_deepseek_role_mode_benchmark -v

      - name: Verify benchmark dry-run
        run: |
          python scripts/deepseek_role_mode_benchmark.py --output artifacts/deepseek_role_mode_dry_run.json
          python -m json.tool artifacts/deepseek_role_mode_dry_run.json >/dev/null

      - name: Run approved DeepSeek role-mode A B benchmark
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/deepseek_role_mode_benchmark.py \
            --network \
            --confirm DEEPSEEK_ROLE_MODE_BENCHMARK \
            --output artifacts/deepseek_role_mode_benchmark.json
          python -m json.tool artifacts/deepseek_role_mode_benchmark.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/deepseek_role_mode_benchmark.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "status": report.get("status"),
              "success_rate": report.get("success_rate"),
              "successful_variant_count": report.get("successful_variant_count"),
              "prompt_cache_hit_rate": report.get("prompt_cache_hit_rate"),
              "estimated_current_cost_usd": report.get("estimated_current_cost_usd"),
              "conservative_cost_usd": report.get("conservative_cost_usd"),
              "role_winners": report.get("role_winners"),
          }, sort_keys=True))
          assert report.get("generic_paid_fallback") is False
          assert report.get("production_routing_changed") is False
          assert float(report.get("conservative_cost_usd", 0)) <= float(report.get("max_estimated_cost_usd", 0.15))
          PY

      - name: Upload role-mode evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deepseek-role-mode-${{ github.run_id }}
          path: |
            artifacts/deepseek_role_mode_dry_run.json
            artifacts/deepseek_role_mode_benchmark.json
          if-no-files-found: ignore
          retention-days: 7
