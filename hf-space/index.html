<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Web Site Agent</title><link rel="stylesheet" href="./style.css"></head>
<body><main>
<p class="eyebrow">GROQ × GITHUB</p><h1>AI Web Site Agent</h1><p class="lead">業種テンプレートから始め、計画・生成・レビュー・承認・更新を安全に繰り返します。</p>
<label for="template">業種別テンプレート（任意）</label><select id="template"><option value="">選択してください</option><option value="local_business">小規模事業者・店舗</option><option value="game_community">ゲーム・コミュニティ</option><option value="creator">個人制作者</option></select>
<label for="instruction">作りたいサイト・更新内容</label><textarea id="instruction" rows="8" placeholder="例：ゲーム攻略サイトのトップページ。黒と紫、スマホ優先、カード3枚とFAQを入れて。"></textarea>
<div class="actions"><button id="reuse" class="secondary">前回内容を再利用</button><button id="clear-metrics" class="secondary">端末内指標を消去</button></div>
<p id="metrics" class="note" aria-live="polite"></p>
<label class="research-option"><input id="research" type="checkbox"> 生成時に最新情報をWeb検索する（無料枠・最大10件）</label><p class="note">検索は必要な時だけ実行します。無料枠終了後は自動停止し、課金検索は実行しません。</p>
<label for="password">操作パスワード</label><input id="password" type="password" autocomplete="current-password" placeholder="Cloudflareに登録した操作パスワード"><p class="note">パスワードは保存しません。</p>
<section class="plan-panel"><h2>引用付きコンテンツ計画</h2><p>計画だけ先に作り、引用元を確認してから生成へ進めます。引用は未信頼データとして扱います。</p><label class="research-option"><input id="plan-research" type="checkbox"> 無料Web検索を使って引用を取得する</label><button id="plan" class="secondary">計画を作成</button><div id="plan-output" class="plan-output" hidden></div></section>
<section class="commander-panel"><h2>司令部</h2><p>Qwen部隊・DeepSeek部隊・専門AIの準備状況を確認できます。</p><button id="check-commander" class="secondary">部隊の準備状況を確認</button><div id="commander-status" class="commander-status" hidden></div></section>
<button id="generate">コードを生成</button><p id="status" role="status" aria-live="polite"></p><section id="result" hidden><h2 id="site-title"></h2><p id="site-summary"></p><div id="files"></div><button id="review" class="secondary">DeepSeekでレビュー</button><pre id="review-output" class="review-output" hidden></pre><label class="confirm"><input id="confirmed" type="checkbox"> コード内容を確認した。指定GitHubへPushしてよい</label><button id="publish" class="secondary">GitHubへPush</button></section>
</main><script src="./config.js"></script><script src="./app.js"></script></body></html>
